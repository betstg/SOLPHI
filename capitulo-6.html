<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Capítulo não liberado — SOLPHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--panel:#10161e;--ink:#e8e5dd;--soft:#9aa4ae;--gold:#4de3ff;--rule:#1b2530}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;box-sizing:border-box}
.card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:40px 28px;text-align:center}
.lock{font-size:34px}
h1{font-size:19px;margin:14px 0 8px;letter-spacing:.04em}
p{color:var(--soft);font-size:14.5px;line-height:1.6;margin:0 0 24px}
a{display:inline-block;color:var(--bg);background:var(--gold);text-decoration:none;font-weight:600;
font-size:14px;padding:11px 22px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <h1>Este capítulo ainda não foi liberado</h1>
  <p>A prévia de SOLPHI vai até o capítulo 4. Os próximos chegam em breve.</p>
  <a href="./">Voltar à leitura</a>
</div>
</body>
</html>
