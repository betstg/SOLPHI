<!doctype html>
<html lang="pt" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fffaf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120e" media="(prefers-color-scheme: dark)">
<title>Acessos — A Gaiola Dourada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf2; --bg2:#f6efe2; --ink:#2b2620; --soft:#6a5f52; --faint:#a89a86;
  --gold:#b08968; --gold2:#c9a26a; --rule:#e2d6c2; --shadow:rgba(60,45,25,.16);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15120e; --bg2:#1d1813; --ink:#e8e0d2; --soft:#b6a892; --faint:#7d7261;
    --gold:#d8b483; --gold2:#e0bd86; --rule:#332b21; --shadow:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Lora',Georgia,serif; -webkit-font-smoothing:antialiased;
  min-height:100svh; display:flex; align-items:center; justify-content:center;
  padding:28px; text-align:center;
}
.wrap{position:relative; max-width:460px; width:100%}
.glow{
  position:absolute; width:120vmin; height:120vmin; border-radius:50%;
  top:50%; left:50%; transform:translate(-50%,-60%);
  background:radial-gradient(circle, color-mix(in srgb,var(--gold) 16%, transparent) 0%, transparent 60%);
  pointer-events:none; z-index:0;
}
.card{position:relative; z-index:1}
.kicker{letter-spacing:.5em; font-size:12px; text-transform:uppercase; color:var(--gold);
  margin:0 0 6px; padding-left:.5em}
.title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(26px,7vw,38px);
  line-height:1; margin:0 0 26px}
.rule{width:70px; height:1px; background:var(--rule); margin:0 auto 30px; position:relative}
.rule::before{content:"\2726"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  color:var(--gold2); font-size:13px; background:var(--bg); padding:0 8px}
.num{font-family:'Cormorant Garamond',serif; font-weight:600;
  font-size:clamp(64px,22vw,120px); line-height:1; color:var(--ink);
  letter-spacing:.01em; min-height:1em}
.num.loading{color:var(--faint); font-size:clamp(30px,10vw,48px)}
.label{letter-spacing:.32em; font-size:13px; text-transform:uppercase; color:var(--soft);
  margin-top:14px}
.foot{margin-top:34px; font-style:italic; color:var(--faint); font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="card">
    <p class="kicker">SOLPHI</p>
    <h1 class="title">A Gaiola Dourada</h1>
    <div class="rule"></div>
    <div class="num loading" id="num">…</div>
    <div class="label">acessos ao site</div>
    <p class="foot">Página privada. Atualiza a cada visita da capa.</p>
  </div>
</div>
<script>
(function(){
  var el = document.getElementById("num");
  function render(n){
    el.classList.remove("loading");
    el.textContent = new Intl.NumberFormat("pt-BR").format(n);
  }
  fetch("https://abacus.jasoncameron.dev/get/betstg-solphi-gaiola/acessos")
    .then(function(r){ return r.json(); })
    .then(function(d){ render((d && typeof d.value === "number") ? d.value : 0); })
    .catch(function(){ el.classList.remove("loading"); el.textContent = "—"; el.style.color = "var(--faint)"; });
})();
</script>
</body>
</html>
