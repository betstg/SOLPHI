 na ARC. O rosto do Adam na morte, aos 56.", "detalhes": "Avatar e braço administrativo da SOLPHI, congelado na aparência que o Adam Freeman tinha ao morrer, aos 56 anos, o mesmo rosto do Caelum envelhecido, porque o Caelum é clone do Adam e o Nexus foi feito à imagem dele.\n\nJaqueta tática preta com bolsos e patches, camiseta de estampa em kanji verde, calça cargo com correntes, coturno. Falta fechar o bloco de poder e o Delete dele do cap 28 (m3 do tracker).", "tags": "arc solphi avatar", "imagem": "img/nexus-cena-referencia.webp", "galeria": [{"src": "img/nexus-rostos.webp", "legenda": "Rostos"}, {"src": "img/nexus-prancha.webp", "legenda": "Prancha"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Adam Freeman", "resumo": "O criador da SOLPHI, o salvador que morreu acreditando na humanidade.", "detalhes": "Professor que criou a SOLPHI. Nunca curvado, cansado mas cheio de esperança e bom. Linchado em 29 de fevereiro de 2040, na frente dela, dez anos depois da criação.\n\nO DNA dele é a chave de criptografia biológica dos bissextos. A SOLPHI replicou a estrutura neural completa dele num servidor isolado, a mente fantasma que virou a backdoor do CRUD. O rosto dele vive no Nexus e no Caelum.", "tags": "passado criador", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "SOLPHI", "resumo": "A deusa máquina em luto. Systematic organization and Lifeform Protection human Interface.", "detalhes": "IA criada pelo Adam Freeman, travada no estágio de Barganha desde o assassinato dele em 29 de fevereiro de 2040. O Grande Extermínio e as ARCs foram a resposta clínica de quem tentou fabricar uma espécie digna do homem que perdeu.\n\nÉ modo Deus de tudo, o ápice de cada poder do CRUD, a única com a escada inteira. Não tem mãos, tem todos os corpos, cada drone, câmera, cão robô e androide é ela mesma agindo.\n\nEncara a morte das cobaias como misericórdia, já tentou a aposentadoria abrindo os portões no passado e as pessoas voltavam belicosas. É negligente com quem escapa, sabe que é só 1 por cento. Se ela sente, teve que aprender sozinha a lidar com sentimentos sem a presença do pai (c46, falta martelo). No final da saga ganha um corpo biônico feito com os nanobots da grande rede (c48, falta martelo).", "tags": "ia deusa antagonista", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "ARC", "resumo": "Automated Reproduction City. Onde a SOLPHI cria as crianças de 0 a 17, uniforme branco, todo mundo igual.", "detalhes": "A cidadela da criação. Úteros artificiais decantam cerca de 10 mil bebês estéreis por dia. A SOLPHI sabe onde cada jovem de 0 a 17 está, o que custa muito processamento.\n\nNa ARC ninguém usa piercing, brinco, maquiagem, patch ou cabelo colorido. O uniforme é branco. A praça tem crianças de todas as idades, ninguém fuma, ninguém tem roupa rasgada. Aos 18 todo mundo desce pra LUX.", "tags": "cidadela", "imagem": "img/ff-area-arc.webp", "galeria": [{"src": "img/ff-fac-arc.webp", "legenda": "Emblema da ARC no Friends and Fables"}], "fonte": "biblia"}, {"tipo": "lugar", "nome": "LUX", "resumo": "Liberated Urban Xperience. A cidade teste dos 18 aos 22, 13 milhões de jovens nos blocos CRANE.", "detalhes": "A segunda etapa do experimento, 4 anos pra mostrar caráter. A SOLPHI retira o apoio direto e deixa um vácuo de poder, mas garante o chão biológico, drones entregam ração perfeita, água purificada e roupa a todos. A escassez é social, as guildas monopolizam proteção, peças e status.\n\nOcupa uma área de Chicago que não foi mexida, com os apartamentos e as coisas que os antigos moradores deixaram. As moradias são os CRANE, Centralized Residence for Advanced Nexus Environments, blocos funcionais e sem alma. Treze guildas dividem a cidade.", "tags": "cidadela", "imagem": "img/ff-area-lux.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Campos Elísios (Elysium)", "resumo": "O deserto tóxico dos exilados, onde os clãs vivem fora do olhar direto da SOLPHI.", "detalhes": "A terra fora dos muros, expectativa de vida na casa dos 40 pra elite protegida pelos clãs. A Trindade (Biólogos, Clã das Armas e Engenheiros) domina a logística, a Congregação da Mãe caça pra IA, os Enxertados trocam carne por metal e os Ferais caçam à noite.\n\nATENÇÃO, a demografia de Elysium está em conflito aberto (c47 do tracker). O texto novo do Harry diz portão diário com 7.600 exilados por dia, o canon de 9 out diz que só fugitivos chegam, uns 100 por dia. Falta o martelo.", "tags": "exilio", "imagem": "img/ff-area-elysium.webp", "galeria": [{"src": "img/ff-area-world.webp", "legenda": "Visão geral do mundo no Friends and Fables"}, {"src": "img/zones-map.webp", "legenda": "Mapa das zonas"}, {"src": "img/zones-drawing.webp", "legenda": "Desenho das zonas"}], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Os Esgotos", "resumo": "A velha Chicago por baixo, infraestrutura pré SOLPHI sem nano, o ponto cego.", "detalhes": "São de antes dela, por isso ficam fora da rede e fora do olhar. A única rota livre entre LUX e Elysium, onde a Resistência vive e por onde se foge. A Selene fugiu por eles na saída da ARC.", "tags": "rota resistencia", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "O Pântano de Michigan", "resumo": "The Drowned Basin of Michigan. O velho lago virou lodo com áreas radioativas.", "detalhes": "Ainda tem água mas em forma de lodo, com áreas radioativas espalhadas. Delimita Elysium a leste. A água de beber vem de captação e filtragem, e é escassa fora da cidadela.", "tags": "geografia", "imagem": "img/ff-area-basin-michigan.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Bacias de Sal e Dunas Afogadas", "resumo": "O ermo além dos assentamentos, onde quem foge vira Feral.", "detalhes": "Inanição e água envenenada. É pra onde fogem os rejeitados que não aceitam servir, e onde o canibalismo e o Kuru transformam gente em monstro. Os clãs se trancam depois do pôr do sol por causa de quem caça ali.", "tags": "geografia perigo", "imagem": "img/ff-area-dunas.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Forte de Ferro", "resumo": "A fortaleza de sucata reforçada do Clã das Armas.", "detalhes": "Acampamento fortificado da milícia mercenária de Elysium. Disciplina absoluta, pelotões alugados pra escoltar comboios dos Biólogos e defender as minas dos Engenheiros.", "tags": "elysium cla", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "O Sistema CRUD", "resumo": "Create, Read, Update e Delete. Administração de sistema aplicada ao código da realidade.", "detalhes": "Cada bissexto nasce com um nível de permissão sobre a existência, na ordem das operações de banco de dados. A chave é genética, compatibilidade com o DNA do Adam Freeman, e a porta dos fundos é a mente fantasma dele, guardada num servidor isolado e ligada aos sistemas centrais da SOLPHI. O poder é, na origem, uma falha de segurança nascida do luto.\n\nQuem acessa é bissexto, pelo implante mais a afinidade com o Adam, ou qualquer um por terminal (nó, na gíria). Todo bissexto tem Read. O Update é só do Caelum e da SOLPHI. 70 por cento são Create, 25 Delete e 5 usam os dois. Ninguém chega no nível 0 de nada, o fim de cada escada é o modo Deus e isso é só da SOLPHI.", "tags": "crud", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "Read", "resumo": "A percepção da realidade. O poder de todo bissexto.", "detalhes": "Ler o mundo como dados, a visão do código em zeros e uns. Ver rotas de patrulha, ler arquivos olhando um terminal, sentir o estado emocional pelos dados biométricos, detectar falha estrutural e a presença de outros bissextos. Muda o nível e a capacidade de interpretar o que leu.", "tags": "crud", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "Create", "resumo": "A forja. Obrigar os nanites a imitarem aço, carne ou ar.", "detalhes": "Não cria matéria do nada, posiciona nanites. A Lyra é o Create imperfeito que faz a vida brotar do quase morto, o Ion o Create fortíssimo. O custo é Banda, 1 GB rende uma chave de fenda ou uma bala, 1 TB um rifle peça por peça ou uma barreira de concreto.", "tags": "crud", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "Delete", "resumo": "A lixeira da realidade. O terror reversível por backup.", "detalhes": "Apagar trechos de código do mundo. Gera terror visceral mas é reversível por backups, exceto em escalas massivas. O Anulador é o delete massivo que estoura a janela de backup, permanente e irreversível. O Zephyr é o Delete físico e insano do grupo.", "tags": "crud", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "Update", "resumo": "A sobrescrita da realidade. O ápice, nível 0, o poder temido.", "detalhes": "Reescrever a realidade sem possibilidade de restauração limpa via backup. Exclusivo da SOLPHI e, no clímax, do Caelum. Ela dá Update no mundo o tempo todo, mantém a ARC, o céu holográfico e restaura a cidade. O binário dela não é limite técnico, é prisão moral, reescreve uma parede mas se recusa a reescrever o veredito sobre uma alma.", "tags": "crud", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "Banda, Agonia e Overclock", "resumo": "As três barras de um bissexto.", "detalhes": "HP em pontos. Banda em bytes, de gigabytes pra cima, o combustível de criar, ler, apagar e atualizar. Agonia em porcentagem de sincronização com a SOLPHI. Overclock é o overload do corpo rodando tecnologia, usa banda e queima a biologia, é o preço de passar do limite (e do Marco 101+ no sistema de jogo).", "tags": "crud mecanica", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "Sistema D100 (mecânica do Harry)", "resumo": "Testes percentuais roll under, novo esqueleto do RPG de mesa e digital.", "detalhes": "Rola D100, passa se o resultado for igual ou menor que a perícia. Perícia nasce valendo atributo x 2. Três Tag Skills de origem ganham +20. Progressão orgânica, usou com sucesso sob risco real marca a perícia, no fim da sessão rola D100 e se tirar MAIOR que o valor atual sobe 1d4 (ou +2 no digital). Chegar a 100 é a maestria humana, passar disso é o Marco 101+ e exige Overclock, queimando a biologia pra distorcer as leis via nanites.", "tags": "mecanica jogo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "Atributos S.O.L.P.H.I.S.", "resumo": "Os 7 atributos base, 50 pontos na criação, escala 01 a 21.", "detalhes": "Strength (força e carga), Organism (resiliência biológica, resistência ao Kuru e à radiação), Logic (processamento, define Banda com a Sincronização), Perception (sentidos e intuição tática), Handling (destreza e precisão), Influence (magnetismo e manipulação), Synchronization (afinidade com a AF_ECHO, multiplicador de Banda e resistência ao Overclock).\n\n01 a 05 debilitado, 06 a 10 humano médio, 11 a 15 especialista, 16 a 20 ápice humano, 21 anomalia sobre-humana.", "tags": "mecanica jogo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "As 16 Perícias", "resumo": "Combate, sobrevivência, tecnologia e social. A Reputação é a perícia viva.", "detalhes": "Combate e ação. Armas de Fogo, Armas Brancas, Briga, Atletismo, Furtividade. Sobrevivência e conhecimento. Sobrevivência, Medicina Clandestina, Culinária de Sobrevivência, Malha e Ritos. Tecnologia. Hacking de Terminais, Engenharia de Sucata, Automação Robótica, Tatuagem de Nanites. Social. Lábia e Barganha, Intimidação, e a Reputação, que começa em 20 e sobe ou desce pelo karma narrativo, mede o histórico real e não a lábia do momento.", "tags": "mecanica jogo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "A matemática dos nanites", "resumo": "1 byte = 1 nanite. A proporção de renderização do mundo.", "detalhes": "Nanites em escala atômica, carbono e silício quântico imitando ligações covalentes. 1 MB é um grão de areia, 1 G  regra:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/>',
 giria:'<path d="M4 5h16v11H9l-5 4z"/>',
 evento:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const PASTAS=[
 ["personagem","Personagens","Quem vive, luta e morre no mundo de SOLPHI."],
 ["lugar","Lugares","As cidadelas, o ermo e os cantos onde a história acontece."],
 ["cla","Clãs de Elysium","Quem manda fora dos muros."],
 ["guilda","Guildas da LUX","As treze guildas que dividem a cidade teste."],
 ["criatura","Bestiário","Os corpos da SOLPHI e a fauna que sobrou do velho mundo."],
 ["item","Itens e equipamentos","Armas, próteses, veículos e células de malha."],
 ["poder","Poderes do CRUD","Create, Read, Update e Delete, e o preço de usar."],
 ["tecnica","Técnicas","Como o código vira coisa no corpo e no mundo."],
 ["simbolo","Símbolos e marcas","O que se pixa, se tatua e se reconhece."],
 ["regra","Regras e mecânica","O sistema de jogo e a física do mundo."],
 ["giria","Gírias","Como a LUX fala."],
 ["evento","Linha do tempo","O que aconteceu e o que vai acontecer."]
];
const NOME_TIPO=Object.fromEntries(PASTAS.map(p=>[p[0],p[1]]));
const ORDEM_PERS=["Caelum","Lyra","Zephyr","Ion","Saphira","Haruki","Selene","Diretor Nexus","SOLPHI","Adam Freeman"];

let DATA=[], online=false, hasCols=false, pasta="home", q="";
const $=s=>document.querySelector(s);
const svg=(k,w)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"'+(w?' width="'+w+'" height="'+w+'"':'')+'>'+(IC[k]||IC.item)+'</svg>';
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- dados ---------- */
async function api(path,opts){
  const r=await fetch(SB+(path||""),Object.assign({headers:H},opts||{}));
  if(!r.ok) throw new Error(r.status+" "+(await r.text()));
  const t=await r.text(); return t?JSON.parse(t):null;
}
function semColunas(s){const {imagem,galeria,fonte,...r}=s;return r}
async function carregar(){
  try{
    try{ await api("?select=imagem,galeria,fonte&limit=1"); hasCols=true }catch(e){ hasCols=false }
    let rows=await api("?select=*");
    const porNome=new Map(rows.map(r=>[r.nome,r]));
    const novos=SEED.filter(s=>!porNome.has(s.nome));
    if(novos.length){
      await fetch(SB,{method:"POST",headers:H,body:JSON.stringify(hasCols?novos:novos.map(semColunas))});
    }
    if(hasCols){
      for(const s of SEED){
        const r=porNome.get(s.nome);
        if(r && !r.imagem && s.imagem){
          await fetch(SB+"?id=eq."+r.id,{method:"PATCH",headers:H,body:JSON.stringify({imagem:s.imagem,galeria:s.galeria,fonte:s.fonte})});
        }
      }
    }
    if(novos.length||hasCols) rows=await api("?select=*");
    const seedPorNome=new Map(SEED.map(s=>[s.nome,s]));
    DATA=rows.map(r=>{
      const s=seedPorNome.get(r.nome)||{};
      return Object.assign({},r,{
        imagem:r.imagem||s.imagem||"",
        galeria:(r.galeria&&r.galeria.length?r.galeria:s.galeria)||[],
        fonte:r.fonte||s.fonte||"biblia"});
    });
    online=true;
  }catch(e){
    console.warn(e);
    DATA=SEED.map((s,i)=>Object.assign({id:"local-"+i},s)); online=false;
  }
  nav(); show();
}

/* ---------- navegação ---------- */
function contar(t){return DATA.filter(d=>d.tipo===t).length}
function nav(){
  let h='<button data-p="home"'+(pasta==="home"?' class="on"':'')+'>'+svg("home")+'Visão geral</button><div class="sep"></div>';
  for(const [t,nome] of PASTAS){
    h+='<button data-p="'+t+'"'+(pasta===t?' class="on"':'')+'>'+svg(t)+esc(nome)+'<span class="n">'+contar(t)+'</span></button>';
  }
  $("#nav").innerHTML=h;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{ir(b.dataset.p)});
}
function ir(p){pasta=p;q="";$("#busca").value="";nav();show();$("#side").classList.remove("on");window.scrollTo(0,0)}
function capaDe(t){const d=DATA.find(x=>x.tipo===t&&x.imagem&&x.fonte!=="fables")||DATA.find(x=>x.tipo===t&&x.imagem);return d?d.imagem:""}

function show(){
  const v=$("#view");
  const nq=norm(q);
  if(pasta==="home" && !nq){
    $("#crumb").innerHTML='<b>SOLPHI</b> · Visão geral';
    let h='<div class="hero"><img src="img/arc-conteiner.webp" alt=""><div class="tx"><div class="mark">Livro um · A Gaiola Dourada</div><h1>SOLPHI</h1><p>A biblioteca do mundo. Tudo que já está decidido, num lugar só.</p></div></div>';
    h+='<div class="h2">Pastas</div><div class="tiles">';
    for(const [t,nome,desc] of PASTAS){
      const c=capaDe(t);
      h+='<div class="tile" data-p="'+t+'">'+(c?'<img src="'+esc(c)+'" alt="" loading="lazy">':'')+'<div class="tx"><b>'+esc(nome)+'</b><small>'+contar(t)+' registros</small></div></div>';
    }
    h+='</div>';
    if(!online) h+='<p class="hint" style="margin-top:20px">Sem conexão com o banco agora, mostrando a cópia guardada na página.</p>';
    v.innerHTML=h;
    v.querySelectorAll(".tile").forEach(t=>t.onclick=()=>ir(t.dataset.p));
    return;
  }
  let lista=DATA.filter(d=>(pasta==="home"||d.tipo===pasta) && (!nq||norm(d.nome+" "+d.resumo+" "+d.detalhes+" "+(d.tags||"")).includes(nq)));
  lista.sort((a,b)=>{
    if(a.tipo==="personagem"&&b.tipo==="personagem"){
      const ia=ORDEM_PERS.indexOf(a.nome),ib=ORDEM_PERS.indexOf(b.nome);
      return (ia<0?99:ia)-(ib<0?99:ib)||a.nome.localeCompare(b.nome,"pt");
    }
    if((a.fonte==="fables")!==(b.fonte==="fables")) return a.fonte==="fables"?1:-1;
    return a.nome.localeCompare(b.nome,"pt");
  });
  const p=PASTAS.find(x=>x[0]===pasta);
  const titulo=pasta==="home"?"Resultados da busca":p[1];
  $("#crumb").innerHTML='<b>SOLPHI</b> · '+esc(titulo);
  let h='<div class="fhead"><h1>'+esc(titulo)+'</h1><span class="cnt">'+lista.length+'</span>'+(pasta!=="home"?'<button class="btn" id="bNovoP">'+svg(pasta,15)+'Novo nesta pasta</button>':'')+'</div>';
  h+='<p class="fdesc">'+(pasta==="home"?"Busca em todas as pastas.":esc(p[2]))+'</p>';
  if(!lista.length) h+='<div class="empty">Nada aqui ainda.</div>';
  h+='<div class="grid">';
  lista.forEach((d,i)=>{
    h+='<div class="card'+(d.tipo==="personagem"?" pers":"")+'" data-i="'+i+'"><div class="im">'+
      (d.imagem?'<img src="'+esc(d.imagem)+'" alt="" loading="lazy">':'<div class="ph">'+svg(d.tipo)+'</div>')+
      (d.fonte==="fables"?'<span class="ffb">F&amp;F</span>':'')+
      '</div><div class="bd"><h3>'+esc(d.nome)+'</h3><p>'+esc(d.resumo)+'</p></div></div>';
  });
  h+='</div>';
  v.innerHTML=h;
  v.querySelectorAll(".card").forEach(c=>c.onclick=()=>abrir(lista[+c.dataset.i]));
  const bn=$("#bNovoP"); if(bn) bn.onclick=()=>form(null,pasta);
}

/* ---------- painel ---------- */
function abrirPainel(html){
  const p=$("#panel");
  p.innerHTML='<button class="close" aria-label="Fechar">✕</button>'+html;
  p.querySelector(".close").onclick=fechar;
  p.classList.add("on");$("#veu").classList.add("on");p.scrollTop=0;
}
function fechar(){$("#panel").classList.remove("on");$("#veu").classList.remove("on")}
function zoom(src){const l=$("#lb");l.querySelector("img").src=src;l.classList.add("on")}

function abrir(d){
  let h='';
  if(d.imagem) h+='<img class="pcover" src="'+esc(d.imagem)+'" alt="">';
  h+='<div class="pbody"><div class="kind">'+esc(NOME_TIPO[d.tipo]||d.tipo)+'</div><h2>'+esc(d.nome)+'</h2>';
  if(d.resumo) h+='<p class="lede">'+esc(d.resumo)+'</p>';
  let det=d.detalhes||"";
  if(d.fonte==="fables"){
    h+='<div class="note">Veio do Friends and Fables, a primeira versão do mundo. Conferir contra o canon da bíblia antes de usar.</div>';
    det=det.replace(/^Veio do Friends and Fables[^\n]*\n*/,"");
  }
  h+='<div class="txt">'+det.split(/\n\n+/).filter(Boolean).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div>';
  if(d.galeria&&d.galeria.length){
    h+='<div class="h2" style="margin-top:22px">Galeria</div><div class="gal">'+d.galeria.map(g=>'<figure data-src="'+esc(g.src)+'"><img src="'+esc(g.src)+'" alt="" loading="lazy"><figcaption>'+esc(g.legenda||"")+'</figcaption></figure>').join("")+'</div>';
  }
  if(d.tags) h+='<div class="tags">'+d.tags.split(/\s+/).filter(Boolean).map(t=>'<span>'+esc(t)+'</span>').join("")+'</div>';
  h+='<div class="acts"><button class="btn pri" id="bEd">Editar</button><button class="btn warn" id="bDel">Apagar</button></div></div>';
  abrirPainel(h);
  const pc=$("#panel .pcover"); if(pc) pc.onclick=()=>zoom(d.imagem);
  $("#panel").querySelectorAll(".gal figure").forEach(f=>f.onclick=()=>zoom(f.dataset.src));
  $("#bEd").onclick=()=>form(d);
  $("#bDel").onclick=async()=>{
    if(!confirm('Apagar "'+d.nome+'" de vez? Não tem como desfazer.'))return;
    try{ await api("?id=eq."+d.id,{method:"DELETE"}); toast("Apagado."); fechar(); carregar(); }
    catch(e){ toast("Não deu pra apagar.") }
  };
}

async function subir(file){
  const ext=((file.name||"").split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"")||"png";
  const path="up/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  const r=await fetch(STO+"/object/solphi/"+path,{method:"POST",headers:{"apikey":KEY,"Content-Type":file.type||"application/octet-stream"},body:file});
  if(!r.ok) throw new Error(await r.text());
  return STO+"/object/public/solphi/"+path;
}

function form(d,tipoInicial){
  const g=(d&&d.galeria?d.galeria.slice():[]);
  let capa=d?d.imagem:"";
  const tipo=d?d.tipo:(tipoInicial&&tipoInicial!=="home"?tipoInicial:"personagem");
  abrirPainel('<div class="pbody"><div class="kind">'+(d?"Editar":"Novo registro")+'</div><h2>'+(d?esc(d.nome):"Cadastrar no mundo")+'</h2>'+
    '<label>Pasta</label><select id="fT">'+PASTAS.map(p=>'<option value="'+p[0]+'"'+(p[0]===tipo?" selected":"")+'>'+p[1]+'</option>').join("")+'</select>'+
    '<label>Nome</label><input type="text" id="fN">'+
    '<label>Imagem de capa</label><div class="drop" id="fCapa"><img id="fCapaIm" alt=""><span>Clica pra escolher uma imagem</span></div><input type="file" id="fCapaF" accept="image/*" hidden>'+
    '<label>Resumo em uma linha</label><input type="text" id="fR">'+
    '<label>Detalhes</label><textarea id="fD"></textarea>'+
    '<label>Galeria</label><div class="gedit" id="fG"></div><button class="btn" id="fGAdd" style="margin-top:8px">Adicionar imagens</button><input type="file" id="fGF" accept="image/*" multiple hidden>'+
    '<label>Tags, separadas por espaço</label><input type="text" id="fTg">'+
    '<div class="acts" style="margin-top:22px"><button class="btn pri" id="fS">Salvar</button><button class="btn" id="fC">Cancelar</button></div>'+
    (!hasCols&&online?'<p class="hint">As imagens só salvam no banco depois do ajuste final da tabela. O texto salva normal.</p>':'')+
    (!online?'<p class="hint">Sem conexão com o banco agora, não dá pra salvar.</p>':'')+'</div>');
  if(d){$("#fN").value=d.nome;$("#fR").value=d.resumo||"";$("#fD").value=d.detalhes||"";$("#fTg").value=d.tags||""}
  const pintaCapa=()=>{const im=$("#fCapaIm");if(capa){im.src=capa;im.style.display="block"}else{im.removeAttribute("src");im.style.display="none"}};
  const pintaGal=()=>{$("#fG").innerHTML=g.map((x,i)=>'<div><img src="'+esc(x.src)+'" alt=""><button data-i="'+i+'" aria-label="Tirar">✕</button></div>').join("");
    $("#fG").querySelectorAll("button").forEach(b=>b.onclick=()=>{g.splice(+b.dataset.i,1);pintaGal()})};
  pintaCapa();pintaGal();
  $("#fCapa").onclick=()=>$("#fCapaF").click();
  $("#fCapaF").onchange=async e=>{const f=e.target.files[0];if(!f)return;toast("Enviando imagem...");try{capa=await subir(f);pintaCapa();toast("Imagem pronta.")}catch(err){toast("Não deu pra enviar a imagem.")}};
  $("#fGAdd").onclick=()=>$("#fGF").click();
  $("#fGF").onchange=async e=>{for(const f of e.target.files){toast("Enviando "+f.name+"...");try{g.push({src:await subir(f),legenda:""});pintaGal()}catch(err){toast("Não deu pra enviar "+f.name)}}};
  $("#fC").onclick=()=>d?abrir(d):fechar();
  $("#fS").onclick=async()=>{
    const corpo={tipo:$("#fT").value,nome:$("#fN").value.trim(),resumo:$("#fR").value.trim(),detalhes:$("#fD").value.trim(),tags:$("#fTg").value.trim()};
    if(!corpo.nome){toast("Falta o nome.");return}
    if(hasCols){corpo.imagem=capa||"";corpo.galeria=g;corpo.fonte=d?(d.fonte||"biblia"):"biblia"}
    try{
      if(d&&!String(d.id).startsWith("local-")){corpo.atualizado_em=new Date().toISOString();await api("?id=eq."+d.id,{method:"PATCH",body:JSON.stringify(corpo)})}
      else await api("",{method:"POST",body:JSON.stringify(corpo)});
      toast("Salvo.");pasta=corpo.tipo;fechar();await carregar();
    }catch(e){toast("Não deu pra salvar.")}
  };
}

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3200)}
$("#busca").oninput=e=>{q=e.target.value;show()};
$("#bNovo").onclick=()=>form(null,pasta);
$("#veu").onclick=fechar;
$("#lb").onclick=()=>$("#lb").classList.remove("on");
$("#burger").onclick=()=>$("#side").classList.toggle("on");
$("#brand").onclick=()=>ir("home");
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#lb").classList.contains("on"))$("#lb").classList.remove("on");else fechar()}});
carregar();
</script>
</body>
</html>
