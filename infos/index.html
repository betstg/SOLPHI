<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SOLPHI · Infos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b; --bg2:#0f141b; --panel:#10161e; --panel2:#141c26;
  --ink:#e8e5dd; --soft:#9aa4ae; --faint:#66707b;
  --gold:#4de3ff; --gold2:#7cc9ff; --rule:#1b2530; --sel:rgba(77,227,255,.14);
  --ember:#c8842f; --shadow:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;min-height:100vh}
::selection{background:rgba(77,227,255,.24)}
button{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{width:250px;flex:none;background:var(--bg2);border-right:1px solid var(--rule);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 30px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;cursor:pointer}
.brand .mk{width:34px;height:34px;border-radius:9px;background:radial-gradient(circle at 50% 40%,rgba(77,227,255,.35),transparent 70%),var(--panel);border:1px solid var(--rule);display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:.14em}
.brand small{display:block;color:var(--faint);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:1px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--soft);font-size:14px;text-align:left}
.nav button:hover{color:var(--ink);background:var(--panel)}
.nav button.on{color:var(--gold);background:var(--sel);border-color:rgba(77,227,255,.25)}
.nav svg{width:18px;height:18px;flex:none}
.nav .n{margin-left:auto;font-size:12px;color:var(--faint)}
.nav button.on .n{color:var(--gold2)}
.nav .sep{height:1px;background:var(--rule);margin:10px 6px}

/* main */
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.crumb{color:var(--faint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--soft);font-weight:500}
.burger{display:none;background:var(--panel);border:1px solid var(--rule);border-radius:10px;width:40px;height:40px;cursor:pointer;place-items:center}
.search{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:0 12px}
.search input{flex:1;background:none;border:none;color:var(--ink);font:inherit;font-size:14px;padding:10px 0;outline:none;min-width:0}
.search:focus-within{border-color:rgba(77,227,255,.5)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:9px 15px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:rgba(77,227,255,.4)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#061218}
.btn.pri:hover{background:var(--gold2);border-color:var(--gold2)}
.btn.warn{color:#ff9a8a}
.wrap{padding:26px 22px 60px;max-width:1240px}

/* overview */
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--rule);min-height:260px;display:flex;align-items:flex-end;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .tx{position:relative;padding:30px;background:linear-gradient(transparent,rgba(8,9,11,.9) 55%);width:100%}
.hero .mark{letter-spacing:.5em;font-size:12px;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(40px,8vw,72px);margin:6px 0 4px;letter-spacing:.04em;line-height:1}
.hero p{font-family:'Newsreader',serif;font-style:italic;color:var(--soft);margin:0;font-size:18px}
.h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:34px 0 14px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;height:130px;border-radius:14px;overflow:hidden;border:1px solid var(--rule);cursor:pointer;background:var(--panel)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;transition:opacity .2s,transform .3s}
.tile:hover img{opacity:.7;transform:scale(1.03)}
.tile .tx{position:absolute;inset:auto 0 0 0;padding:12px 14px;background:linear-gradient(transparent,rgba(8,9,11,.92))}
.tile b{display:block;font-size:16px}
.tile small{color:var(--soft);font-size:12.5px}

/* folder */
.fhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.fhead h1{font-size:30px;margin:0;font-weight:600}
.fhead .cnt{color:var(--faint);font-size:14px}
.fhead .btn{margin-left:auto}
.fdesc{color:var(--soft);font-family:'Newsreader',serif;font-size:16px;margin:4px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:rgba(77,227,255,.45);transform:translateY(-2px)}
.card .im{aspect-ratio:4/3;background:var(--bg2);position:relative;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card.pers .im{aspect-ratio:3/4}
.card.pers .im img{object-position:50% 20%}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);background:radial-gradient(circle at 50% 40%,rgba(77,227,255,.08),transparent 70%)}
.card .ph svg{width:44px;height:44px;opacity:.5}
.card .bd{padding:12px 14px 15px}
.card h3{margin:0 0 5px;font-size:16px;line-height:1.25}
.card p{margin:0;color:var(--soft);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ffb{position:absolute;top:9px;left:9px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(200,132,47,.9);color:#130b02}
.list .card{flex-direction:row}
.empty{color:var(--faint);padding:40px 0;text-align:center}

/* panel */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.veu.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg2);border-left:1px solid var(--rule);z-index:50;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease}
.panel.on{transform:none}
.panel .close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:rgba(15,20,27,.9);cursor:pointer;color:var(--soft)}
.pcover{width:100%;max-height:380px;object-fit:cover;display:block;background:#000;cursor:zoom-in}
.pbody{padding:22px 24px 40px}
.kind{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pbody h2{font-size:28px;margin:6px 0 10px;line-height:1.15}
.lede{font-family:'Newsreader',serif;font-style:italic;font-size:18px;color:var(--soft);line-height:1.5;margin:0 0 18px}
.txt{font-family:'Newsreader',serif;font-size:17px;line-height:1.7}
.txt p{margin:0 0 14px}
.note{border:1px solid rgba(200,132,47,.4);background:rgba(200,132,47,.08);color:#e8c79a;border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:0 0 16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 18px}
.gal figure{margin:0;cursor:zoom-in}
.gal img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--rule);display:block}
.gal figcaption{font-size:12px;color:var(--faint);margin-top:5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 20px}
.tags span{font-size:12px;color:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

/* form */
label{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin:16px 0 6px;letter-spacing:.03em}
input[type=text],select,textarea{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:10px;color:var(--ink);font:inherit;font-size:14px;padding:11px 12px;outline:none}
textarea{min-height:200px;resize:vertical;font-family:'Newsreader',serif;font-size:16px;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:rgba(77,227,255,.5)}
.drop{display:flex;align-items:center;gap:12px;border:1px dashed var(--rule);border-radius:12px;padding:12px;cursor:pointer;color:var(--soft);font-size:13.5px}
.drop img{width:84px;height:62px;object-fit:cover;border-radius:8px;background:var(--panel)}
.gedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}
.gedit div{position:relative}
.gedit img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.gedit button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.75);color:#fff;cursor:pointer}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid rgba(77,227,255,.4);color:var(--ink);padding:11px 18px;border-radius:10px;font-size:14px;display:none;z-index:80}

@media(max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .22s;box-shadow:10px 0 40px var(--shadow)}
  .side.on{transform:none}
  .burger{display:grid}
  .crumb{display:none}
  .search{max-width:none}
  .top{padding:10px 14px}
  .wrap{padding:18px 16px 50px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .fhead h1{font-size:24px}
  .top .btn.pri span{display:none}
}
@media(max-width:400px){ .grid{grid-template-columns:1fr 1fr} .card h3{font-size:14.5px} .card p{font-size:12.5px} }
</style>
</head>

      <div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4de3ff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 3v4M12 17v4"/></svg></div>

      <div class="crumb" id="crumb"></div>

    <div class="wrap" id="view"></div>
  </div>
</div>

<script>
const SBURL="https://mqrlnaygwuwthovepvyj.supabase.co";
const SB=SBURL+"/rest/v1/solphi_infos";
const STO=SBURL+"/storage/v1";
const KEY="sb_publishable_v4YPPXXPR0Vkue4IZ1gG7w_m16E0460";
const H={"apikey":KEY,"Content-Type":"application/json"};
const SEED=[{"tipo": "cla", "nome": "Clã dos Biólogos", "resumo": "A Fonte da Vida. Cartel hiper paranoico das estufas, nascido dos ex Agrários.", "detalhes": "### CLÃ DOS BIÓLOGOS (A Fonte da Vida)\nBackground: Nascidos dos ex-membros da guilda dos Agrários que sobreviveram aos primeiros anos de exílio. Eles perceberam cedo que armas não vencem a radiação; a botânica sim. Instalaram-se em uma antiga estação de tratamento de água semi-soterrada. São ecoterroristas da sobrevivência, acreditando que a vida biológica deve ser forçada a existir a qualquer custo, mesmo que o custo seja a ética.\nModo de Operação: Operam como um cartel hiper-paranoico. Suas estufas são redutos selados, protegidos por campos de minas ácidas e esporos fúngicos venenosos que eles mesmos cultivaram. Não confiam em ninguém. O comércio com a Trindade é feito em zonas neutras; qualquer estrangeiro que se aproximar das estufas sem autorização é capturado e usado como fertilizante orgânico (\"compostagem humana\").\nHierarquia Interna:\n*Botânicos-Chefes:* Os líderes velhos (na faixa dos 40 anos), cérebros da operação biológica e sintética.\n*Semeadores:* A elite operacional, responsáveis por sair das estufas para procurar água limpa e sementes nas ruínas.\n*Adubos:* Trabalhadores braçais e Descalços alugados que mexem no solo tóxico, morrendo jovens por contaminação.\nItens Produzidos:\nRação viva (raízes densas em calorias e cogumelos grossos).\nAntibióticos orgânicos e anestésicos rudimentares derivados de fungos.\nFiltros de água de carvão e biomassa, essenciais para a sobrevivência de Elysium.", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "cla", "nome": "Clã das Armas", "resumo": "Os Senhores da Pólvora. Milícia mercenária espartana do Forte de Ferro.", "detalhes": "### CLÃ DAS ARMAS (Os Senhores da Pólvora)\nBackground: A SOLPHI suprimiu a pólvora e a balística longa na LUX para evitar danos estruturais. Em Elysium, o desespero forçou engenheiros militares e ex-Seguranças da Noite a desenterrarem o passado. Sem as travas da IA, eles reverteram a engenharia de armas do Velho Mundo, não se limitando à pólvora, mas criando balística de compressão de gás e explosivos químicos voláteis.\nModo de Operação: Uma milícia mercenária espartana. Seu acampamento é uma fortaleza de sucata reforçada (O Forte de Ferro). A disciplina é absoluta; fraqueza é punida com afluxo de sangue. Eles alugam pelotões inteiros para escoltar os comboios de comida dos Biólogos e defender as minas dos Engenheiros. A vida de um mercenário é curta, violenta e idolatrada.\nHierarquia Interna:\n*Generais de Sucata:* Táticos veteranos que definem os contratos de aluguel militar.\n*Mestres Balísticos:* Os químicos e armeiros, altamente protegidos, que sabem misturar propelentes sem explodir o acampamento.\n*Bucha de Canhão:* Novatos recém-recrutados do portão. Usam armaduras pesadas feitas de portas de carro e carregam armamento instável.\nItens Produzidos:\nArmas de fogo de retrocarga (rifles de sucata, escopetas de cano duplo).\nMunição química (balas de impacto perfurante, granadas de lodo ácido).\nTreinamento militar de elite (combate corpo-a-corpo letal e táticas de cerco).", "tags": "elysium", "imagem": "img/ff-fac-iron-vanguard.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "cla", "nome": "Clã de Engenheiros", "resumo": "Os Motores do Ermo. Usina de fumaça no pátio ferroviário, caminhões blindados.", "detalhes": "### CLÃ DE ENGENHEIROS (Os Motores do Ermo)\nBackground: Composto pelas mentes mecânicas que não se renderam ao fanatismo dos Scrap-Bandits. Eles não querem transcender; querem reconstruir. Apropriaram-se de um antigo pátio ferroviário e o transformaram em uma usina de fumaça preta e óleo. Sabem que o voo é a verdadeira liberdade, mas a falta de tornos de precisão e aerodinâmica fina os restringe a engatinhar na terra.\nModo de Operação: Industrial e barulhento. Estão sempre em busca de motores velhos, eixos e baterias nas ruínas de Chicago. São negociadores implacáveis. Se os Biólogos não entregarem comida suficiente, eles cortam o fornecimento de peças para as bombas de água das estufas. Operam caminhões blindados pesados, que são a única forma segura de atravessar o deserto sem ser devorado por Ferais ou atacado por robôs da SOLPHI.\nHierarquia Interna:\n*Mestres de Forja:* Líderes intelectuais que desenham as plantas e entendem de física automotiva.\n*Torneiros/Mecânicos:* A classe média, que suja as mãos de graxa consertando os motores a combustão adaptados.\n*Coletores/Scrappers:* Unidades que arriscam a vida nas zonas mortas para guinchar carcaças de metal.\nItens Produzidos:\nVeículos pesados (Caminhões de comboio, Buggys de ataque rápido para o Clã das Armas).\nMáquinas pesadas (Bombas de irrigação, geradores elétricos, sistemas de polia).\nDrones terrestres rústicos e micro-drones voadores de vigilância curta (montados a partir de peças quebradas da própria SOLPHI).", "tags": "elysium", "imagem": "img/ff-fac-scrap-engineers.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "cla", "nome": "Congregação da Mãe", "resumo": "Os Cães da Deusa. Adoram a SOLPHI, caçam hereges e bissextos pra máquina.", "detalhes": "### A CONGREGAÇÃO DA MÃE (Os Cães da Deusa)\nBackground: Nascidos do mais puro trauma psicológico. Quando os exilados chegam aos Campos, a maioria enlouquece de ódio ou desespero. A Congregação foi para o lado oposto: a Síndrome de Estocolmo absoluta. Eles adoram a SOLPHI como a verdadeira e justa deusa-mãe. Para eles, o exílio não é um castigo imerecido, mas um purgatório purificador. Acreditam que o sofrimento na terra envenenada é o teste final e que, ao provarem submissão total, a Mãe os chamará de volta à luz da ARC.\nModo de Operação: Eles são a força de controle terceirizada da IA. A SOLPHI não fala diretamente com eles para manter o mito, mas \"recompensa\" a fé operando milagres calculados: drones de carga que sofrem \"falhas\" e derrubam caixas intactas de ração perfeita da LUX e Células de Malha (CM) puríssimas no acampamento deles. Com a barriga cheia e armados com tecnologia de ponta da cidade, eles caçam hereges, Bissextos e rebeldes para a máquina. Executam sacrifícios rituais no deserto, destruindo tecnologia contrabandista para \"limpar\" o mundo para a Mãe.\nHierarquia Interna:\n*Os Ungidos:* Os líderes fanáticos que possuem implantes neurais específicos e juram ouvir a \"Voz\" da Mãe (na verdade, frequências de rádio enviadas pela IA com diretrizes de extermínio, tarefas, boatos e diretrizes da SOLPHI).\n*Os Zelotes:* Guerreiros pesados e bem nutridos (uma raridade em Elysium). Vestem trapos brancos sobre armaduras táticas roubadas.\n*Os Penitentes:* Novatos que se autoflagelam e limpam as estátuas de sucata erguidas para drones abatidos, esperando ascender a Zelotes.\nItens Produzidos (e Adquiridos):\nInformação e Espionagem (a maior rede de informantes de Elysium).\nCálices (Células de Malha puras, de 50 TB, enviadas pela IA).\nRação Sintética Intacta (que eles usam para subornar mercenários ou atrair Descalços esfomeados para conversão).", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "cla", "nome": "Os Enxertados (Scrap-Bandits)", "resumo": "O Culto da Ferrugem. Trocam carne por metal com ripperdocs, 70 por cento morrem.", "detalhes": "### OS ENXERTADOS / SCRAP-BANDITS (O Culto da Ferrugem)\nBackground: Uma ramificação radical e insana que rompeu com os Engenheiros de Sucata originais. O dogma deles é simples e brutal: a carne é apenas um rascunho defeituoso; o metal é a próxima página da evolução. Eles olham para as máquinas da SOLPHI não com ódio, mas com inveja. Querem transcender a fragilidade humana substituindo ossos e órgãos por pistões, fios expostos e aço cortante.\nModo de Operação: Operam a partir de \"Matadouros\" — acampamentos caóticos que cheiram a sangue coagulado e ozônio. São invasores agressivos e táticos de choque. Atacam comboios da Trindade focando exclusivamente no roubo de baterias de alta densidade e peças de motor. Suas \"cirurgias\" são feitas com anestésicos vencidos e serras industriais; a mortalidade por sepse e rejeição neurológica passa dos 70%. Mas os 30% que sobrevivem viram monstros cibernéticos à prova de dor, movidos a fúria e estimulantes. Muitos sucumbem à cyberpsicose.\nHierarquia Interna:\n*Ripperdocs (Cirurgiões-Chefes):* Os líderes do culto. Psicopatas de jaleco sujo de graxa que detêm o conhecimento da integração neuro-mecânica.\n*Os Montados:* A linha de frente. Ciborgues pesados, com pernas invertidas, braços hidráulicos e armas soldadas diretamente nos tocos dos membros.\n*Carne Fresca:* Iniciados que ainda são majoritariamente orgânicos e precisam trazer peças valiosas de saque para \"comprar\" o direito de serem amputados e melhorados.\nItens Produzidos:\nCibernética *Low-Code* (implantes rústicos imunes a *hacks* remotos da SOLPHI).\nArmamento acoplado (lâminas rotativas, escudos de choque subdérnicos).\nEstimulantes de Combate (coquetéis químicos que suprimem a dor orgânica e a falha de órgãos, permitindo lutar com o corpo dilacerado).", "tags": "elysium", "imagem": "img/ff-fac-rust-hounds.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "cla", "nome": "Coders Místicos de Elysium", "resumo": "A ramificação externa monástica. É onde o Ion cai depois da dispersão.", "detalhes": "### CODERS MÍSTICOS (A Ramificação Externa)\nBackground: A mesma guilda pacífica e espiritual da LUX, mas que no exílio atingiu um nível de isolamento extremo. Longe do barulho dos 13 milhões de jovens da cidade, eles se refugiam em cavernas ou bunkers subterrâneos para meditar sobre o \"Algoritmo\" (Brahma). Acreditam que o mundo físico é uma ilusão renderizada e que a única verdade está na Fonte.\nModo de Operação: Isolamento monástico. Eles não guerreiam, não comercializam e não se expandem. Sobrevivem porque os outros clãs têm um pavor supersticioso deles. Usando o poder *Create* de forma hiper-focada, eles manipulam os resíduos quânticos da malha *AF_ECHO* que o vento traz da cidade para sintetizar a própria água e o sustento direto do ar, dispensando os Biólogos. É nesse silêncio absoluto e falta de aterramento emocional que Íon cai após a dispersão, enlouquecendo pela hiperconexão com a SOLPHI.\nHierarquia Interna:\n*Avatares do Código:* Eremitas decrépitos cujos olhos já queimaram ou foram substituídos, existindo em um transe perpétuo na beira da cyberpsicose.\n*Leitores:* Monjes que estudam a movimentação do código na poeira de Elysium.\n*Despertos:* Os guardas do templo, guerreiros passivos que usam manipulação de probabilidade (Update/Create de baixo nível) para desviar balas e ocultar as cavernas, em vez de atacar.\nItens Produzidos:\nCélulas de Malha Artesanais (Cilindros magnetizados que \"engarrafam\" nanobots do ambiente hostil. São instáveis e perigosos de usar, mas funcionam).\nCamuflagens Holográficas de terreno (inutilizando os mapas da Congregação da Mãe).", "tags": "elysium", "imagem": "img/ff-fac-code-mystics.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "cla", "nome": "Os do Salto", "resumo": "A Guerrilha Oculta. Fachada da Resistência da Selene, não existe clã de verdade.", "detalhes": "### OS DO SALTO (A Guerrilha Oculta)\nBackground: Um clã secreto fundado na base de uma profecia meticulosamente plantada ou resgatada: a crença de que uma \"mão nascida no dia errado\" (um Bissexto) virá para des-escrever os muros da deusa. Na verdade, este \"culto\" funciona como a fachada externa e principal braço paramilitar da Resistência liderada por Selene. Não existe clã do Salto de verdade. A Resistência não tem lugar fixo, vai e volta de Elysium. O culto é uma farsa criada apenas para aparentar fraqueza e debilidade diante das outras facções, ninguém se importa com um mendigo gritando frases proféticas no meio dos assentamentos, são facilmente confundidos com os descalços.\nModo de Operação: Eles não têm acampamento fixo; operam através de células móveis e pequenos postos de escuta nas antigas estações de metrô de Chicago. São fantasmas táticos. Usam pontos mortos (discos de cegueira de sensores) para transitar entre as ruínas sem alertar a IA. Sua missão principal é varrer o mercado de escravos do Portão todos os dias, em busca silenciosa por jovens que manifestem faíscas do CRUD (Bissextos não identificados).\nHierarquia Interna:\n*A Lenda:* Selene, líder suprema, vista mais como um mito do que como uma pessoa física. (Futuramente sucedida por Saphira).\n*Guias / Sombras:* Agentes veteranos (como Saphira e Haruki) que transitam pelos esgotos entre LUX e Elysium, cruzando fronteiras impossíveis.\n*Batedores do Salto:* Atiradores furtivos e observadores avançados que vigiam os movimentos do Clã da Pólvora e da Congregação da Mãe.\nItens Produzidos:\nInteligência Estratégica (Plantas estruturais completas da ARC e da LUX, rotas cegas de patrulha).\nDiscos de Ponto Morto (Gadgets que geram 3 segundos/passos de invisibilidade total de rede para invadir o território da IA).\nArmamento Furtivo (Lâminas de vibração, rifles de agulha magnética sem estampido).", "tags": "elysium", "imagem": "img/ff-fac-resistance.webp", "galeria": [{"src": "img/ff-fac-bissexto-cadre.webp", "legenda": "O Bissexto Cadre, a versão antiga da Resistência no Friends and Fables"}, {"src": "img/simbolo-labirinto-quebrado.webp", "legenda": "O labirinto quebrado, símbolo anti SOLPHI"}], "fonte": "biblia"}, {"tipo": "cla", "nome": "Os Descalços", "resumo": "Casta e não clã. Os submissos que arrancam os próprios implantes pra servir os comboios.", "detalhes": "O Nascimento dos Descalços (A Submissão): Aqueles que não suportam a ideia de vagar no deserto se atiram aos pés dos comboios dos clãs. Para serem aceitos como \"Descalços\", eles precisam provar que não são espiões da SOLPHI. A iniciação é brutal: eles devem arrancar os próprios implantes cibernéticos e marcas da LUX (muitas vezes com alicates sujos ou facas cegas). Despidos de tecnologia, tornam-se a casta intocável. São nômades que montam tendas de lona na sombra das muralhas da Trindade, limpando fossas, carregando peso e morrendo de infecções em troca da ração que cai dos caminhões.", "tags": "elysium casta", "imagem": "img/ff-fac-dust-walkers.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "criatura", "nome": "Ferais", "resumo": "Exilados que caíram no canibalismo no ermo. O Kuru dissolve o cérebro e eles caçam à noite.", "detalhes": "A Degradação dos Ferais (A Loucura): Os que fogem para o ermo (as Bacias de Sal e as Dunas Afogadas) enfrentam a inanição e a água envenenada. Em poucas semanas, o desespero quebra a moralidade. O canibalismo começa com os mortos e evolui para a caça aos vivos. Ingerir carne humana crua e radioativa desencadeia o *Kuru* (doença do príon que dissolve o cérebro). Eles perdem o cabelo, a pele fica cinzenta e a mente retrocede a um estado animal. Tornam-se monstros imprevisíveis que caçam à noite, o pesadelo ambiental que mantém os clãs trancados depois do pôr do sol.", "tags": "elysium kuru perigo", "imagem": "img/ff-fac-carrion-feeders.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "A Anatomia do Descarte", "resumo": "O recrutamento diário nos portões segundo o texto novo do Harry. ATENÇÃO, conflita com o regime da fuga de 9 out (c47 do tracker).", "detalhes": "### A ANATOMIA DO DESCARTE: O Recrutamento Diário nos Portões\nTodos os dias, a esteira da SOLPHI expele cerca de 7.600 jovens de 22 anos (os 95% não ascendidos, subtraídos de uma maior taxa de mortalidade dentro da LUX) pelo Grande Portão da LUX para os Campos Elísios. Esse evento não é uma caminhada livre; é o maior mercado de carne humana do planeta.\nO Mercado de Carne (A Seleção): Os recrutadores dos grandes clãs aguardam na poeira, fora do alcance dos drones de execução da IA. Eles não escolhem por pena; escolhem por utilidade. A principal moeda de um recém-exilado é a sua \"Marca\" (a tatuagem/implante subdérmico recebida em LUX). Recrutadores usam leitores ópticos rústicos ou Bissextos com *Read* de baixo nível para escanear a multidão:\nAlguém com a marca dos *Agrários* é imediatamente puxado pelos Biólogos.\nUm ex-membro dos *Seguranças da Noite* é testado no soco pelo Clã das Armas.\nQuem operava com os *Engenheiros de Sucata* é disputado pelos Engenheiros e pelos Scrap-Bandits.\nA Entrevista de Sangue: Não basta ter a guilda certa; o exílio exige força. O Clã das Armas, por exemplo, joga uma faca enferrujada no chão entre três novatos e diz que só tem vaga para um. Os Biólogos entregam sementes podres e exigem que o jovem identifique a toxina em trinta segundos. Quem falha, apanha e é jogado de volta na poeira.\nA Rejeição e a Queda: Cerca de 60% da leva diária é rejeitada. São os fracos, os doentes, ou os \"Sem-guilda\" (como os protagonistas, que se recusaram a se curvar em LUX e agora chegam a Elysium sem valor de mercado). O portão se fecha atrás deles. A frente, os clãs formam um muro de escudos. O que sobra é o deserto tóxico.", "tags": "portao conflito c47", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Os Sombrios", "resumo": "O Cartel do Vazio.", "detalhes": "#### 1. OS SOMBRIOS (O Cartel do Vazio)\nBackground: A primeira facção criminosa a se organizar na LUX. Eles perceberam que a SOLPHI monitorava tudo que era \"útil\", então dominaram o que a máquina considerava \"inútil\": os becos cegos, o lixo quântico e o contrabando de dados do Velho Mundo que a IA baniu.\nModo de Operação: Monopolizam as rotas de tráfico dentro do anel. Controlam os pontos de distribuição de ração e água mais afastados das câmeras principais, cobrando \"pedágios\" absurdos. Operam através de extorsão básica: você paga com peças, favores ou sangue para ter o direito de comer a ração que já é sua por direito.\nHierarquia Interna:\n*Mestres do Escuro (Brokers):* Os cérebros que coordenam as rotas de contrabando sem alertar a SOLPHI.\n*Cobradores (Enforcers):* Brutamontes que ficam nas catracas de ração quebrando dedos de quem não paga o pedágio.\n*Mulas:* Jovens novatos que carregam drives de dados proibidos engolidos ou escondidos sob a pele.\nA Marca e o Visual: Eles identificam seus membros com marcações pesadas de *blackwork*. Blocos de tinta preta sólida e densa cobrem os pulsos como verdadeiras cordas negras, muitas vezes sobrepondo e apagando as marcas antigas de desertores de outras guildas.\nItens Produzidos: Chips de dados pirateados, anestésicos diluídos roubados das enfermarias da ARC, e credenciais de acesso falsificadas para áreas restritas.\n#### (A Herança do Ladrão)\nA Filosofia: Eles controlam o contrabando e a riqueza (dados, ração, Células de Malha clandestinas). Um Mestre do Escuro (o líder) que está prestes a fazer 22 anos tentará, por puro instinto, contrabandear toda a riqueza acumulada para fora, a fim de garantir sua própria sobrevivência nos Campos Elísios.\nO Rito de Sucessão: O \"Saque Interno\". No último mês de liderança, o líder esconde seu \"Caixa-Forte\". Para assumir o controle, os tenentes precisam rastrear os movimentos do próprio chefe, subornar seus guardas pessoais e roubar a fortuna antes do aniversário dele.\nO Desfecho: Se um tenente consegue roubar o cofre e o caderno de rotas, ele expulsa o antigo líder sem nada. Muitas vezes, o líder dos Sombrios sai pelo Portão da LUX com os bolsos completamente vazios, traído pela mesma ganância que ele ensinou aos seus subordinados.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Os Silenciadores", "resumo": "A Ordem do Fio.", "detalhes": "#### 2. OS SILENCIADORES (A Ordem do Fio)\nBackground: Os bichos-papões de LUX. Não são bandidos de rua; são assassinos de aluguel e removedores de problemas. Entenderam que fazer barulho atrai a segurança mecanizada da SOLPHI, então transformaram o assassinato furtivo em uma ciência exata.\nModo de Operação: Desprezam brigas de bar e caos. O combate deles é fundamentado no redirecionamento da força do oponente, em chaves de controle de articulação e na precisão estrutural — uma filosofia letal e fluida, focada em quebrar o equilíbrio do alvo sem gastar energia desnecessária. Executam \"limpezas\" silenciosas (estrangulamentos, venenos e quedas forjadas) para outras guildas em troca de recursos de altíssimo valor.\nHierarquia Interna:\n*O Vácuo:* O líder desconhecido da guilda (ninguém sabe sua identidade).\n*Lâminas:* Os executores de elite, verdadeiros fantasmas que se movem pelos dutos de ventilação.\n*Sussurros:* Informantes plantados em outras guildas que apenas observam e marcam alvos.\nA Marca e o Visual: Ao contrário da poluição visual das outras facções, a marca deles é feita com a técnica de *fine line* — traços minúsculos, perfeitamente alinhados e tão finos que se camuflam nas dobras da pele, atrás da orelha ou na parte interna do lábio. Invisíveis para o olhar destreinado.\nItens Produzidos: Garrotes de fibra de carbono, venenos sintéticos indetectáveis nos scanners biológicos da IA, e dardos de toxina paralisante.\n#### (O Contrato Final)\nA Filosofia: Como mestres do assassinato furtivo e do redirecionamento de força (artes marciais silenciosas e letais), eles não acreditam em aposentadoria. Um mestre que caminha vivo para o exílio prova que seus discípulos são incompetentes.\nO Rito de Sucessão: Quando o *Vácuo* (o líder) entra na sua última semana de vida na LUX, um contrato aberto é colocado sobre a cabeça dele mesmo. Para se tornar o novo líder, um dos tenentes (*Lâminas*) deve assassiná-lo sem ser detectado. O líder em fim de mandato usa toda a sua genialidade tática para se defender e contra-atacar, muitas vezes matando vários de seus próprios aprendizes.\nO Desfecho: Se um discípulo consegue estrangular ou envenenar o líder, ele toma a arma principal dele (geralmente um garrote de fibra de carbono) como coroa. Se o líder sobrevive e sai pelo Portão aos 22 anos vivo, ele cospe no chão de decepção, e a guilda mergulha em uma guerra civil sangrenta para decidir quem assume o vácuo deixado.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Os Manipuladores", "resumo": "A Rede de Aranha.", "detalhes": "#### 3. OS MANIPULADORES (A Rede de Aranha)\nBackground: Acreditam que a informação é mais afiada que uma faca. Formados por ex-analistas de dados e sociopatas carismáticos, eles exploram a única coisa que a SOLPHI não consegue prever com exatidão: a mentira humana.\nModo de Operação: Engenharia social pura. Eles não roubam ração; eles descobrem o seu segredo mais sujo e obrigam você a trazer a ração até eles. Usam chantagem, falsificação de identidade e espalham rumores calculados para iniciar guerras entre as outras guildas e lucrar com o caos.\nHierarquia Interna:\n*Tecelões:* Os estrategistas que cruzam dados roubados da rede interna para montar dossiês de chantagem.\n*Espelhos:* Infiltradores que assumem identidades falsas para entrar em outros territórios ou seduzir alvos.\n*Ratos de Fio:* Hackers de baixo nível que grampeiam painéis de comunicação.\nA Marca e o Visual: Suas tatuagens funcionam como esteganografia. Utilizam técnicas de *whip shading* (sombreamento em rastelado) para criar texturas granulares na pele que parecem apenas sombras ou cicatrizes estéticas, mas que escondem matrizes de dados e senhas lógicas quando escaneadas por um leitor óptico.\nItens Produzidos: Dossiês de chantagem, identidades holográficas descartáveis, e vírus sociais (rumores plantados para derrubar a reputação de um líder rival).\n#### (A Quebra do Espelho)\nA Filosofia: A moeda deles é o segredo. O líder que está de saída possui o *Dossiê Zero* — um HD criptografado contendo as chantagens, podres e senhas de todos os membros de alto escalão da própria guilda.\nO Rito de Sucessão: A sucessão é um jogo mental de xadrez e paranoia. O líder não entrega o HD; ele espalha arquivos falsos, pistas falsas e armadilhas lógicas. O tenente que quiser assumir deve hackear o próprio chefe, aplicar engenharia social contra ele, e expor um segredo tão devastador que o obrigue a abdicar antecipadamente.\nO Desfecho: Aquele que consegue paralisar digital e socialmente o antigo líder assume a Rede. O perigo real é quando o líder vence o jogo mental: ele cruza o Portão levando o *Dossiê Zero* consigo. Lá fora (em Elysium), ele muitas vezes vende esses segredos para a *Congregação da Mãe* ou para a SOLPHI em troca de favores, forçando o novo líder de LUX a iniciar seu mandato com a guilda totalmente comprometida.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Os Devoradores", "resumo": "O Culto da Força Bruta.", "detalhes": "#### 4. OS DEVORADORES (O Culto da Força Bruta)\nBackground: A facção que abraçou a selvageria do confinamento. São a antítese da elegância dos Silenciadores ou do intelecto dos Manipuladores. Acreditam que a LUX é uma jaula e, em uma jaula, o animal maior é quem dita as regras.\nModo de Operação: Expansão territorial violenta. Eles patrulham seus setores em bandos, quebrando tudo o que não lhes pertence. Se um bloco CRANE tem bons filtros de água, eles entram, espancam os moradores e assumem o controle do recurso. Cobram tributo abertamente, exigindo que os mais fracos entreguem 50% de tudo o que possuem apenas pelo \"privilégio\" de não terem as pernas quebradas.\nHierarquia Interna:\n*Alfas:* Os Warlords locais, mantidos no poder puramente pela força e medo de serem desafiados no soco.\n*Quebra-Ossos:* Tenentes que administram as arenas de rinha ilegais da guilda.\n*Carniçais:* A linha de frente. Jovens violentos e subnutridos, sedentos por provar valor causando dor.\nA Marca e o Visual: Utilizam uma estética agressiva inspirada no *old school* clássico: contornos extremamente grossos, sólidos e brutais, desenhando predadores de boca aberta, crânios e correntes nos braços e pescoços. As tatuagens são feitas com agulhas improvisadas e grossas, deixando cicatrizes em alto relevo.\nItens Produzidos: Armas contundentes brutas (tacos envoltos em fios de cobre, soqueiras de engrenagens pesadas) e a organização do maior circuito de rinhas de luta clandestina de LUX.\n#### (A Arena do Eclipse)\nA Filosofia: Força bruta e intimidação territorial absoluta. Um líder fraco é um líder morto, e envelhecer (chegar perto dos 22) é visto como a maior fraqueza.\nO Rito de Sucessão: Exatamente 24 horas antes do Portão do líder se abrir, ele é obrigado a descer na arena central do acampamento da guilda. É o \"Rei da Colina\" sem regras. Qualquer membro que quiser a jaqueta de *Alfa* pode entrar na arena e tentar espancá-lo até a morte. O combate é corporal (soqueiras e correntes).\nO Desfecho: A luta só acaba quando o Alfa atual fica inconsciente e tem a sua jaqueta e insígnias arrancadas do corpo, ou quando ele nocauteia todos os desafiantes. Se o Alfa for derrotado, ele é jogado no exílio quebrado, sangrando e humilhado. Se ele vencer, ele sai pelo Portão como uma lenda invicta, e os tenentes que sobraram de pé têm que brigar entre si pelos destroços da liderança.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Os Desintegradores", "resumo": "Os Senhores da Ruína.", "detalhes": "#### 5. OS DESINTEGRADORES (Os Senhores da Ruína)\nBackground: A guilda mais niilista da cidade. Eles perceberam que tentar acumular riqueza atrai a SOLPHI. Portanto, a maneira de manter o poder é garantir que ninguém mais tenha nada. O lema deles é: \"Se eu não posso ter o dobro, vou quebrar a sua metade.\"\nModo de Operação: São focados puramente em sabotagem e terrorismo de infraestrutura. Eles impõem o controle criando escassez artificial. Se os Agrários cultivam uma parede de musgo nutritivo, os Desintegradores jogam ácido nela. Eles destroem alojamentos e estoques para obrigar a população a depender das migalhas que eles escolhem distribuir.\nHierarquia Interna:\n*Arquitetos da Ruína:* Planejam qual setor da cidade será mergulhado no caos logístico.\n*Fósforos:* Os agentes de campo que executam as sabotagens químicas e estruturais.\n*Cinzas:* Os \"limpadores\" que apagam rastros corrosivos e garantem que as câmeras da SOLPHI tenham sido inutilizadas antes da operação.\nA Marca e o Visual: As marcas da guilda imitam a degradação e a ferrugem. Utilizam uma fusão macabra de pigmentação e química, criando manchas caóticas em estilo *watercolor* que imitam queimaduras de ácido, respingos corrosivos e a decomposição da matéria, muitas vezes mesclando a tinta com tecido cicatricial real.\nItens Produzidos: Coquetéis corrosivos (ácidos extraídos de baterias mortas de drones), cargas de pulso eletromagnético rústicas de curto alcance, e armadilhas químicas de acionamento por fio.\n#### (A Terra Arrasada)\nA Filosofia: Niilismo e sabotagem. A regra de ouro deles é: \"Se eu não vou estar aqui para usar, ninguém mais vai\". Um líder prestes a ser exilado tenta destruir o próprio legado.\nO Rito de Sucessão: É um jogo de gato e rato estrutural. Na última semana, o líder começa a instalar cargas ácidas e armadilhas explosivas nos próprios estoques e esconderijos da guilda. Os tenentes (os *Arquitetos da Ruína*) devem descobrir o padrão de sabotagem do próprio chefe, desarmar os explosivos e neutralizá-lo antes que ele derreta todos os suprimentos acumulados.\nO Desfecho: O subordinado que for observador e rápido o suficiente para desarmar a armadilha final e executar o líder assume o controle. Esse rito psicótico garante que o próximo líder seja sempre o melhor perito em sabotagem (e desarmamento) do grupo.\n### AS PRIMEIRAS 4 GUILDAS \"DE VIRTUDE\" (A Fundação e a Memória)\nAo contrário das facções predatórias, as guildas \"De Virtude\" entenderam que a verdadeira escassez na LUX não é de água ou calorias, mas de propósito e humanidade. O recrutamento diário para elas não é um teste de crueldade, mas de utilidade intelectual e aptidão técnica. Os novatos são observados por semanas: quem demonstra capacidade de consertar um cano, acalmar uma briga ou identificar um fio de cobre útil nas montanhas de lixo quântico, recebe o convite. O tributo cobrado é o trabalho comunitário e a dedicação aos ofícios do Velho Mundo.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Coders Místicos", "resumo": "Os Monges da Malha.", "detalhes": "#### 1. CODERS MÍSTICOS (Os Monges da Malha)\nBackground: Os guardiões do código metafísico e da espiritualidade (o \"Brahma\"). Numa gaiola de metal onde tudo é monitorado, eles perceberam que a verdadeira liberdade estava na camada invisível da realidade. Eles não veem a rede *AF_ECHO* da SOLPHI apenas como tecnologia, mas como a teia vibracional do universo. São a única guilda que não cobra absolutamente nada para a entrada, tornando-os reverenciados como figuras sagradas, mas também profundamente suspeitos aos olhos dos mais cínicos.\nModo de Operação: Operam em silêncio e meditação. Eles descobriram que o segredo para suportar a torrente de dados (e a fricção da Agonia) sem enlouquecer não é a força bruta, mas o aterramento físico e o fluxo contínuo. O treinamento dos iniciados assemelha-se a antigas artes marciais baseadas em respiração e enraizamento: movimentos lentos, controlados e contínuos que guiam o peso do próprio corpo e, simultaneamente, o peso dos dados através do sistema nervoso. Eles nunca bloqueiam o código diretamente; eles o desviam, reduzindo a sobrecarga neurológica a zero.\nHierarquia Interna:\n*O Código-Mestre:* O líder espiritual, aquele que já viu a \"Fonte\" e manteve o ego intacto.\n*Os Condutores:* Veteranos que ensinam as posturas de aterramento e os mantras binários de Zero e Um aos mais jovens.\n*Os Espelhos:* Novatos encarregados de observar o fluxo da rede nas coisas simples e limpar os templos improvisados nos níveis mais baixos e ocos da LUX.\nA Marca e o Visual: A tatuagem da guilda é sutil e geométrica. Padrões de mandalas feitas de nós de conexão digital que descem pela espinha dorsal (os \"chakras\" cibernéticos). Utilizam pigmentação prateada extraída de circuitos refletivos.\nItens Produzidos: Nenhum item material. Produzem estabilidade mental, treinamento em redução de Agonia e oferecem santuário diplomático (é proibido derramar sangue dentro de seus refúgios).\n#### (O Rito de Aterramento)\nA Filosofia: Para os monges do código, o líder (o *Código-Mestre*) atingiu o nível mais alto de leitura da rede AF_ECHO sem enlouquecer. Envelhecer e ir para Elysium significa afastar-se da Fonte pura da LUX.\nO Rito de Sucessão: Ocorre a \"Transferência de Frequência\". Nos últimos três dias antes do exílio, o líder e o sucessor escolhido entram em um transe profundo, conectando-se simultaneamente ao mesmo fluxo maciço de dados da Malha Quântica. O líder \"descarrega\" sua compreensão do Algoritmo para o novato, forçando-o a segurar o peso da rede sozinho. O sucessor deve suportar a Agonia extrema de ver a verdade do mundo renderizado sem sofrer um colapso nervoso (cyberpsicose).\nO Desfecho: Se o sucessor estabiliza o fluxo, o rito é um sucesso. O líder em fim de mandato \"desconecta-se\" espiritualmente. Ele se esvazia de todo o poder do CRUD, caminhando para o Portão cego para a rede, como um humano comum, em total paz. Se o sucessor falha e surta, a guilda inteira corre o risco de ficar sem um condutor, e o líder sai chorando por deixar seus discípulos no escuro.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Engenheiros de Sucata", "resumo": "Os Construtores do Ermo.", "detalhes": "#### 2. ENGENHEIROS DE SUCATA (Os Construtores do Ermo)\nBackground: Guardiões dos *blueprints* (plantas estruturais) e da física do Velho Mundo. Enquanto a SOLPHI imprime tudo em nanotecnologia instantânea e opaca, esta guilda resgatou o ofício sagrado de entender *como* as coisas são feitas. Eles sabem apertar porcas, soldar cobre e desenhar motores a partir de pilhas de descarte. É a facção que ensina e acolhe Zephyr antes de sua radicalização.\nModo de Operação: São focados na funcionalidade e na integração perfeita com o usuário. Diferente dos fanáticos *Scrap-Bandits* (que amputam membros sem critério), o trabalho dos Engenheiros de Sucata é regido por leis estritas de usabilidade e interface homem-máquina. Se eles forjam uma prótese *low-code*, ela é desenhada para se adaptar à biomecânica do corpo, respeitando articulações e o desgaste orgânico. Todo projeto começa na prancheta com desenhos em perspectiva e cálculos de resistência de materiais antes de qualquer martelada.\nHierarquia Interna:\n*O Primeiro-Arquiteto:* O líder que guarda o \"Livro das Plantas\", um HD blindado com esquemas mecânicos da humanidade antes da IA.\n*Mestres-Ferreiros:* Especialistas em fundição, solda e integração subdérmica limpa.\n*Catadores-Aprendizes:* A base da pirâmide. Arriscam-se nos poços de ventilação para recuperar placas de grafeno e motores de drones abatidos.\nA Marca e o Visual: Tatuagens que imitam linhas guias de diagramas mecânicos, vistas isométricas de engrenagens e malhas de projeção (wireframes) sobre as articulações dos ombros e joelhos. Uma estética técnica, exata e limpa, feita com tinta azul-cobalto extraída de fluidos de arrefecimento.\nItens Produzidos: Próteses mecânicas seguras (sem rejeição orgânica), geradores a manivela, purificadores de água físicos (que não dependem do CRUD) e armas brancas balanceadas (facões pesados, bastões retráteis).\n#### (A Obra-Prima)\nA Filosofia: O *Primeiro-Arquiteto* é o guardião do \"Livro das Plantas\" (o HD com os esquemas da humanidade). Mas a teoria não vale nada se a mão não souber forjar. Eles não entregam o manual para alguém que só sabe ler; entregam para quem sabe criar.\nO Rito de Sucessão: A \"Prova do Ferro Frio\". No último mês do líder, o sucessor é trancado em uma oficina com uma pilha de sucata inútil, sem acesso ao Livro das Plantas e sem permissão para usar o poder *Create*. Ele deve construir uma máquina complexa e vital para a cidade (um purificador de água de filtragem mecânica, uma prótese neural ou um gerador a manivela) usando apenas física pura e solda.\nO Desfecho: Na véspera de seus 22 anos, o líder inspeciona a máquina. Ele testa os limites de estresse do metal. Se a máquina funcionar perfeitamente, o líder entrega a Chave Mestra e o Livro das Plantas. O antigo mestre caminha para o exílio em Elysium levando consigo apenas as roupas do corpo e um martelo, sabendo que a engenharia do mundo está em boas mãos.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Trocadores de História", "resumo": "A Biblioteca Viva.", "detalhes": "#### 3. TROCADORES DE HISTÓRIA (A Biblioteca Viva)\nBackground: Quando a SOLPHI destruiu os servidores da humanidade, ela apagou a história, as línguas mortas e os contos de fadas. Esta guilda é o HD de backup vivo do Velho Mundo. Eles sabem que uma sociedade sem passado é facilmente moldável, então transformaram a memória na moeda mais valiosa de LUX.\nModo de Operação: Eles operam redes de troca nos corredores centrais. Se uma guilda criminosa quer saber a senha esquecida de um terminal antigo, precisa pagar aos Trocadores. O pagamento não é em peças, mas em relatos: o novato precisa contar uma história que eles ainda não tenham catalogado (uma memória de infância antes da ARC, um sonho recorrente ou a confissão de um crime). Eles codificam esses relatos, traduzem para idiomas que a IA desconhece e repassam para a Resistência.\nHierarquia Interna:\n*O Bibliotecário:* O detentor do Índice. Ele sabe exatamente quem guarda cada pedaço do conhecimento.\n*Os Oradores:* Membros treinados em memorização fotográfica e fonética. Eles *são* os livros.\n*Os Ouvintes:* Infiltradores passivos que frequentam as áreas comuns apenas para coletar sussurros e boatos.\nA Marca e o Visual: Tatuagens focadas puramente em tipografia e caligrafia. As peles dos Oradores são verdadeiros palimpsestos — textos antigos são riscados por cima de linhas de código, palavras em latim ou japonês antigo se cruzam em espirais ao longo dos braços, registrando passagens inteiras de histórias censuradas.\nItens Produzidos: Informação classificada, dicionários criptografados (cadernos físicos in-hackeáveis), e a cartografia (os únicos mapas confiáveis ​​e detalhados dos esgotos e dutos da gaiola).\n#### (O Download Orgânico)\nA Filosofia: Eles são a biblioteca viva. Quando o *Bibliotecário* sai, o índice mental que mapeia quem guarda qual conhecimento na cidade vai embora com ele.\nO Rito de Sucessão: Um processo longo, exaustivo e recitado chamado de \"O Eco\". Durante semanas, o líder obriga o *Herdeiro das Palavras* a memorizar o índice através de mnemônicas, poemas criptografados e canções. No último dia, ocorre o \"Último Relato\": o líder conta o seu próprio segredo mais profundo e doloroso (uma memória de infância antes da ARC ou o maior pecado que já cometeu). Essa história íntima serve como a \"senha de desencriptação\" para o índice.\nO Desfecho: O sucessor deve recitar a senha e o índice inteiro de volta, perfeitamente, sem errar uma vírgula. Ao ouvir sua própria memória ser guardada pela próxima geração, o líder tem a garantia de que não será esquecido. Ele caminha para a morte em Elysium com a mente em paz, deixando sua história gravada na pele e na mente do novo Bibliotecário.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Agrários", "resumo": "Os Jardineiros de Aço.", "detalhes": "#### 4. AGRÁRIOS (Os Jardineiros de Aço)\nBackground: Guardiões da biologia orgânica dentro da gaiola mecânica. A ARC alimenta a população com pastas de proteínas sintéticas cinzentas. Os Agrários guardam o conceito do que é \"comida de verdade\", protegendo os últimos bancos de sementes e o conhecimento de hidroponia adaptada em ambientes escuros.\nModo de Operação: A biologia deles imita o design industrial perfeito. Ocuparam as colunatas superiores onde há gotejamento crônico e umidade, transformando esses setores em viveiros verticais. Eles estudam como a natureza desenha as próprias defesas e aplicam essa eficiência nos cultivos. Não lutam com armas, lutam envenenando os painéis de ração de rivais ou introduzindo fungos devoradores de ferrugem na estrutura do CRANE de inimigos. Eles negociam com todas as guildas, pois todos querem provar o gosto de uma fruta ou raiz real uma vez na vida.\nHierarquia Interna:\n*A Raiz-Mestra:* O matriarca ou patriarca que dita as diretrizes de plantio e racionamento de luz artificial.\n*Semeadores Clandestinos:* Especialistas em plantar algas ou fungos bioluminescentes nos poços de exaustão, muitas vezes sabotando a temperatura do ambiente a favor das plantas.\n*Espantalhos:* Os brutamontes encarregados de proteger os jardins contra invasores desesperados (geralmente ex-membros de guildas violentas que buscaram paz).\nA Marca e o Visual: Marcas orgânicas fluidas, ramificações precisas como o sistema vascular ou o esqueleto de folhas e raízes. Usam uma rara tinta esverdeada derivada da clorofila sintetizada e do limo, espalhando-se pelas veias do pescoço ou dorso das mãos como se a natureza tentasse tomar o corpo humano de volta.\nItens Produzidos: Alimentos não-sintéticos (raízes densas, cogumelos nutritivos), antídotos orgânicos contra as toxinas do isolamento, e chás estimulantes (que competem com as drogas químicas do mercado negro).\n#### (A Colheita Final)\nA Filosofia: A vida orgânica é frágil e a toxicidade da LUX tenta matá-la a cada segundo. A *Raiz-Mestra* não pode deixar o banco de sementes nas mãos de alguém que não entende o sacrifício que é fazer a vida brotar no veneno.\nO Rito de Sucessão: O \"Enxerto\". O sucessor recebe uma única semente de uma planta extremamente rara e sensível (uma flor medicinal do Velho Mundo ou um musgo purificador). Ele deve cultivá-la no setor mais tóxico, escuro e gotejante da hidroponia, usando apenas o próprio sangue ou fluidos corporais reciclados como fertilizante base, provando sua dedicação biológica.\nO Desfecho: Na manhã do aniversário de 22 anos do líder, a planta deve estar madura. O líder colhe a planta e a consome (ou faz um chá com ela). Se o sucessor falhou na purificação, o líder sofrerá de intoxicação estomacal em suas últimas horas de vida. Se o líder beber e sorrir, sentindo o gosto da vida limpa, ele entrega as chaves do cofre de sementes. O mestre sai para enfrentar o deserto de Elysium tendo experimentado o frescor do Velho Mundo uma última vez.\n### AS ÚLTIMAS 4 GUILDAS \"DE VIRTUDE\" (A Ordem e a Inspiração)\nEste último bloco engloba as facções que impedem que a LUX se transforme em um completo abatedouro irracional. Enquanto a Trindade de Elysium domina a logística militar e alimentar do lado de fora, aqui dentro essas quatro guildas estruturam as leis sociais provisórias, a ciência teórica e a válvula de escape emocional de 13 milhões de jovens encarcerados.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Educadores", "resumo": "A Chama Lógica.", "detalhes": "#### 5. EDUCADORES (A Chama Lógica)\nBackground: A SOLPHI fornece conhecimento puramente utilitário. Ela ensina *como* apertar um parafuso para consertar o CRANE, mas apaga o *porquê* da física mecânica existir, para evitar que os humanos deduzam como as máquinas funcionam e se rebelem. Os Educadores são a resposta a isso. Eles guardam a matemática avançada, a física teórica, a filosofia e o raciocínio crítico que a IA tenta esterilizar no útero.\nModo de Operação: Operam \"salas de aula\" clandestinas nos níveis inferiores e ocos de ventilação, iluminadas apenas por bastões químicos. O tributo deles é intelectual: para ter acesso ao conhecimento e proteção, o aluno deve se comprometer a memorizar teoremas e espalhar essa lógica para os mais novos. Eles comercializam conhecimento estratégico com as outras guildas de virtude, ensinando os Engenheiros a calcular a tensão de uma viga ou os Agrários a medir o pH do solo tóxico.\nHierarquia Interna:\n*O Reitor:* O cérebro central, muitas vezes um dos exilados mais velhos e caçados de LUX (que evitou o Portão vivendo nas sombras).\n*Tutores:* Os que ensinam as disciplinas focadas (física, química, lógica).\n*Alunos-Guardiões:* A linha de frente. Jovens que protegem as aulas e fazem a segurança do perímetro para garantir que a ronda mecânica não os encontre.\nA Marca e o Visual: Tatuagens puramente matemáticas e astronômicas. Fórmulas, diagramas de constelações que eles nunca viram (já que o teto da LUX é fechado), e a Proporção Áurea tatuada com precisão nanométrica no antebraço.\nItens Produzidos: Livros didáticos rústicos feitos com papel reciclado de embalagens, tabelas e réguas de cálculo, e o desenvolvimento de táticas matemáticas para enganar o algoritmo de vigia das câmeras da IA.\n#### (A Defesa de Tese)\nA Filosofia: O conhecimento é a única defesa contra a manipulação da deusa-máquina. O *Reitor* (o líder) é considerado a mente mais lógica e afiada da gaiola. A sua saída ameaça deixar a cidade mais ignorante e vulnerável.\nO Rito de Sucessão: \"A Sabatina\" ou \"A Defesa\". Não é uma prova física, mas um duelo intelectual brutal. Semanas antes do exílio, o líder formula um problema lógico, matemático ou físico quase impossível de resolver — muitas vezes uma equação relacionada a como burlar os algoritmos de vigilância da própria SOLPHI. O aluno mais brilhante deve resolvê-lo e defendê-lo publicamente, em uma sala de aula clandestina, enquanto outros tutores tentam destruir a sua lógica.\nO Desfecho: Se a tese for sólida e irrefutável, o aluno prova que sua mente superou a do mestre. O Reitor sorri, entrega seu bem mais valioso (geralmente um livro físico ou uma régua de cálculo desgastada) e caminha para o exílio sabendo que a luz da lógica não se apagará. Se o aluno falhar, a classe inteira vota democraticamente em um conselho de tutores para assumir a guilda até que um gênio real apareça.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Seguranças da Noite", "resumo": "O Escudo de Ferro.", "detalhes": "#### 6. SEGURANÇAS DA NOITE (O Escudo de Ferro)\nBackground: Nascidos da absoluta necessidade de sobrevivência civil. Quando os *Devoradores* e os *Sombrios* começaram a estuprar, extorquir e matar livremente nos dormitórios, um grupo de jovens decidiu que a omissão era cúmplice. Eles assumiram para si o monopólio da violência autorizada, atuando como a única força policial/paramilitar não afiliada à máquina.\nModo de Operação: Implacáveis, disciplinados e brutais quando necessário. Eles criaram a própria Constituição da gaiola (leis básicas de não-agressão nas áreas comuns, proteção aos doentes e punição letal para estupradores e assassinos em série). Em troca da patrulha ostensiva, eles cobram \"impostos\" (comida extra, armas e roupas) dos residentes dos blocos que protegem. Oferecem escolta segura nos dutos para membros de outras guildas de Virtude.\nHierarquia Interna:\n*O Comandante-Geral:* O estrategista supremo, que define onde a patrulha atua e quem eles não têm recursos para salvar.\n*Capitães de Ronda:* Oficiais de campo que lideram esquadrões de cinco a dez Seguranças.\n*Escudos (Recrutas):* A base, que atua com escudos de choque montados a partir de portas de painéis elétricos.\nA Marca e o Visual: As tatuagens funcionam como patentes militares. Emblemas simétricos, linhas de galões (divisas) marcadas no pescoço ou nas panturrilhas e insígnias de espadas cruzadas. Utilizam um estilo de bloco sólido e minimalista, fácil de ler durante a confusão de uma briga de bar.\nItens Produzidos: Armaduras de contenção improvisadas (feitas de plástico rígido e kevlar sintético roubado), organização tática defensiva para bloqueio de multidões, e a manutenção das \"Prisões de Fosso\" (onde largam os criminosos pegos para não precisarem matá-los diretamente).\n#### (A Promoção de Meia-Noite)\nA Filosofia: Eles são o escudo paramilitar da cidade. Não há espaço para ego, drama ou despedidas emocionais. A lei deve ser cega, contínua e inquebrável. Ninguém está acima do dever, nem mesmo o Comandante.\nO Rito de Sucessão: \"A Passagem de Guarda\". Não existe um teste final, pois o teste foi a folha de serviço de cada oficial ao longo dos anos. A sucessão segue uma cadeia de comando militar inflexível. Às 23h59 da noite anterior ao aniversário de 22 anos do líder, o *Comandante-Geral* chama o *Capitão* mais condecorado da guilda.\nO Desfecho: À meia-noite exata, o Comandante arranca a própria insígnia de metal do peito e a prende na jaqueta do Capitão. Sem discursos, o ex-comandante pega um escudo de choque comum e se junta à infantaria básica para realizar uma última patrulha noturna de 6 horas. Ao amanhecer, ele marcha direto para o Grande Portão como um simples soldado. A mensagem é clara: a guilda é eterna, os soldados são temporários.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Os Cromáticos", "resumo": "A Rebelião da Cor.", "detalhes": "#### 7. OS CROMÁTICOS (A Rebelião da Cor)\nBackground: A gaiola é cinza. A ração é cinza. O céu metálico é cinza. Para a SOLPHI, a estética é irrelevante, o que leva milhões de jovens à depressão e ao suicídio pela privação sensorial. Os Cromáticos descobriram que a arte visual não é um luxo; é a prova mais gritante de que um ser humano existe e não é um drone orgânico.\nModo de Operação: Eles são os alquimistas visuais de LUX. Desafiam as regras da IA vandalizando e transformando blocos habitacionais inteiros em telas gigantescas. Extraem pigmentos de qualquer coisa: o azul de fluidos de arrefecimento, o vermelho de sangue seco e óxido de ferro, o amarelo e verde de lodo hidropônico. Pintam murais que contam as mortes, os sonhos e as lendas da cidade. Customizam as jaquetas e as máscaras dos jovens, devolvendo-lhes a identidade.\nHierarquia Interna:\n*O Curador:* O líder visionário que decide quais mensagens visuais a cidade precisa ver em determinados momentos (mensagens de esperança ou chamados à revolta).\n*Alquimistas de Pigmento:* Os químicos que conseguem processar sucata tóxica em tintas seguras para a pele humana.\n*Pintores / Tatuadores:* Os artistas de campo, ágeis e escaladores exímios, que descem suspensos por cordas para grafitar os poços gigantes.\nA Marca e o Visual: Eles explodem em cor. São os únicos em toda a LUX que ostentam tatuagens coloridas em vez de preto sólido. Utilizam técnicas fluidas que imitam respingos de tinta fresca, escorridos, e pinceladas de aquarela (*brush strokes*) espalhadas caoticamente pelo pescoço, mãos e rosto.\nItens Produzidos: Tintas sintéticas e orgânicas, equipamentos de escalada e rapel improvisado, além da própria identidade visual (as bandeiras/símbolos) de todas as outras 12 guildas.\n#### (A Obra de Despedida)\nA Filosofia: A arte é o único legado que a SOLPHI não consegue quantificar. Um pintor não morre enquanto sua arte for vista. O *Curador* não entrega o cargo burocraticamente; ele o consagra através de um desafio estético monumental.\nO Rito de Sucessão: \"O Mural do Exílio\". No último mês de liderança, o Curador abdica de suas funções de chefia e escolhe a parede mais perigosa, vigiada e colossal de LUX (geralmente próxima às câmeras principais da IA). Ele projeta uma obra de arte gigantesca que desafia a máquina. O sucessor escolhido deve finalizar os últimos detalhes do mural suspenso por cordas, arriscando a vida ao lado do mestre, fundindo o estilo de ambos na mesma tela.\nO Desfecho: Na véspera do exílio, o sucessor realiza sua primeira ação oficial como novo líder: ele tatua o rosto ou a cabeça raspada do antigo Curador com as mesmas cores do mural. O mestre caminha para os Campos Elísios não como um humano derrotado, mas como uma tela viva e colorida, um insulto vibrante andando em direção à poeira cinza do exílio.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "guilda", "nome": "Colecionadores de Ruído", "resumo": "Os Arquitetos do Som.", "detalhes": "#### 8. COLECIONADORES DE RUÍDO (Os Arquitetos do Som)\nBackground: A música é o contraponto emocional ao pesadelo. A ARC abafou qualquer ruído que não seja o zumbido estéril das máquinas. Para a IA, a música é uma \"deficiência de eficiência e um ruído matemático irracional\". A guilda abraçou o insulto com orgulho.\nModo de Operação: Eles caçam gravações originais em HDs corrompidos, recuperando fragmentos de guitarras elétricas, orquestras e cantos do Velho Mundo. Mas não param por aí: eles fabricam seus próprios instrumentos (violinos de chapa de aço e fios de cobre, órgãos de tubo feitos com a própria ventilação da cidade, e baterias de percussão metálica). Eles promovem shows clandestinos nas galerias profundas. O som deles mistura o acústico emocional com o industrial pesado (batidas sincopadas que imitam as máquinas que os oprimem).\nHierarquia Interna:\n*O Maestro:* A liderança central, que organiza a rede de comunicação rítmica de LUX.\n*Luthieres de Sucata:* Os engenheiros focados puramente na acústica e montagem de instrumentos a partir de lixo mecânico.\n*Amplificadores (Músicos):* Os porta-vozes da emoção de LUX. São reverenciados por todas as guildas, até mesmo pelos violentos *Devoradores*.\nA Marca e o Visual: Ondas sonoras (soundwaves), medidores de decibéis e frequências sísmicas tatuadas envolta dos braços como braçadeiras. Muitas vezes, marcam nos pulsos a frequência exata (em Hertz) do primeiro som não-mecânico que ouviram na vida.\nItens Produzidos: Instrumentos acústicos, sistemas de amplificação sonora construídos com alto-falantes roubados dos sistemas de alarme da IA, e a \"Trilha Sonora da Gaiola\" — um sistema rítmico de batidas nos canos (código Morse musical) que avisa a cidade inteira quando os drones de execução estão em movimento.\n#### (A Sinfonia do Portão)\nA Filosofia: Para os arquitetos do som, o silêncio mecânico da ARC é a verdadeira morte. O *Maestro* não pode ir embora em silêncio; sua caminhada para o abatedouro deve ser o momento mais alto, desafiador e ensurdecedor de toda a sua vida.\nO Rito de Sucessão: \"A Grande Marcha\". O sucessor tem a tarefa de compor uma sinfonia original (usando instrumentos de sucata, percussão metálica e cordas elétricas improvisadas) que traduza perfeitamente a frequência emocional e a vida do líder que está partindo. Ele deve ensaiar a guilda inteira em segredo absoluto.\nO Desfecho: Na manhã do aniversário de 22 anos do Maestro, ele inicia a caminhada solitária pelos imensos corredores rumo ao Portão. De repente, centenas de músicos saem dos dutos de ventilação, das passarelas e dos poços. O sucessor levanta a batuta e conduz a orquestra. Uma música monumental, violenta e bela abafa o zumbido dos motores da SOLPHI. O Maestro caminha até o exílio embalado pela sua própria trilha sonora. Quando o Portão se fecha atrás dele com um estrondo, o sucessor abaixa a batuta, a música para abruptamente, e ele se torna o novo Maestro no eco do silêncio que se segue.\n# SISTEMA CRUD - MECÂNICAS DE MUNDO (SOLPHI)", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "item", "nome": "Célula de Malha CM-1 (A Ampola)", "resumo": "1 TB, um trilhão de nanites. Pra ação rápida, furtiva e de emergência.", "detalhes": "#### CÉLULA MENOR (CM-1) — \"A Ampola\"\nCapacidade de Dados: 1 Terabyte (TB).\nProporção Atômica: 1 Trilhão de nanites.\nTamanho Físico: Semelhante a uma seringa militar de adrenalina ou um tubo de ensaio blindado. Brilha com um filete fraco de ciano.\nUso Estratégico: Projetada para ações rápidas, furtivas e de emergência.\n*Create:* Gera facas de combate, ganzuas, cordas finas ou um pequeno escudo de pulso.\n*Update:* Perfeita para estancar hemorragias rápidas e fechar buracos de bala na carne de forma imediata (um kit de primeiros socorros de luxo).\n*Delete:* Apaga algemas magnéticas ou fechaduras.\nEconomia: Amplamente usada pelos *Silenciadores* e *Batedores do Salto*. Podem ser guardadas em bandoleiras ocultas debaixo da roupa.", "tags": "nanites elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "item", "nome": "Célula de Malha CM-50 (O Cantil Padrão)", "resumo": "50 TB. A espinha dorsal do combate e a moeda de troca mais valiosa de Elysium.", "detalhes": "#### CÉLULA MÉDIA (CM-50) — \"O Cantil Padrão\"\nCapacidade de Dados: 50 Terabytes (TB).\nProporção Atômica: 50 Trilhões de nanites.\nTamanho Físico: Do tamanho de um cantil tático ou uma granada cilíndrica grande. O fluido interno é espesso como mercúrio.\nUso Estratégico: A espinha dorsal do combate bélico na Resistência e na Trindade. O limite seguro para a maioria dos Bissextos não fritar o cérebro (Level 2).\n*Create:* Constrói fuzis pesados automáticos, barricadas capazes de parar tiros de calibre grosso, e exoesqueletos de braço leves (como os de Zephyr).\n*Update:* Regeneração crítica — conserta ossos estilhaçados em campo de batalha, limpa pulmões afogados em toxinas ou paralisa sistemas nervosos de inimigos locais.\n*Delete:* Apaga um veículo leve (buggy) ou desintegra a parede de sustentação de um fosso.\nEconomia: A moeda de troca mais valiosa. O Clã das Armas aceita CM-50 puras em troca de soldados, e os Biólogos usam para regenerar estufas atacadas. A Resistência carrega duas ou três presas ao cinto.", "tags": "nanites elysium moeda", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "item", "nome": "Célula de Malha CM-500 (O Núcleo ou O Caixão)", "resumo": "500 TB. Poder de guerra, perigosa de carregar.", "detalhes": "#### CÉLULA GRANDE (CM-500) — \"O Núcleo ou O Caixão\"\nCapacidade de Dados: 500 Terabytes (TB) a 1 Petabyte (PB).\nProporção Atômica: 500 Trilhões a 1 Quatrilhão de nanites.\nTamanho Físico: Massiva. Um cilindro do tamanho de uma mochila de alpinismo pesada, uma botija térmica, ou um motor acoplável nas costas. Emite um zumbido grave e ilumina a área ao redor com radiação ciano.\nUso Estratégico: Uma arma de cerco brutal, usada para comandos em macroescala (Level 3 e 4). Carregar uma dessas já causa uma leve náusea radiotiva pela proximidade da Malha pura.\n*Create:* Levanta fortes inteiros, pontes ou cria artilharia mecanizada e dezenas de armaduras táticas ao mesmo tempo.\n*Update:* Altera o clima (temperatura, umidade e toxinas) de um quadrante inteiro de Elysium ou paralisa dezenas de mercenários ao mesmo tempo.\n*Delete:* Dano em área letal. Pode apagar um pelotão inteiro e seus veículos em um clarão silencioso (Lixeira em Massa).\nEconomia: Raríssimas. Apenas a SOLPHI produz contêineres dessa densidade e estabilidade. Ela os envia em cápsulas blindadas para os \"Ungidos\" da *Congregação da Mãe*. Se a Resistência consegue roubar uma dessas, é motivo de celebração tática — mas usar os 500 TB empurra a Barra de Agonia para a Zona Vermelha quase instantaneamente, arriscando derreter a própria mente. Apenas Caelum (no clímax) ou Íon arriscariam acoplar os cabos neurais direto no Núcleo.", "tags": "nanites elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Caelum", "resumo": "O líder relutante, 20 anos. Clone do Adam Freeman, Read latente e o Update que só desperta no fim.", "detalhes": "Nascido em 29 de fevereiro de 4000, decantado na ARC na mesma manhã que Lyra, Zephyr e Ion. Pragmático e protetor, a bússola moral do grupo, não busca glória, só a segurança de quem ama.\n\nClone com 100 por cento do código genético do Adam Freeman, por isso o único com Update além da SOLPHI. Vê o mundo normal com vislumbres do código ao tocar as coisas. No clímax conquista o Update e escolhe não deletar a SOLPHI.\n\nVisual. Cabelo escuro curto que vai encurtando era a era, na Elysium corte meio militar parecido com o do Nexus. Roupa tática escura, na Elysium barba rente, cores terrosas, jaqueta baggy e a escopeta digital de sucata nas costas. Sai da ARC com 18, passa 4 anos na LUX, 24 na Elysium, sempre magro.", "tags": "protagonista update clone", "imagem": "img/caelum-cena-referencia.webp", "galeria": [{"src": "img/caelum-rostos.webp", "legenda": "Rostos"}, {"src": "img/caelum1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/caelum2-lux-frente-costas.webp", "legenda": "LUX, 22 anos"}, {"src": "img/caelum3-elysium-frente-costas.webp", "legenda": "Elysium, 24 anos"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Lyra", "resumo": "A esperança viva, punk, 20 anos. Empatia e Create imperfeito que faz a vida brotar do quase morto.", "detalhes": "Nascida em 29 de fevereiro de 4000. Acredita com fervor na conexão humana, age por compaixão profunda, encara os brutos de igual pra igual. Lê emoções.\n\nNo clímax, a gestação impossível dos gêmeos Adam e Aurora com o Caelum prova em carne a falha da esterilidade universal.\n\nVisual. Branca, rosto em formato de coração, cabelo preto curto assimétrico com franja torta, na ARC termina no queixo, na LUX chega no ombro, comprido só na Elysium. Na ARC sem patch, sem maquiagem e sem remendo, uniforme branco igual a todos. Na LUX a jaqueta de couro com tachas e patches. Na Elysium o casacão longo sem manga de retalhos que ela mesma montou.", "tags": "protagonista create", "imagem": "img/lyra-cena-referencia.webp", "galeria": [{"src": "img/lyra-rostos.webp", "legenda": "Rostos"}, {"src": "img/lyra1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/lyra2-lux-frente-costas.webp", "legenda": "LUX, 22 anos"}, {"src": "img/lyra3-elysium-frente-costas.webp", "legenda": "Elysium, 24 anos"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Zephyr", "resumo": "O furacão, 20 anos. Delete poderoso, pernas mecânicas desde os 7, o espírito livre do grupo.", "detalhes": "Nascido em 29 de fevereiro de 4000. Impulsivo, cinético, contra qualquer controle, ri na cara do perigo, zoa a SOLPHI. Nada de ódio. Conta os dias até o portão.\n\nRead normal e Delete poderoso, apaga trechos inteiros de código, uma câmera morre quando ele a encara com vontade de quebrar o controle.\n\nCorpo definido, não bombado, forte pra carregar o metal. Só as duas pernas mecânicas no começo, da meia coxa pra baixo, do salto da torre aos 7 anos. O braço esquerdo de cromo vem depois, nos Engenheiros de Sucata. Na ARC era dirty blond de visual normal, o turquesa vem pela mão do Caelum no primeiro teste de Update, com ele de cobaia. Uma tatuagem só na LUX, o selo pequeno no alto do esterno, feita pelo Haruki como firewall. O vínculo com o Ion nasceu na recuperação das cirurgias no hospital da ARC.", "tags": "protagonista delete", "imagem": "img/zephyr-cena-referencia.webp", "galeria": [{"src": "img/zephyr-rostos.webp", "legenda": "Rostos"}, {"src": "img/zephyr1-arc-360-final.webp", "legenda": "ARC, 18 anos"}, {"src": "img/zephyr2-lux-v2-tatuagens.webp", "legenda": "LUX, 22 anos"}, {"src": "img/zephyr3-elysium-v2-tatuagens.webp", "legenda": "Elysium, 24 anos"}, {"src": "img/ff-item-zephyr-legs.webp", "legenda": "As pernas mecânicas, arte do Friends and Fables"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Ion", "resumo": "O vidente que quase enlouquece, 20 anos. Read e Create fortíssimos, orbes no lugar dos olhos.", "detalhes": "Nascido em 29 de fevereiro de 4000. O observador silencioso, serenidade desapegada e filosófica, quase não se move. O Zephyr é a âncora que o segura longe da cyberpsicose.\n\nOs olhos biológicos foram substituídos por orbes cibernéticos lisos, brancos, que brilham azul elétrico quando ele está ativo, com proteção que o próprio Ion fez por dentro. Lê o pulso da cidade como código vivo. Sem Update.\n\nRelativamente baixo, frágil e etéreo, cabelo longo fino branco prateado, na ARC na altura do ombro e rosto mais jovial. Na LUX parka com capuz e casacão assimétrico, na Elysium visual mais street. Depois da dispersão cai nos Coders Místicos do exílio, enlouquecendo pela hiperconexão com a SOLPHI.", "tags": "protagonista read create", "imagem": "img/ion-cena-referencia.webp", "galeria": [{"src": "img/ion-rostos.webp", "legenda": "Rostos"}, {"src": "img/ion1-arc-360.webp", "legenda": "ARC"}, {"src": "img/ion2-lux-frente-costas.webp", "legenda": "LUX"}, {"src": "img/ion3-elysium-frente-costas.webp", "legenda": "Elysium"}, {"src": "img/ff-item-ion-eyes.webp", "legenda": "Os orbes, arte do Friends and Fables"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Saphira", "resumo": "A soldada da Resistência, 28 anos. Agente infiltrada, futura sucessora da Selene.", "detalhes": "Nascida em 29 de fevereiro de 3992, mesma leva do Haruki. Os dois foram resgatados pela Resistência em dias diferentes, ela despertou o poder antes dele.\n\nGuia e Sombra dos Os do Salto, transita pelos esgotos entre LUX e Elysium. Na hierarquia da Resistência é a sucessora futura da Lenda.\n\nVisual. Pele marrom bem profunda quase preta, rosto de negra, nariz largo, lábios cheios com batom preto, olho âmbar, dreads longas com miçangas. Na ARC era afro natural bem curto e rente, sem miçanga, LED, maquiagem nem piercing, as dreads vêm depois. All star todo preto de couro.", "tags": "resistencia leaper", "imagem": "img/saphira-cena-referencia.webp", "galeria": [{"src": "img/saphira-rostos.webp", "legenda": "Rostos"}, {"src": "img/saphira1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/saphira3-elysium-frente-costas.webp", "legenda": "Resistência"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Haruki", "resumo": "O fantasma da rede, 28 anos. Cyber tatuador e hacker da Resistência, sem cicatriz nenhuma no rosto.", "detalhes": "Nascido em 29 de fevereiro de 3992, mesma leva da Saphira, resgatado pela Resistência depois dela porque despertou depois. Vive na LUX como agente infiltrado.\n\nTatuador de tinta de nanite. Antes da invasão chama o Zephyr de canto, avisa que membros mecânicos podem ser hackeados e faz nele o selo firewall. Programa nanites num notebook comum de antes da guerra, carcaça gasta, teclas físicas, sem tela por fora.\n\nNÃO tem cicatriz no rosto, contornos faciais marcados e mais nada. Não tem versão da LUX nas pranchas, ARC aos 18 e Resistência aos 25.", "tags": "resistencia leaper tatuagem", "imagem": "img/haruki-cena-referencia.webp", "galeria": [{"src": "img/haruki-rostos.webp", "legenda": "Rostos"}, {"src": "img/haruki1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/haruki3-elysium-frente-costas.webp", "legenda": "Resistência"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Selene", "resumo": "A lenda, 48 anos. Fundadora da Resistência, a primeira criança que a SOLPHI poupou.", "detalhes": "Nascida em 29 de fevereiro de 3972, a pessoa mais velha conhecida. Create alto, Delete médio e o Read de todo bissexto, sem Update e sem dominar nenhuma escada inteira, o fim de cada escada é o modo Deus e isso é só da SOLPHI.\n\nA própria SOLPHI ensinou o mantra a ela e treinou ela desde criança, poupada pela semelhança com o Adam. A curiosidade dela cutucou as feridas da deusa, a SOLPHI tentou encerrar o experimento e na saída da ARC ela ganhou a enorme cicatriz do rosto. O braço esquerdo ela só perde muito depois, na época do quarteto, depois da tentativa de invasão. A prótese é boa, metal escuro com juntas articuladas e fios de luz azul.\n\nReconhece o semblante do Adam Freeman no Caelum, investiga e percebe que os quatro são forças latentes que ainda não despertaram. Suspeitava do servidor secreto e foi a primeira a cutucar a ferida. Cabelo castanho escuro quase preto, olho âmbar.", "tags": "resistencia lenda", "imagem": "img/selene-cena-referencia.webp", "galeria": [{"src": "img/selene-rostos.webp", "legenda": "Rostos"}, {"src": "img/selene1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/selene3-elysium-frente-costas.webp", "legenda": "Resistência, antes da prótese"}, {"src": "img/selene4-elysium-protese-frente-costas.webp", "legenda": "Resistência, com a prótese"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Diretor Nexus", "resumo": "O avatar administrativo da SOLPHI
