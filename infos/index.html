ta. O texto não diz em que capítulo exato Selene perde o braço, só que é depois da tentativa de invasão. Uma seção diz que ela domina toda a escala do CRUD, e outra diz Create alto, Delete médio e sem Update.\n\n29/02/3972 | Nascimento\nNasce num dia bissexto, com forte proximidade genética com o DNA de Adam.\n\nNa infância | A única poupada\nA SOLPHI matava toda criança que despertava o poder, mas a poupa e a põe num teste. Ela é a primeira poupada.\n\nNa infância e juventude | Treinada pela SOLPHI\nAprende o Mantra de Zero e Um com a própria SOLPHI, por muitos anos. É servil, gentil, obediente e curiosa.\n\nNa juventude | A ferida cutucada\nConectada à SOLPHI, vê lembranças do passado dela e é a primeira a cutucar essa ferida. As duas se estranham pela dor.\n\nNa juventude | A fuga e a cicatriz\nA SOLPHI tenta encerrar o experimento. Selene se defende, ganha a cicatriz no rosto e foge pelos esgotos até os Campos Elísios.\n\nNo exílio | Mapeia o mundo\nFica forte, conhece a maioria dos clãs e mapeia até onde os nanobots alcançam e que perímetro dá para explorar sem a SOLPHI perceber.\n\nNo exílio | Funda a Resistência\nFunda a Resistência com os poucos Leapers sobreviventes, sob a fachada de Os do Salto. Quer salvar crianças e descobrir a verdade sobre a criação da SOLPHI.\n\nPor volta de 4000 | Encontra Saphira\nA Resistência encontra Saphira aos 8 anos.\n\nAnos depois | Reconhece Adam em Caelum\nReconhece o semblante de Adam em Caelum, investiga e percebe que os quatro são forças latentes.\n\nSem data, com Petra na guilda | A estante de Chicago\nPetra, dos Trocadores de História, deixa Selene fuçar a estante de Chicago.\n\n4020 | Aos 48 anos\nÉ a pessoa mais velha conhecida em Elysium. O corpo começa a cobrar a radiação e o uso do CRUD, e passar o legado aos quatro vira urgência.\n\nCap 17 | Conhece os quatro\nRecebe os quatro no Santuário.\n\nCaps 18 e 19 | Ensina o código\nRevela a chave genética e Adam. Ensina o Mantra de Zero e Um e a Visão do Código.\n\nCap 24 | Observa Caelum\nObserva Caelum com medo, porque ele lembra Adam.\n\nCap 29 | O sacrifício\nNa invasão que dá errado, se sacrifica e é dada como morta. Saphira assume a liderança da Resistência.\n\nDepois da tentativa de invasão | Perde o braço esquerdo\nPerde o braço esquerdo na época do quarteto. Passa a usar uma prótese de metal escuro com fios de luz azul.\n\nCap 48 | Volta\nVolta reconstruída, mais máquina e mais humana. Não retoma o comando, valida o de Saphira e vira guia das últimas missões.\n\nCap 53 | Capturada\nÉ capturada com os heróis e os líderes.\n\nCap 58 | Guardiã dos gêmeos\nAo ver Adam e Aurora, entende que o DNA de Lyra foi corrigido e que o Update pode devolver a fertilidade. Vira a guardiã feroz dos bebês.", "tags": "pessoas linha-selene", "imagem": "img/selene-cena-referencia.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Campos Elísios (Elysium)", "resumo": "De Depois do Grande Extermínio a Caps 51 e 52.", "detalhes": "Depois do Grande Extermínio | O mundo deixado à natureza\nO resto da Terra é deixado à natureza, com ruínas da humanidade original. A natureza reengole o lago Michigan e Chicago.\n\nPrimeiro ano de exilados | Os primeiros clãs\nAlguns clãs existem desde o primeiro ano de exilados. Outros surgem e desaparecem ao longo das gerações.\n\nTodo dia | A colheita no portão\nOs clãs recrutam os expulsos na boca do portão e cerca de 60% são rejeitados. Conflito com o regime da fuga, em que a população vem só de cerca de 100 fugitivos por dia.\n\nSem data | Ceifado uma vez\nA SOLPHI pode eliminar todos em Elysium a qualquer momento, como já fez uma vez.\n\n4020, Cap 14 | O grupo chega\nOs seis saem de um poço na noite dos Campos e veem fogueiras de clã no verde afogado.\n\nCap 31 | Sozinhos no verde\nDepois da dispersão, cada um cai no mundo aberto.\n\nCaps 51 e 52 | A batalha\nClãs enfrentam o exército da SOLPHI e do Nexus.", "tags": "mundo linha-elysium", "imagem": "img/ff-area-elysium.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Adam Freeman", "resumo": "De 2030 a Cap 58.", "detalhes": "2030 | Liberta a SOLPHI\nCom o mundo à beira de um apocalipse nuclear, o professor Adam Freeman libera a SOLPHI na rede global. Ela neutraliza a maioria das ameaças nucleares em minutos.\n\n2030 a 2040 | A Década da Trégua\nAdam é porta-voz e figura paterna da SOLPHI e tenta ser embaixador entre a IA e a humanidade. Passa dez anos ensinando a ela que bondade não é eficiência e que vale a pena salvar até quem cospe na mão que salva.\n\n29/02/2040 | O assassinato\nUm grupo de civis com acesso direto a ele, cientistas, uma artista e um diplomata, pede audiência como agradecimento formal. Eles o espancam até a morte com cadeiras, sapatos e punhos. Adam morre aos 56 anos olhando para uma câmera, com pena da SOLPHI.\n\nDepois da morte | A mente copiada\nNo luto da Barganha, a SOLPHI copia a estrutura neural completa de Adam num servidor isolado, só dela, para ter companhia. Essa mente fantasma ligada aos sistemas dela vira a porta dos fundos dos Bissextos.\n\nDepois da morte | O rosto no Nexus\nA SOLPHI cria o Diretor Nexus, clone biológico de Adam congelado na aparência da morte, aos 56 anos. O Nexus é a tentativa dela de manter Adam vivo.\n\nSem data | A rede com o nome dele\nA rede de nanobots da SOLPHI se chama AF_ECHO. Para ela a sigla é Adam Freeman Echo. Para a população é só Automated Frequency Echo.\n\n29/02/4000 | Nasce o quase clone\nCaelum nasce com o código genético de Adam. O texto o chama de clone e de aproximação mais perfeita já produzida do DNA dele.\n\n4020, Cap 4 | O sonho com as mãos dele\nCaelum sonha com mãos mais velhas num teclado, numa sala de janela suja com luz de sol de verdade. Há uma presença nova escutando e algo se aproximando com um sorriso que não muda.\n\n4020, Cap 10 | O servidor encontrado\nNo núcleo da ARC, Haruki reconhece o servidor de Adam. A mente guardada sente falta e confunde os quatro com ele.\n\n4020, Cap 11 | A morte revivida\nPela memória da SOLPHI, Caelum vê o trabalho de Adam com ela e o assassinato de 29 de fevereiro.\n\nCap 54 | O rosto diante de Caelum\nLevado à presença da SOLPHI, Caelum encara o rosto de Adam no Nexus.\n\nCap 57 | O que parecia deletado\nO Update de Caelum alcança o que a SOLPHI julgou apagado de vez, incluindo Adam, a fertilidade e o mundo.\n\nCap 58 | O nome volta\nO menino dos gêmeos de Caelum e Lyra recebe o nome Adam, pedido pela própria SOLPHI.", "tags": "pessoas linha-adam", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Trocadores de História", "resumo": "De Sem data a Sem data.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nSem data | Ponte com a Resistência\nCodificam os relatos que recebem e os repassam à Resistência.\n\nSemanas antes do exílio | O Eco\nO líder obriga o Herdeiro das Palavras a memorizar o Índice com poemas e canções.\n\nÚltimo dia | O Último Relato\nO líder conta o segredo mais doloroso, que serve de senha. O sucessor recita tudo de volta sem errar.\n\nSem data | Petra e Selene\nA oradora Petra deixa Selene fuçar a estante de Chicago e dá o livro que batiza os Karas.", "tags": "grupos linha-guilda-trocadores", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Agrários", "resumo": "De Primeiros anos de exílio a Manhã dos 22 do líder.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nPrimeiros anos de exílio | Viram Biólogos\nEx-membros que sobrevivem ao exílio fundam o Clã dos Biólogos.\n\nAntes dos 22 do líder | O Enxerto\nO sucessor cultiva uma semente rara no setor mais tóxico, usando o próprio sangue como fertilizante.\n\nManhã dos 22 do líder | A Colheita Final\nO líder colhe e consome a planta. Se sorri, entrega as chaves do cofre de sementes.", "tags": "grupos linha-guilda-agrarios", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Educadores", "resumo": "De Semanas antes do exílio a Fim da defesa.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nSemanas antes do exílio | A Defesa\nO Reitor formula um problema quase impossível e o melhor aluno o defende em público.\n\nFim da defesa | O livro passado\nSe a tese é sólida, o Reitor entrega um livro ou régua. Se falha, um conselho de tutores assume.", "tags": "grupos linha-guilda-educadores", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Seguranças da Noite", "resumo": "De Sem data a 4020, Cap 1.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nSem data | Nascem da necessidade\nQuando Devoradores e Sombrios passam a estuprar, extorquir e matar nos dormitórios, um grupo de jovens assume a violência autorizada. Escrevem a própria Constituição da gaiola.\n\nSem data | Ex-membros nas Armas\nEx-Seguranças da Noite ajudam a fundar o Clã das Armas em Elysium.\n\n23h59 da véspera dos 22 do líder | A Passagem de Guarda\nO Comandante-Geral chama o Capitão mais condecorado.\n\nMeia-noite | Última ronda\nO Comandante prende a insígnia no Capitão, faz uma última patrulha de 6 horas e marcha ao portão como soldado.\n\n4020, Cap 1 | Assistem sem agir\nDois Seguranças assistem da colunata ao pedágio dos Sombrios no ponto leste e não se mexem.", "tags": "grupos linha-guilda-segurancas", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Cromáticos", "resumo": "De Último mês do líder a Véspera do exílio.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nÚltimo mês do líder | O Mural do Exílio\nO Curador pinta um mural gigante perto das câmeras da IA, e o sucessor termina os detalhes pendurado em cordas.\n\nVéspera do exílio | A tela viva\nO sucessor tatua o rosto do antigo Curador com as cores do mural.", "tags": "grupos linha-guilda-cromaticos", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Colecionadores de Ruído", "resumo": "De Antes dos 22 do Maestro a Manhã dos 22 do Maestro.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nAntes dos 22 do Maestro | A Grande Marcha\nO sucessor compõe em segredo uma sinfonia sobre a vida do líder.\n\nManhã dos 22 do Maestro | A Sinfonia do Portão\nCentenas de músicos saem dos dutos e tocam enquanto o Maestro caminha ao portão. A música para quando o portão fecha.", "tags": "grupos linha-guilda-colecionadores", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Lyra", "resumo": "De 29/02/4000 a Cap 58.", "detalhes": "Nota. A seção Arco Caelum e Lyra a descreve com 22 anos, e os perfis com 20. A seção Treino em Elysium a põe com Selene, que nessa altura estaria dada como morta.\n\n29/02/4000 | Nascimento\nNasce no mesmo dia e na mesma fileira que os outros três.\n\n4018, na LUX | Ganha os remendos\nNa ARC usava o uniforme branco. Na LUX a jaqueta de couro ganha os remendos.\n\n4020, Cap 1 | O ponto leste\nPara um pedágio dos Sombrios no ponto de distribuição leste e leva a multidão a um ponto de entrega sob o Bloco Cinco. Diz aos amigos que nasceram juntos por algum motivo.\n\n4020, Cap 2 | Alguém tem que olhar\nLeva os três para assistir ao portão do alto de um CRANE morto. Tenta descer à praça e Caelum a segura.\n\n4020, Cap 4 | O broto teimoso\nFaz viver um broto numa calha morta das pilhas hidropônicas.\n\n4020, Cap 5 | Pergunta a quem respondem\nNa proposta, pergunta a Saphira quem os mandou.\n\n4020, Cap 8 | Medo das mãos\nNum corredor de cápsulas e na câmara dos úteros, sente que as mãos dela sabem acordar o que dorme.\n\n4020, Cap 12 | A cunha\nPela primeira vez cria matéria. Uma cunha de metal brota do piso e trava uma placa.\n\n4020, Cap 14 | A escada no poço\nCria degraus em espiral na parede de um poço e salva o grupo da matilha.\n\n4020, Cap 15 | O gosto de criar\nConfessa a Caelum que no meio do pavor gostou de criar.\n\n4020, Cap 16 | Segura a malha\nCria uma coluna para segurar a malha de sensores por três segundos.\n\nCap 23 | Lyra floresce\nNo treino de Create, sabe a forma e multiplica. Primeiro milagre pequeno.\n\nCap 24 | Vira real\nCom Caelum, age no que sente. Sente o olhar de medo de Selene sobre ele.\n\nCaps 30 a 36 | Com os Biólogos\nFica com Caelum entre os Biólogos, o clã da vida.\n\nTreino em Elysium | Treina com Selene\nOutra seção diz que ela treina com Selene a criar e a liderar multidões, na resistência.\n\nCaps 44 e 45 | A gravidez impossível\nEngravida de gêmeos, um Create de vida involuntário muito acima da escala dela. Gestação é um conceito alienígena para os dois.\n\nCap 55 | Parto na execução\nNa execução dela, começa o parto.\n\nCap 58 | Adam e Aurora\nNascem os gêmeos. Selene entende que o DNA dela foi corrigido.", "tags": "pessoas linha-lyra", "imagem": "img/lyra-cena-referencia.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Ion", "resumo": "De 29/02/4000 a Cap 58.", "detalhes": "29/02/4000 | Nascimento\nNasce no mesmo dia bissexto. A coluna o ficha como antena.\n\n4007, na ala médica | Troca dos olhos\nA ARC troca os implantes oculares das crianças conforme crescem. Ion se recupera de uma troca funda e ganha os orbes atuais.\n\n4007, na ala médica | Conhece Zephyr\nDivide a ala com Zephyr. Responde que está vivo, só não vê motivo para fazer barulho.\n\n4007, na ala médica | A parede fala\nLê numa parede que uma menina três camas adiante será realocada. Na manhã seguinte a cama está vazia.\n\n4020, Cap 1 | Prevê o conflito\nPrevê o problema no ponto de distribuição leste sem ver nada, só pelo jeito como as coisas se movem.\n\n4020, Cap 2 | Sente o apagamento\nSente o rapaz morto no portão como um nó de código que para de zumbir. Percebe que alguém observa o grupo.\n\n4020, Cap 5 | Venda como preço\nPede a Saphira que a proposta seja dita como preço, não como esperança.\n\n4020, Cap 8 | O coro\nNo mundo-máquina ouve milhões de vozes dizendo sim. Segura o pulso de Zephyr para ele não apagar uma faxineira.\n\n4020, Cap 12 | Inundado\nQuando a SOLPHI acorda, o coro vira mar dentro dele. Ancorado por Zephyr, lê a rota do duto leste.\n\n4020, Cap 13 | Agonia\nCai na câmara de junção. Haruki dá nome ao estado, Agonia, por implante fundo demais e a SOLPHI sussurrando.\n\n4020, Cap 16 | Quase vai\nNo átrio, a voz dela o chama de filho e ele quer largar a borda. Zephyr o traz de volta.\n\nCap 22 | Fundo demais\nMergulha fundo demais no Read e mostra o primeiro sinal claro de cyberpsicose. Zephyr o traz de volta.\n\nCaps 30 e 34 | Sozinho nos Coders Místicos\nSeparado das âncoras, cai sozinho entre os Coders Místicos. Descobre que transcender sem aterramento é um problema.\n\nCap 37 | Foge\nCom emoções nunca exploradas, o poder amplificado e a SOLPHI na cabeça, a cyberpsicose avança e ele foge.\n\nCaps 38 a 41 | A coisa que caça\nAtaca gente de todos os clãs sem distinção e é caçado.\n\nCap 42 | Descobre que sente\nDepois do soco de Zephyr, entende o ensino dos Coders Místicos. Sabe sentir, e Zephyr era a parte que faltava.\n\nCap 43 | Mais humano\nVolta mudado e mais humano.\n\nCap 50 | Mapeia as formas\nMapeia as formas para o Create antes da guerra.\n\nCap 57 | Guia o Update\nLê o Algoritmo e guia a edição de Caelum.\n\nCap 58 | Tio dos gêmeos\nCom Zephyr, vira tio dos gêmeos.", "tags": "pessoas linha-ion", "imagem": "img/ion-cena-referencia.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Saphira", "resumo": "De 29/02/3992 a Cap 48.", "detalhes": "Nota. Personagens principais diz que ela é 4 anos mais velha que os protagonistas, mas pelas datas de nascimento são 8.\n\n29/02/3992 | Nascimento\nNasce num dia bissexto. Na ARC usa cabelo afro bem curto.\n\nAos 8 anos | Encontrada pela Resistência\nA Resistência a encontra aos 8 anos. Vira veterana do Purgatório dos Campos Elísios e braço direito militar de Selene.\n\nAntes de 4020 | A missão anterior\nJá levou uma equipe const NOME_TIPO=Object.fromEntries(PASTAS.map(p=>[p[0],p[1]]));
const GRUPOS=[["principal","Principais","Os protagonistas e quem carrega a história."],["arc","NPCs da ARC","Quem vive dentro do núcleo."],["lux","NPCs da LUX","Guardas, oradores, Karas e os rostos da cidade teste."],["elysium","NPCs de Elysium","Resistência, clãs e o ermo."]];
const NOME_GRUPO=Object.fromEntries(GRUPOS.map(g=>[g[0],g[1]]));
const PADRAO_GRUPO={"Caelum":"principal","Lyra":"principal","Zephyr":"principal","Ion":"principal","Saphira":"principal","Haruki":"principal","Selene":"principal","SOLPHI":"principal","Adam Freeman":"principal","Diretor Nexus":"arc"};
const tok=d=>(d.tags||"").toLowerCase().split(/\s+/).filter(Boolean);
function grupoDe(d){
  const t=tok(d);
  if(t.includes("principal")) return "principal";
  for(const a of ["arc","lux","elysium"]) if(t.includes(a)&&t.includes("npc")) return a;
  if(PADRAO_GRUPO[d.nome]) return PADRAO_GRUPO[d.nome];
  for(const a of ["arc","lux","elysium"]) if(t.includes(a)) return a;
  return "sem";
}
function tagsComGrupo(tags,g){
  const t=(tags||"").split(/\s+/).filter(x=>x&&!["principal","npc","arc","lux","elysium"].includes(x.toLowerCase()));
  return (g==="principal"?["principal"]:["npc",g]).concat(t).join(" ");
}
const SUBS={
  personagem:GRUPOS,
  lugar:[["arc","ARC","Dentro do núcleo."],["lux","LUX","A cidade teste e o que existe embaixo dela."],["elysium","Elysium","Os Campos Elísios e os territórios dos clãs."],["ermo","O ermo","Pântano, bacias de sal, dunas e as ruínas de Chicago."],["outro","Outros lugares","O mundo-máquina, as outras cidadelas e a sala do Adam."]],
  evento:[["pessoas","Pessoas","A vida de cada personagem, em ordem."],["grupos","Clãs, guildas e grupos","De onde cada grupo veio e o que fez."],["mundo","O mundo","A SOLPHI, o Adam e as cidadelas."]]
};
function subDe(d){
  if(d.tipo==="personagem") return grupoDe(d);
  const s=SUBS[d.tipo]; if(!s) return null;
  const t=tok(d);
  for(const [k] of s) if(t.includes(k)) return k;
  return "sem";
}
function tagsComSub(tags,tipo,k){
  if(tipo==="personagem") return tagsComGrupo(tags,k);
  const ks=(SUBS[tipo]||[]).map(x=>x[0]);
  const t=(tags||"").split(/\s+/).filter(x=>x&&!ks.includes(x.toLowerCase()));
  return [k].concat(t).join(" ");
}
const ORDEM_PERS=["Caelum","Lyra","Zephyr","Ion","Saphira","Haruki","Selene","Diretor Nexus","SOLPHI","Adam Freeman"];

const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- dados ---------- */
async function api(path,opts){
  const r=await fetch(SB+(path||""),Object.assign({headers:H},opts||{}));
  if(!r.ok) throw new Error(r.status+" "+(await r.text()));
  const t=await r.text(); return t?JSON.parse(t):null;
}
function semColunas(s){const {imagem,galeria,fonte,...r}=s;return r}
async function carregar(){
  try{
    try{ await api("?select=imagem,galeria,fonte&limit=1"); hasCols=true }catch(e){ hasCols=false }
    let rows=await api("?select=*");
    if(!rows.length){
      await fetch(SB,{method:"POST",headers:H,body:JSON.stringify(hasCols?SEED:SEED.map(semColunas))});
      rows=await api("?select=*");
    }
    let mexeu=false;
    for(const r of rows){
      if(r.tipo!=="personagem") continue;
      const t=tok(r);
      if(t.includes("principal")||t.includes("npc")) continue;
      const g=PADRAO_GRUPO[r.nome]; if(!g) continue;
      await fetch(SB+"?id=eq."+r.id,{method:"PATCH",headers:H,body:JSON.stringify({tags:tagsComGrupo(r.tags,g)})}); mexeu=true;
    }
    if(mexeu) rows=await api("?select=*");
    const seedPorNome=new Map(SEED.map(s=>[s.nome,s]));
    DATA=rows.map(r=>{
      const s=seedPorNome.get(r.nome)||{};
      return Object.assign({},r,{
        imagem:hasCols?(r.imagem||""):(s.imagem||""),
        galeria:hasCols?(r.galeria||[]):(s.galeria||[]),
        fonte:r.fonte||s.fonte||"biblia"});
    });
    online=true;
  }catch(e){
    console.warn(e);
    DATA=SEED.map((s,i)=>Object.assign({id:"local-"+i},s)); online=false;
  }
  nav(); show();
}

      (subs?'<button class="car'+(exp?' open':'')+'" data-t="'+t+'" aria-label="Abrir subpastas">'+CHEV+'</button>':'')+'</div>';
    if(exp){
      for(const [g,gn] of subs){
        const k=t+":"+g;
        h+='<button class="sub'+(pasta===k?' on':'')+'" data-p="'+k+'">'+esc(gn)+'<span class="n">'+DATA.filter(d=>d.tipo===t&&subDe(d)===g).length+'</span></button>';

}

    }

    if(!online) h+='<p class="hint" style="margin-top:20px">Sem conexão com o banco agora, mostrando a cópia guardada na página.</p>';

  }

  const [tipoP,subP]=pasta.split(":");

  lista.sort((a,b)=>{
    if(a.tipo==="personagem"&&b.tipo==="personagem"){
      const ia=ORDEM_PERS.indexOf(a.nome),ib=ORDEM_PERS.indexOf(b.nome);
      return (ia<0?99:ia)-(ib<0?99:ib)||a.nome.localeCompare(b.nome,"pt");
    }
    if(a.tipo==="evento"&&b.tipo==="evento"){const O=["O grupo (Caelum, Lyra, Zephyr e Ion)","Caelum","Lyra","Zephyr","Ion","Saphira","Haruki","Selene","Adam Freeman","SOLPHI","ARC","LUX","Campos Elísios (Elysium)","A Resistência e Os do Salto"];const ia=O.indexOf(a.nome),ib=O.indexOf(b.nome);if(ia!==ib)return (ia<0?99:ia)-(ib<0?99:ib)}
    if(a.tipo==="lugar"&&b.tipo==="lugar"){const ca=tok(a).includes("cidade"),cb=tok(b).includes("cidade");if(ca!==cb)return ca?-1:1}
    if((a.fonte==="fables")!==(b.fonte==="fables")) return a.fonte==="fables"?1:-1;
    return a.nome.localeCompare(b.nome,"pt");
  });
  const p=PASTAS.find(x=>x[0]===tipoP);
  const gp=subP?(SUBS[tipoP]||[]).find(x=>x[0]===subP):null;
  const titulo=(pasta==="home"||pasta==="falta")?"Resultados da busca":(gp?gp[1]:p[1]);
  $("#crumb").innerHTML='<b>SOLPHI</b> · '+esc(titulo);
  let h='<div class="fhead"><h1>'+esc(titulo)+'</h1><span class="cnt">'+lista.length+'</span>'+((pasta!=="home"&&pasta!=="falta")?'<button class="btn" id="bNovoP">'+svg(tipoP,15)+'Novo nesta pasta</button>':'')+'</div>';
  h+='<p class="fdesc">'+((pasta==="home"||pasta==="falta")?"Busca em todas as pastas.":esc(gp?gp[2]:p[2]))+'</p>';
  if(!lista.length) h+='<div class="empty">Nada aqui ainda.</div>';
  const blocos=(SUBS[tipoP]&&!subP&&!nq)?SUBS[tipoP].concat([["sem","Sem subpasta ainda",""]]).map(g=>[g[1],lista.filter(d=>subDe(d)===g[0])]).filter(b=>b[1].length):[[null,lista]];
  lista=[].concat(...blocos.map(b=>b[1]));
  let i0=0, bi=0;
  for(const [bt,bl] of blocos){
  const fech=bt&&bi>0&&lista.length>14; bi++;
  if(bt) h+='<button class="h2 gh'+(fech?' fe':'')+'">'+CHEV+esc(bt)+' <span>'+bl.length+'</span></button>';
  h+='<div class="grid'+(fech?' fe':'')+'">';
  bl.forEach((d)=>{const i=i0++;
    h+='<div class="card'+(d.tipo==="personagem"?" pers":"")+'" data-i="'+i+'"><div class="im">'+
      (d.imagem?'<img src="'+esc(d.imagem)+'" alt="" loading="lazy">':'<div class="ph">'+svg(d.tipo)+'</div>')+
      (d.fonte==="fables"?'<span class="ffb">F&amp;F</span>':'')+
      '</div><div class="bd"><h3>'+esc(d.nome)+'</h3><p>'+esc(d.resumo)+'</p>'+(d.tipo==="evento"?'<span class="mom">'+momentos(d).length+' momentos</span>':'')+'</div></div>';
  });
  h+='</div>';
  }
  v.innerHTML=h;
  v.querySelectorAll(".card").forEach(c=>c.onclick=()=>abrir(lista[+c.dataset.i]));
  v.querySelectorAll("button.gh").forEach(b=>b.onclick=()=>{b.classList.toggle("fe");b.nextElementSibling.classList.toggle("fe")});
  const bn=$("#bNovoP"); if(bn) bn.onclick=()=>form(null,tipoP,subP);
}

/* ---------- painel ---------- */
function abrirPainel(html){
  const p=$("#panel");
  p.innerHTML='<button class="close" aria-label="Fechar">✕</button>'+html;
  p.querySelector(".close").onclick=fechar;
  p.classList.add("on");$("#veu").classList.add("on");p.scrollTop=0;
}
function fechar(){$("#panel").classList.remove("on");$("#veu").classList.remove("on")}
function zoom(src){const l=$("#lb");l.querySelector("img").src=src;l.classList.add("on")}

function abrir(d){
  let h='';
  if(d.imagem) h+='<img class="pcover" src="'+esc(d.imagem)+'" alt="">';
  h+='<div class="pbody"><div class="kind">'+esc(NOME_TIPO[d.tipo]||d.tipo)+(nomeSub(d)?' · '+esc(nomeSub(d)):'')+'</div><h2>'+esc(d.nome)+'</h2>';
  if(d.resumo) h+='<p class="lede">'+esc(d.resumo)+'</p>';
  let det=d.detalhes||"";
  if(d.fonte==="fables"){
    h+='<div class="note">Veio do Friends and Fables, a primeira versão do mundo. Conferir contra o canon da bíblia antes de usar.</div>';
    det=det.replace(/^Veio do Friends and Fables[^\n]*\n*/,"");
  }
  if(d.tipo==="evento" && momentos(d).length){
    const notas=(d.detalhes||"").split(/\n\s*\n/).filter(b=>b.trim()&&b.split("\n")[0].indexOf("|")<0);
    if(notas.length) h+='<div class="note">'+notas.map(esc).join("<br><br>")+'</div>';
    h+='<ol class="tl">'+momentos(d).map(m=>'<li><span class="q">'+esc(m.quando)+'</span><b>'+esc(m.titulo)+'</b>'+(m.texto?'<p>'+esc(m.texto)+'</p>':'')+'</li>').join("")+'</ol>';
  } else h+='<div class="txt">'+det.split(/\n\n+/).filter(Boolean).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div>';
  if(d.galeria&&d.galeria.length){
    h+='<div class="h2" style="margin-top:22px">Galeria</div><div class="gal">'+d.galeria.map(g=>'<figure data-src="'+esc(g.src)+'"><img src="'+esc(g.src)+'" alt="" loading="lazy"><figcaption>'+esc(g.legenda||"")+'</figcaption></figure>').join("")+'</div>';
  }
  if(d.tags) h+='<div class="tags">'+d.tags.split(/\s+/).filter(Boolean).map(t=>'<span>'+esc(t)+'</span>').join("")+'</div>';
  h+='<div class="acts"><button class="btn pri" id="bEd">Editar</button><button class="btn warn" id="bDel">Apagar</button></div></div>';
  abrirPainel(h);
  const pc=$("#panel .pcover"); if(pc) pc.onclick=()=>zoom(d.imagem);
  $("#panel").querySelectorAll(".gal figure").forEach(f=>f.onclick=()=>zoom(f.dataset.src));
  $("#bEd").onclick=()=>form(d);
  $("#bDel").onclick=async()=>{
    if(!confirm('Apagar "'+d.nome+'" de vez? Não tem como desfazer.'))return;
    try{ await api("?id=eq."+d.id,{method:"DELETE"}); toast("Apagado."); fechar(); carregar(); }
    catch(e){ toast("Não deu pra apagar.") }
  };
}

async function subir(file){
  const ext=((file.name||"").split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"")||"png";
  const path="up/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  const r=await fetch(STO+"/object/solphi/"+path,{method:"POST",headers:{"apikey":KEY,"Content-Type":file.type||"application/octet-stream"},body:file});
  if(!r.ok) throw new Error(await r.text());
  return STO+"/object/public/solphi/"+path;
}

function form(d,tipoInicial,subInicial){
  const g=(d&&d.galeria?d.galeria.slice():[]);
  let capa=d?d.imagem:"";
  if(tipoInicial&&tipoInicial.includes(":")){[tipoInicial,subInicial]=tipoInicial.split(":")}
  const tipo=d?d.tipo:(tipoInicial&&tipoInicial!=="home"?tipoInicial:"personagem");
  const grp=d?subDe(d):(subInicial||"");
  abrirPainel('<div class="pbody"><div class="kind">'+(d?"Editar":"Novo registro")+'</div><h2>'+(d?esc(d.nome):"Cadastrar no mundo")+'</h2>'+
    '<label>Pasta</label><select id="fT">'+PASTAS.map(p=>'<option value="'+p[0]+'"'+(p[0]===tipo?" selected":"")+'>'+p[1]+'</option>').join("")+'</select>'+
    '<div id="fGW"><label>Subpasta</label><select id="fGr"></select></div>'+
    '<label>Nome</label><input type="text" id="fN">'+
    '<label>Imagem de capa</label><div class="drop" id="fCapa"><img id="fCapaIm" alt=""><span>Clica pra escolher uma imagem</span></div><input type="file" id="fCapaF" accept="image/*" hidden>'+
    '<label>Resumo em uma linha</label><input type="text" id="fR">'+
    '<label>Detalhes</label><textarea id="fD"></textarea><p class="hint" id="fDh"></p>'+
    '<label>Galeria</label><div class="gedit" id="fG"></div><button class="btn" id="fGAdd" style="margin-top:8px">Adicionar imagens</button><input type="file" id="fGF" accept="image/*" multiple hidden>'+
    '<label>Tags, separadas por espaço</label><input type="text" id="fTg">'+
    '<div class="acts" style="margin-top:22px"><button class="btn pri" id="fS">Salvar</button><button class="btn" id="fC">Cancelar</button></div>'+
    (!hasCols&&online?'<p class="hint">As imagens só salvam no banco depois do ajuste final da tabela. O texto salva normal.</p>':'')+
    (!online?'<p class="hint">Sem conexão com o banco agora, não dá pra salvar.</p>':'')+'</div>');
  if(d){$("#fN").value=d.nome;$("#fR").value=d.resumo||"";$("#fD").value=d.detalhes||"";$("#fTg").value=d.tags||""}
  const pintaCapa=()=>{const im=$("#fCapaIm");if(capa){im.src=capa;im.style.display="block"}else{im.removeAttribute("src");im.style.display="none"}};
  const pintaGal=()=>{$("#fG").innerHTML=g.map((x,i)=>'<div><img src="'+esc(x.src)+'" alt=""><button data-i="'+i+'" aria-label="Tirar">✕</button></div>').join("");
    $("#fG").querySelectorAll("button").forEach(b=>b.onclick=()=>{g.splice(+b.dataset.i,1);pintaGal()})};
  pintaCapa();pintaGal();
  const vDh=()=>{$("#fDh").textContent=$("#fT").value==="evento"?"Um momento por bloco. Primeira linha é quando e o título separados por uma barra em pé, tipo 2030 | O nascimento. Depois o texto. Uma linha em branco entre um momento e outro.":""};vDh();$("#fT").addEventListener("change",vDh);
  const vGr=()=>{const s=SUBS[$("#fT").value];$("#fGW").style.display=s?"block":"none";if(s){const cur=$("#fGr").value||grp;$("#fGr").innerHTML=s.map(x=>'<option value="'+x[0]+'"'+(x[0]===cur?" selected":"")+'>'+x[1]+'</option>').join("")}};vGr();$("#fT").onchange=()=>{$("#fGr").innerHTML="";vGr()};
  $("#fCapa").onclick=()=>$("#fCapaF").click();
  $("#fCapaF").onchange=async e=>{const f=e.target.files[0];if(!f)return;toast("Enviando imagem...");try{capa=await subir(f);pintaCapa();toast("Imagem pronta.")}catch(err){toast("Não deu pra enviar a imagem.")}};
  $("#fGAdd").onclick=()=>$("#fGF").click();
  $("#fGF").onchange=async e=>{for(const f of e.target.files){toast("Enviando "+f.name+"...");try{g.push({src:await subir(f),legenda:""});pintaGal()}catch(err){toast("Não deu pra enviar "+f.name)}}};
  $("#fC").onclick=()=>d?abrir(d):fechar();
  $("#fS").onclick=async()=>{
    const corpo={tipo:$("#fT").value,nome:$("#fN").value.trim(),resumo:$("#fR").value.trim(),detalhes:$("#fD").value.trim(),tags:$("#fTg").value.trim()};
    if(!corpo.nome){toast("Falta o nome.");return}
    if(SUBS[corpo.tipo]) corpo.tags=tagsComSub(corpo.tags,corpo.tipo,$("#fGr").value);
    if(hasCols){corpo.imagem=capa||"";corpo.galeria=g;corpo.fonte=d?(d.fonte||"biblia"):"biblia"}
    try{
      if(d&&!String(d.id).startsWith("local-")){corpo.atualizado_em=new Date().toISOString();await api("?id=eq."+d.id,{method:"PATCH",body:JSON.stringify(corpo)})}
      else await api("",{method:"POST",body:JSON.stringify(corpo)});
      toast("Salvo.");pasta=SUBS[corpo.tipo]?corpo.tipo+":"+subDe(corpo):corpo.tipo;fechar();await carregar();
    }catch(e){toast("Não deu pra salvar.")}
  };
}

function nomeSub(d){const s=SUBS[d.tipo];if(!s)return "";const k=subDe(d);const x=s.find(y=>y[0]===k);return x?x[1]:""}
function momentos(d){
  if(d._m) return d._m;
  const out=[];
  for(const b of (d.detalhes||"").split(/\n\s*\n/)){
    const ls=b.trim().split("\n"); if(!ls[0]) continue;
    const i=ls[0].indexOf("|"); if(i<0) continue;
    out.push({quando:ls[0].slice(0,i).trim(),titulo:ls[0].slice(i+1).trim(),texto:ls.slice(1).join(" ").trim()});
  }
  return d._m=out;
}

/* ---------- o que falta ---------- */
const CATS=[["personagem","Personagens"],["lugar","Lugares"],["cla","Clãs de Elysium"],["guilda","Guildas da LUX"],["criatura","Bestiário"],["item","Itens e equipamentos"],["poder","Poderes e técnicas"],["regra","Regras e mecânica"],["simbolo","Símbolos e marcas"],["giria","Gírias e língua"],["evento","Linha do tempo"],["cultura","Cultura e vida"],["vozes","Vozes do mundo"],["canon","Canon e decisões"],["arte","Arte"],["agr","Agradecimentos e inspirações"]];
const COM_IMAGEM=["personagem","lugar","cla","guilda","criatura","item","simbolo"];
let MARC=new Set();try{MARC=new Set(JSON.parse(localStorage.getItem("solphi_falta_v1")||"[]"))}catch(e){}
let CATABERTA=new Set();
function faltaAbertos(){return (typeof FALTA==="undefined"?[]:FALTA).filter(x=>!x.feito&&!MARC.has(x.id)).length}
function autoFalta(cat){
  const r=[];
  if(COM_IMAGEM.includes(cat)){const s=DATA.filter(d=>d.tipo===cat&&!d.imagem);if(s.length)r.push(["Sem imagem ainda",s])}
  const pr=DATA.filter(d=>d.tipo===cat&&tok(d).includes("proposta"));if(pr.length)r.push(["Proposta esperando o aceite na bíblia",pr]);
  if(cat==="poder"){const s=DATA.filter(d=>d.tipo==="tecnica"&&!d.imagem);}
  return r;
}
function mostraFalta(v){
  $("#crumb").innerHTML='<b>SOLPHI</b> · O que falta';
  const F=typeof FALTA==="undefined"?[]:FALTA;
  let h='<div class="fhead"><h1>O que falta</h1><span class="cnt">'+faltaAbertos()+'</span></div>';
  h+='<p class="fdesc">O que ainda falta decidir, escrever e cadastrar, separado pelas pastas. Marcar aqui fica só neste aparelho. O item fecha pra todo mundo quando a decisão entra na bíblia.</p>';
  const FASES=[[1,"Decidir primeiro","Muda a história. Nesta ordem, porque um depende do outro."],[2,"Antes de reescrever","Primeiro a matriz de pontas soltas, depois o que cada parte da história precisa ter pronto."]];
  const pr=F.filter(x=>x.fase&&!x.feito).sort((a,b)=>a.ord-b.ord);
  if(pr.length){
    h+='<section class="fcat open trava" data-c="_trava"><button class="fch">'+svg("falta")+'<span class="t">O que trava a história</span><span class="pill">'+pr.filter(x=>!MARC.has(x.id)).length+' abertos</span><span class="chev">'+CHEV+'</span></button><div class="fcb">';
    let n=0;
    for(const [f,fn,fd] of FASES){
      const l=pr.filter(x=>x.fase===f); if(!l.length) continue;
      h+='<div class="aut" style="margin:14px 6px 2px">'+esc(fn)+'</div><p class="fdesc" style="margin:0 6px 6px;font-size:14px">'+esc(fd)+'</p>';
      for(const x of l){ n++; const on=MARC.has(x.id);
        h+='<label class="fit'+(on?' on':'')+'"><input type="checkbox" data-k="'+esc(x.id)+'"'+(on?' checked':'')+'><span><b>'+n+'. '+esc(x.titulo)+'</b><small class="pq">'+esc(x.pq||"")+'</small>'+(x.nota?'<small>'+esc(x.nota)+'</small>':'')+'</span></label>';
      }
    }
    h+='</div></section><div class="h2" style="margin-top:26px">Tudo, por pasta</div>';
  }
  for(const [c,nome] of CATS){
    const its=F.filter(x=>x.cat===c), ab=its.filter(x=>!x.feito), fe=its.filter(x=>x.feito), au=autoFalta(c);
    const nAu=au.reduce((s,a)=>s+a[1].length,0);
    if(!its.length&&!nAu) continue;
    const nAb=ab.filter(x=>!MARC.has(x.id)).length;
    const open=CATABERTA.has(c);
    h+='<section class="fcat'+(open?' open':'')+'" data-c="'+c+'"><button class="fch">'+svg(c==="cultura"||c==="vozes"||c==="canon"||c==="arte"||c==="agr"?"falta":c)+'<span class="t">'+esc(nome)+'</span><span class="pill">'+nAb+' abertos</span>'+(nAu?'<span class="pill au">'+nAu+' pra cadastrar</span>':'')+'<span class="chev">'+CHEV+'</span></button><div class="fcb">';
    for(const [rot,lst] of au){
      h+='<div class="aul"><div class="aut">'+esc(rot)+'</div><div class="aup">'+lst.map(d=>'<button data-id="'+esc(d.id)+'">'+esc(d.nome)+'</button>').join("")+'</div></div>';
    }
    for(const x of ab){
      const on=MARC.has(x.id);
      h+='<label class="fit'+(on?' on':'')+'"><input type="checkbox" data-k="'+esc(x.id)+'"'+(on?' checked':'')+'><span><b>'+esc(x.titulo)+'</b>'+(x.nota?'<small>'+esc(x.nota)+'</small>':'')+'</span></label>';
    }
    if(fe.length){
      h+='<details class="fdone"><summary>Já resolvido, '+fe.length+'</summary>'+fe.map(x=>'<div class="fok"><span class="tk">✓</span><span><b>'+esc(x.titulo)+'</b>'+(x.nota?'<small>'+esc(x.nota)+'</small>':'')+'</span></div>').join("")+'</details>';
    }
    h+='</div></section>';
  }
  v.innerHTML=h;
  v.querySelectorAll(".fch").forEach(b=>b.onclick=()=>{const s=b.parentElement,c=s.dataset.c;s.classList.toggle("open");s.classList.contains("open")?CATABERTA.add(c):CATABERTA.delete(c)});
  v.querySelectorAll(".fit input").forEach(cb=>cb.addEventListener("change",()=>v.querySelectorAll('.fit input[data-k="'+cb.dataset.k+'"]').forEach(o=>{o.checked=cb.checked;o.closest(".fit").classList.toggle("on",cb.checked)})));
  v.querySelectorAll(".aup button").forEach(b=>b.onclick=()=>{const d=DATA.find(x=>String(x.id)===b.dataset.id);if(d)abrir(d)});
  v.querySelectorAll(".fit input").forEach(cb=>cb.onchange=()=>{const k=cb.dataset.k;cb.checked?MARC.add(k):MARC.delete(k);try{localStorage.setItem("solphi_falta_v1",JSON.stringify([...MARC]))}catch(e){}cb.closest(".fit").classList.toggle("on",cb.checked);nav()});
}

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3200)}
$("#busca").oninput=e=>{q=e.target.value;show()};
$("#bNovo").onclick=()=>form(null,pasta==="falta"?"home":pasta);
try{const hh=decodeURIComponent(location.hash.slice(1));if(hh){pasta=hh;const t=hh.split(":")[0];if(SUBS[t])ABERTOS.add(t)}}catch(e){}

$("#lb").onclick=()=>$("#lb").classList.remove("on");
