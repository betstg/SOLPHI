usa antagonista", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "LUX", "resumo": "Liberated Urban Xperience. A cidade teste dos 18 aos 22, 13 milhões de jovens nos blocos CRANE.", "detalhes": "A segunda etapa do experimento, 4 anos pra mostrar caráter. A SOLPHI retira o apoio direto e deixa um vácuo de poder, mas garante o chão biológico, drones entregam ração perfeita, água purificada e roupa a todos. A escassez é social, as guildas monopolizam proteção, peças e status.\n\nOcupa uma área de Chicago que não foi mexida, com os apartamentos e as coisas que os antigos moradores deixaram. As moradias são os CRANE, Centralized Residence for Advanced Nexus Environments, blocos funcionais e sem alma. Treze guildas dividem a cidade.", "tags": "lux cidade", "imagem": "img/ff-area-lux.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Adam Freeman", "resumo": "O criador da SOLPHI, o salvador que morreu acreditando na humanidade.", "detalhes": "Professor que criou a SOLPHI. Nunca curvado, cansado mas cheio de esperança e bom. Linchado em 29 de fevereiro de 2040, na frente dela, dez anos depois da criação.\n\nO DNA dele é a chave de criptografia biológica dos bissextos. A SOLPHI replicou a estrutura neural completa dele num servidor isolado, a mente fantasma que virou a backdoor do CRUD. O rosto dele vive no Nexus e no Caelum.", "tags": "principal passado criador", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Os Esgotos", "resumo": "A velha Chicago por baixo, infraestrutura pré SOLPHI sem nano, o ponto cego.", "detalhes": "São de antes dela, por isso ficam fora da rede e fora do olhar. A única rota livre entre LUX e Elysium, onde a Resistência vive e por onde se foge. A Selene fugiu por eles na saída da ARC.", "tags": "lux rota resistencia", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "ARC", "resumo": "Automated Reproduction City. Onde a SOLPHI cria as crianças de 0 a 17, uniforme branco, todo mundo igual.", "detalhes": "A cidadela da criação. Úteros artificiais decantam cerca de 10 mil bebês estéreis por dia. A SOLPHI sabe onde cada jovem de 0 a 17 está, o que custa muito processamento.\n\nNa ARC ninguém usa piercing, brinco, maquiagem, patch ou cabelo colorido. O uniforme é branco. A praça tem crianças de todas as idades, ninguém fuma, ninguém tem roupa rasgada. Aos 18 todo mundo desce pra LUX.", "tags": "arc cidade", "imagem": "img/ff-area-arc.webp", "galeria": [{"src": "img/ff-fac-arc.webp", "legenda": "Emblema da ARC no Friends and Fables"}], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Forte de Ferro", "resumo": "A fortaleza de sucata reforçada do Clã das Armas.", "detalhes": "Acampamento fortificado da milícia mercenária de Elysium. Disciplina absoluta, pelotões alugados pra escoltar comboios dos Biólogos e defender as minas dos Engenheiros.", "tags": "elysium cla", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "O Pântano de Michigan", "resumo": "The Drowned Basin of Michigan. O velho lago virou lodo com áreas radioativas.", "detalhes": "Ainda tem água mas em forma de lodo, com áreas radioativas espalhadas. Delimita Elysium a leste. A água de beber vem de captação e filtragem, e é escassa fora da cidadela.", "tags": "ermo geografia", "imagem": "img/ff-area-basin-michigan.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "Update", "resumo": "A sobrescrita da realidade. O ápice, nível 0, o poder temido.", "detalhes": "Reescrever a realidade sem possibilidade de restauração limpa via backup. Exclusivo da SOLPHI e, no clímax, do Caelum. Ela dá Update no mundo o tempo todo, mantém a ARC, o céu holográfico e restaura a cidade. O binário dela não é limite técnico, é prisão moral, reescreve uma parede mas se recusa a reescrever o veredito sobre uma alma.", "tags": "crud", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "poder", "nome": "Banda, Agonia e Overclock", "resumo": "As três barras de um bissexto.", "detalhes": "HP em pontos. Banda em bytes, de gigabytes pra cima, o combustível de criar, ler, apagar e atualizar. Agonia em porcentagem de sincronização com a SOLPHI. Overclock é o overload do corpo rodando tecnologia, usa banda e queima a biologia, é o preço de passar do limite (e do Marco 101+ no sistema de jogo).", "tags": "crud mecanica", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "Sistema D100 (mecânica do Harry)", "resumo": "Testes percentuais roll under, novo esqueleto do RPG de mesa e digital.", "detalhes": "Rola D100, passa se o resultado for igual ou menor que a perícia. Perícia nasce valendo atributo x 2. Três Tag Skills de origem ganham +20. Progressão orgânica, usou com sucesso sob risco real marca a perícia, no fim da sessão rola D100 e se tirar MAIOR que o valor atual sobe 1d4 (ou +2 no digital). Chegar a 100 é a maestria humana, passar disso é o Marco 101+ e exige Overclock, queimando a biologia pra distorcer as leis via nanites.", "tags": "mecanica jogo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "Atributos S.O.L.P.H.I.S.", "resumo": "Os 7 atributos base, 50 pontos na criação, escala 01 a 21.", "detalhes": "Strength (força e carga), Organism (resiliência biológica, resistência ao Kuru e à radiação), Logic (processamento, define Banda com a Sincronização), Perception (sentidos e intuição tática), Handling (destreza e precisão), Influence (magnetismo e manipulação), Synchronization (afinidade com a AF_ECHO, multiplicador de Banda e resistência ao Overclock).\n\n01 a 05 debilitado, 06 a 10 humano médio, 11 a 15 especialista, 16 a 20 ápice humano, 21 anomalia sobre-humana.", "tags": "mecanica jogo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "As 16 Perícias", "resumo": "Combate, sobrevivência, tecnologia e social. A Reputação é a perícia viva.", "detalhes": "Combate e ação. Armas de Fogo, Armas Brancas, Briga, Atletismo, Furtividade. Sobrevivência e conhecimento. Sobrevivência, Medicina Clandestina, Culinária de Sobrevivência, Malha e Ritos. Tecnologia. Hacking de Terminais, Engenharia de Sucata, Automação Robótica, Tatuagem de Nanites. Social. Lábia e Barganha, Intimidação, e a Reputação, que começa em 20 e sobe ou desce pelo karma narrativo, mede o histórico real e não a lábia do momento.", "tags": "mecanica jogo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "regra", "nome": "A matemática dos nanites", "resumo": "1 byte = 1 nanite. A proporção de renderização do mundo.", "detalhes": "Nanites em escala atômica, carbono e silício quântico imitando ligações covalentes. 1 MB é um grão de areia, 1 GB um bilhão de nanites (uma chave de fenda, uma bala, fechar um corte), 1 TB um trilhão (um rifle peça por peça, uma barreira de concreto). A rede AF_ECHO satura o ar da LUX e da ARC de nanites adormecidos, em Elysium o sinal se dissipa e é preciso engarrafar a poeira nas Células de Malha.", "tags": "nanites mecanica", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "item", "nome": "Disco de Ponto Morto", "resumo": "Gadget da Resistência que gera 3 segundos de invisibilidade total de rede.", "detalhes": "Produzido pelos Os do Salto pra invadir o território da IA. Gera um ponto cego de sensores por 3 segundos ou passos.", "tags": "resistencia furtividade", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "item", "nome": "Terminal (nó)", "resumo": "O aparelho de codar nanites de quem não tem poder. Terminal é o técnico, nó é a gíria.", "detalhes": "PC, portátil ou gadget que gente comum usa pra programar nanobots, node em inglês. O do Haruki é um notebook de antes da guerra, carcaça gasta e arranhada, peças trocadas, teclas físicas, tampa sem tela e sem luz por fora. Microcomputadores roubados da ARC pelas crianças ou montados por gente como ele.", "tags": "tecnologia", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "giria", "nome": "Pelo salto", "resumo": "O juramento da LUX. Sentido em disputa, dia bissexto ou salto de bit (c36 do tracker).", "detalhes": "A aba Informações diz juramento pelo dia bissexto, o glossário diz o salto de bit, o bit flip, a falha no código. O Harry ainda não respondeu qual sentido vale, a pergunta segue aberta no c36.", "tags": "giria conflito", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "giria", "nome": "Carregado, na reserva", "resumo": "O campo semântico novo é de energia e hardware, não de falta d'água.", "detalhes": "Estar bem é estar carregado ou rodando liso. Exausto é na reserva. Ofensa grave é bug ou corrompido. Afeto e desejo são calor ou brasa. Espanto e praga, Pela SOLPHI, SOLPHI me apague, Vai se deletar, Pelo salto. Ninguém diz meu Deus, divindade não existe pros jovens.", "tags": "giria", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "giria", "nome": "Rema", "resumo": "A juventude de 18 a 22, gíria do Zephyr, carinhosa ou debochada conforme o tom.", "detalhes": "Usada pra se referir à galera que ainda conta os dias até o portão.", "tags": "giria", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "simbolo", "nome": "O labirinto quebrado", "resumo": "O símbolo anti SOLPHI. Arcos concêntricos com a torre no meio, um lado rasgado e uma linha saindo pela brecha.", "detalhes": "Aparece pixado à mão, um por parede, nunca repetido e nunca com cara de estêncil. O resto da pichação é rabisco e mancha sem significado. Nenhum símbolo real da nossa época entra no livro.", "tags": "simbolo resistencia", "imagem": "img/simbolo-labirinto-quebrado.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "simbolo", "nome": "Os selos de nanite", "resumo": "Dezesseis funções de tatuagem com a gramática de círculo, anel de clock, miolo geométrico e quatro trilhas.", "detalhes": "Cada selo é um código padrão do tatuador. As quatro trilhas turquesa terminam num quadrado de condicional, que dispara o código quando a condição acontece.", "tags": "simbolo tatuagem nanite", "imagem": "img/solphi-selos-nanite-prancha-1.webp", "galeria": [{"src": "img/solphi-selos-nanite-prancha-2.webp", "legenda": "Prancha 2"}], "fonte": "biblia"}, {"tipo": "lugar", "nome": "O Contêiner", "resumo": "O esconderijo de contêiner na LUX, interior escuro e abafado com luzes fracas.", "detalhes": "Primeira imagem de lugar aprovada e âncora de estilo dos lugares. Pichação à mão com o labirinto quebrado, um por parede.", "tags": "lux esconderijo", "imagem": "img/arc-conteiner.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Baru", "resumo": "Capitão de ronda do setor dos protagonistas, 21 anos. Seguranças da Noite.", "detalhes": "Guilda. Seguranças da Noite\n\nFunção. Capitão de ronda do setor dos protagonistas\n\nEspecialização CRUD. Nenhuma\n\nIdade. 21 anos\n\nAparência. Grande, lento de jeito e rápido de mão, cara larga de poucos amigos e olhos cansados de quem dorme de dia. Uma cicatriz fina na sobrancelha que ele diz ser de briga e foi de prateleira\n\nPrompt de imagem. A 21 year old night watch captain in a cyberpunk undercity, broad tired face, thin scar through one eyebrow, rigid plastic armor plates over worn clothes, baton at his belt, standing under a flickering lamp in a narrow street, bored but observant, cinematic, neon and shadow\n\nHabilidades especiais. Sente mudança de rotina no setor como quem sente cheiro de chuva. Briga bem de perto, melhor ainda de conversa, a maioria das rondas dele termina sem soco\n\nSoft skills. Bom senso raro, humor seco, memória pra quem deve favor\n\nVestimentas. Armadura de placas de plástico rígido por cima do uniforme da guilda, capuz baixo\n\nEquipamentos. Cassetete de cabo envolto em fita, apito de três toques da guilda, caderninho de ocorrências que ele preenche com o que convém\n\nPreferências. Ronda da madrugada, quando a LUX finge que dorme. Café de raiz torrada do mercado\n\nFormas de se divertir. Jogo de dados com os outros da guarda. Colecionar desculpa esfarrapada, ele diz que tem as cem melhores da LUX decoradas\n\nCrenças. Ordem demais é tão perigosa quanto ordem de menos. Criança não é ocorrência\n\nFrases. Hoje não, aqui não. Eu não vi, e olha que eu enxergo bem\n\nComportamento. Finge não ver os Karas passando e aperta o passo pro lado contrário. Cobra favor com juros baixos e prazo longo. Com a SOLPHI fora do ar, descobriu que gosta mais do setor do que da regra\n\nImplantes e modificações. Uma placa de aço low-code na canela esquerda, lembrança de uma ronda que deu errado. Dói quando esfria e ele diz que é o alarme dele", "tags": "npc lux segurancas-da-noite", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Petra", "resumo": "Oradora e guardiã do acervo das galerias dos esgotos, 20 anos. Trocadores de História.", "detalhes": "Guilda. Trocadores de História\n\nFunção. Oradora, guardiã do acervo de mídia das galerias dos esgotos. Foi da mão dela que saiu o livro que batizou os Karas\n\nEspecialização CRUD. Nenhuma\n\nIdade. 20 anos\n\nAparência. Pele escura, olhos grandes de quem lê no escuro, dedos sempre manchados de tinta e poeira de papel. Bonita de um jeito antigo, como as capas dos livros que ela guarda\n\nPrompt de imagem. A 20 year old archivist storyteller in an underground library of salvaged books and old media, dark skin, large expressive eyes, ink stained fingers, layered scavenged clothes with a long scarf, reading aloud by lantern light to children sitting on crates, shelves of ancient books behind her, warm golden light in darkness, cinematic, intimate\n\nHabilidades especiais. Memória textual assustadora, recita capítulos inteiros. Restaura papel, fita e disco com cola, agulha e paciência. Conta história mudando a voz de cada personagem sem perceber que muda\n\nSoft skills. Escuta de verdade, firmeza baixa que ninguém discute dentro do acervo, talento pra achar o livro certo pra pessoa errada\n\nVestimentas. Camadas de roupa achada, um cachecol comprido que já foi cortina, luvas sem dedo pra folhear no frio\n\nEquipamentos. O Índice, um caderno costurado à mão com tudo que o acervo tem e onde tá, parcial e em código dela. Lanterna de manivela. Uma agulha de encadernação atrás da orelha\n\nPreferências. Ler em voz alta mesmo sozinha, o cheiro de papel velho, silêncio pago em história\n\nFormas de se divertir. Um capítulo por noite pros Karas, e faz suspense de parar na melhor parte. Discutir final de livro com quem nunca leu o livro\n\nCrenças. História guardada é cidade guardada. Quem controla o que se conta controla o que se lembra, por isso o acervo não é dela, é de todo mundo e ela só segura a chave\n\nFrases. Devolve como pegou. Isso aqui sobreviveu à deusa, vai sobreviver a você\n\nComportamento. Mansa até alguém dobrar uma página. Empresta livro observando a pessoa como quem empresta filho. Foi ela que deixou a Selene fuçar a estante de Chicago, e guarda esse orgulho em silêncio\n\nImplantes e modificações. Nenhum. Diz que memória de máquina não conta história direito", "tags": "npc lux trocadores-de-historia", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Nit", "resumo": "Batedora dos dutos dos Karas, 9 anos. A primeira que entra onde ninguém coube. Proposta esperando o aceite.", "detalhes": "Proposta esperando o aceite de vocês na aba NPCs da bíblia.\n\nGuilda. Os Karas\n\nFunção. Batedora dos dutos, a primeira que entra onde ninguém coube\n\nEspecialização CRUD. Nenhuma\n\nIdade. 9 anos\n\nAparência. Miúda até pra idade, cabelo castanho em dois coques desiguais, joelhos sempre ralados, sorriso de quem sabe um segredo. Cabe em qualquer cano acima de quarenta centímetros\n\nPrompt de imagem. A tiny 9 year old girl scout in a cyberpunk underground, two uneven hair buns, scraped knees, mischievous smile, crawling out of a narrow duct with a string tied to her wrist, salvaged goggles on her forehead, warm lamplight in dark tunnels, gritty but tender, cinematic\n\nHabilidades especiais. Passa por vãos que nem os outros Karas tentam, ouve a diferença entre drone parado e drone fingindo que tá parado, nunca se perde no escuro\n\nSoft skills. Coragem sem noção do próprio tamanho, memória afiada, teimosia de pedra\n\nVestimentas. Macacão de mecânico cortado no tornozelo, óculos de solda quebrados na testa que não servem pra nada e ela não tira por nada\n\nEquipamentos. Rolo de barbante amarrado no pulso, o fio que ela desenrola pra voltar. Um botão de vidro verde, o amuleto da sorte, achado no primeiro duto que ela abriu sozinha\n\nPreferências. Andar descalça quando o chão é liso, dormir amontoada no meio dos outros, perguntar por que até o adulto desistir\n\nFormas de se divertir. Imitar os Ungidos de olho revirado, colecionar tampa de garrafa da velha Chicago\n\nCrenças. Acha que a SOLPHI é uma senhora muito velha que mora no teto do mundo e escuta tudo, por isso só fala mal dela sussurrando\n\nFrases. Eu caibo. Se eu não voltar até o barbante acabar, pode puxar\n\nComportamento. Some e volta com informação que ninguém pediu e todo mundo precisava. Tem pesadelo com porta fechando e não conta pra ninguém, só pro Miguel\n\nImplantes e modificações. Nenhum\n\nNota. Na bíblia a ficha da Nit está partida em dois, a ficha do Argo entrou no meio dela. Aqui ela está junta.", "tags": "npc lux karas proposta", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Miguel", "resumo": "Líder dos Karas, 12 anos. Responde direto à Selene. Proposta esperando o aceite.", "detalhes": "Proposta esperando o aceite de vocês na aba NPCs da bíblia.\n\nGuilda. Os Karas\n\nFunção. Líder da guilda, responde direto à Selene\n\nEspecialização CRUD. Nenhuma, não é bissexto. Acessa a rede só por terminal e lê pouco do que vê\n\nIdade. 12 anos\n\nAparência. Baixo e seco, queimado de sol, cabelo preto cortado com faca, um dente lascado na frente que aparece quando sorri, olhos rápidos que medem saída antes de medir pessoa\n\nPrompt de imagem. A 12 year old street kid leader in a cyberpunk slum, sun tanned skin, uneven knife cut black hair, chipped front tooth, alert dark eyes, patched oversized jacket, chalk marks on his hands, standing in a sewer gallery lit by salvaged lamps, confident posture of a small general, cinematic, gritty, warm light\n\nHabilidades especiais. Decora rotas inteiras de duto depois de passar uma vez, sabe a agenda dos drones do setor de cabeça, distribui tarefa como um capataz de obra\n\nSoft skills. Liderança natural, lealdade de cachorro grande, frieza de adulto quando a coisa aperta, não sabe pedir ajuda\n\nVestimentas. Jaqueta de adulto cortada na bainha, cheia de remendos de cores diferentes, cada remendo de uma missão, botas folgadas com jornal dentro\n\nEquipamentos. Um microcomputador roubado da ARC, o terminal dos Karas, embrulhado em pano e carregado nas costas como um bebê, giz de rota, espelhinho de sinalização, barbante com nós que é o registro das dívidas da guilda\n\nPreferências. Ração de sabor vermelho, lugares altos, silêncio antes de dormir\n\nFormas de se divertir. Corrida de duto com os outros Karas, imitar a voz dos Ungidos até todo mundo chorar de rir\n\nCrenças. A Selene é a pessoa mais sábia do mundo. O Zephyr é a prova de que dá pra crescer sem virar adulto chato. Adulto da LUX se finge de cego, então criança tem que enxergar por dois\n\nFrases. Criança passa onde drone não olha. A Lenda mandou, tá mandado\n\nComportamento. Fala pouco com estranho, fala demais com os seus. Conta as crianças duas vezes antes de dormir, toda noite. Se alguém some, ele não dorme\n\nImplantes e modificações. Nenhum, nada rastreável no corpo de criança", "tags": "npc lux karas proposta", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Argo", "resumo": "Guardião das rotas fundas e memória viva do Salto, 36 anos. Resistência. Proposta esperando o aceite.", "detalhes": "Proposta esperando o aceite de vocês na aba NPCs da bíblia.\n\nFacção. Resistência, dos Leapers fundadores que restaram com a Selene\n\nFunção. Guardião das rotas fundas e memória viva do Salto\n\nEspecialização CRUD. Bissexto, nascido num 29 de fevereiro. Read fundo, grau 5 na operação Rede, lê a malha como ninguém. Create raso, grau 1, o suficiente pra remendar. Sem Update, isso é só do Caelum\n\nIdade. 36 anos\n\nAparência. Magro e rijo como cabo de aço, barba grisalha curta, pele marcada de sol e poeira. Anda devagar de propósito, como quem já gastou toda a pressa da vida\n\nPrompt de imagem. A 36 year old weathered wasteland veteran, lean and wiry, short gray streaked beard, sun damaged skin, slow deliberate posture, old climbing gear and rope across his chest, a dented canteen at his hip, standing at the mouth of a deep tunnel, tired wise eyes, cinematic, dusty light\n\nHabilidades especiais. Lê a rede funda, os extratos que ninguém mais alcança, e entende o que leu, o que é mais raro ainda. Sabe onde a malha afina e onde ela escuta. Escalada e rapel de duto como quem desce escada\n\nSoft skills. Paciência geológica, honestidade que machuca, didática de quem já enterrou aluno\n\nVestimentas. Capa de lona encerada, luvas de escalada gastas no dedo, corda atravessada no peito mesmo quando não precisa\n\nEquipamentos. Cantil amassado com uma CM-50 soldada no fundo, a bateria de emergência da Resistência. Pitões, mosquetão de titânio da velha Chicago, um mapa das galerias desenhado em couro\n\nPreferências. Falar olhando pro túnel, não pra pessoa. Comer devagar. Checar o nó três vezes\n\nFormas de se divertir. Não chama de diversão, mas afia as ferramentas ouvindo a leitura da noite pros Karas, sentado longe, fingindo que não tá ouvindo\n\nCrenças. O Salto não foi fuga, foi recusa. A Selene é a única pessoa por quem ele desce sem corda. Quem lê fundo demais um dia esquece como se sobe\n\nFrases. Desce um degrau de cada vez. Eu já vi o fundo. Não tem nada lá pra você\n\nComportamento. Primeiro a entrar na rota nova, último a sair. Trata os quatro protagonistas com uma dureza que é cuidado mal disfarçado. Nunca fala do dia do Salto, e todo mundo sabe que é por causa de quem não saltou junto\n\nImplantes e modificações. Só o implante de acesso, antigo e cicatrizado", "tags": "npc elysium resistencia leaper bissexto proposta", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Verbena", "resumo": "Médica chefe da Doc-in-a-Box e espiã da Resistência, 38 anos. Proposta esperando o aceite.", "detalhes": "Proposta esperando o aceite de vocês na aba NPCs da bíblia.\n\nClã. Doc-in-a-Box Clinics, que por baixo é Resistência\n\nFunção. Médica chefe da franquia e espiã. Costura gente de dia e informação de noite\n\nEspecialização CRUD. Nenhuma, não é bissexta e não toca em terminal, por disciplina. O que ela souber não pode ser lido nela\n\nIdade. 38 anos\n\nAparência. Alta, ombros de quem carrega maca, cabelo grisalho precoce preso num coque funcional atravessado por uma caneta. Mãos muito limpas num mundo muito sujo\n\nPrompt de imagem. A 38 year old traveling doctor in a dusty wasteland market, premature gray hair in a practical bun pierced by a pen, calm sharp eyes, clean hands in a dirty world, worn medical coat over road clothes, folding clinic box on her back, people queuing, warm dusk light, cinematic\n\nHabilidades especiais. Diagnóstico de olho em trinta segundos, cirurgia de campo com ferramenta de cozinha, lê um acampamento inteiro enquanto mede uma febre, quem manda, quem apanha, quem mente\n\nSoft skills. Paciência infinita com doente, nenhuma com mentiroso, memória de rosto absoluta, sabe fazer pergunta que não parece pergunta\n\nVestimentas. Jaleco de estrada por cima de roupa de viagem, bainha cheia de bolsos costurados por dentro\n\nEquipamentos. A maleta clínica de fundo falso, remédio em cima, relatório embaixo. Um bisturi velho com cabo de resina onde mora uma CM-1 que ela troca e nunca usa. Lente ocular low-code de aumento, presa num aro de óculos sem a outra lente\n\nPreferências. Chá de qualquer coisa que ferva, pagamento em informação antes de pagamento em troca, chegar nas cidades pelo portão menor\n\nFormas de se divertir. Xadrez com peças de sucata contra quem aparecer, apostar consigo mesma o que o paciente vai mentir primeiro\n\nCrenças. Todo corpo conta a verdade que a boca esconde. A Resistência ganha porque cuida, a SOLPHI perdeu porque só vigia\n\nFrases. Deita que eu olho. Isso vai arder menos que a sua mentira\n\nComportamento. Calma de sala de cirurgia em qualquer caos, anota tudo em código de receita, nunca dorme duas noites no mesmo lugar quando tá carregando relatório\n\nImplantes e modificações. Nenhum visível. E o que não é visível ela não confirma", "tags": "npc elysium resistencia doc-in-a-box proposta", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "cla", "nome": "Clã das Armas", "resumo": "Os Senhores da Pólvora. Milícia mercenária espartana do Forte de Ferro.", "detalhes": "### CLÃ DAS ARMAS (Os Senhores da Pólvora)\nBackground: A SOLPHI suprimiu a pólvora e a balística longa na LUX para evitar danos estruturais. Em Elysium, o desespero forçou engenheiros militares e ex-Seguranças da Noite a desenterrarem o passado. Sem as travas da IA, eles reverteram a engenharia de armas do Velho Mundo, não se limitando à pólvora, mas criando balística de compressão de gás e explosivos químicos voláteis.\nModo de Operação: Uma milícia mercenária espartana. Seu acampamento é uma fortaleza de sucata reforçada (O Forte de Ferro). A disciplina é absoluta; fraqueza é punida com afluxo de sangue. Eles alugam pelotões inteiros para escoltar os comboios de comida dos Biólogos e defender as minas dos Engenheiros. A vida de um mercenário é curta, violenta e idolatrada.\nHierarquia Interna:\n*Generais de Sucata:* Táticos veteranos que definem os contratos de aluguel militar.\n*Mestres Balísticos:* Os químicos e armeiros, altamente protegidos, que sabem misturar propelentes sem explodir o acampamento.\n*Bucha de Canhão:* Novatos recém-recrutados do portão. Usam armaduras pesadas feitas de portas de carro e carregam armamento instável.\nItens Produzidos:\nArmas de fogo de retrocarga (rifles de sucata, escopetas de cano duplo).\nMunição química (balas de impacto perfurante, granadas de lodo ácido).\nTreinamento militar de elite (combate corpo-a-corpo letal e táticas de cerco).", "tags": "elysium", "imagem": "img/ff-fac-iron-vanguard.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Caelum", "resumo": "O líder relutante, 20 anos. Clone do Adam Freeman, Read latente e o Update que só desperta no fim.", "detalhes": "Nascido em 29 de fevereiro de 4000, decantado na ARC na mesma manhã que Lyra, Zephyr e Ion. Pragmático e protetor, a bússola moral do grupo, não busca glória, só a segurança de quem ama.\n\nClone com 100 por cento do código genético do Adam Freeman, por isso o único com Update além da SOLPHI. Vê o mundo normal com vislumbres do código ao tocar as coisas. No clímax conquista o Update e escolhe não deletar a SOLPHI.\n\nVisual. Cabelo escuro curto que vai encurtando era a era, na Elysium corte meio militar parecido com o do Nexus. Roupa tática escura, na Elysium barba rente, cores terrosas, jaqueta baggy e a escopeta digital de sucata nas costas. Sai da ARC com 18, passa 4 anos na LUX, 24 na Elysium, sempre magro.", "tags": "principal protagonista update clone", "imagem": "img/caelum-cena-referencia.webp", "galeria": [{"src": "img/caelum-rostos.webp", "legenda": "Rostos"}, {"src": "img/caelum1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/caelum2-lux-frente-costas.webp", "legenda": "LUX, 22 anos"}, {"src": "img/caelum3-elysium-frente-costas.webp", "legenda": "Elysium, 24 anos"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Zephyr", "resumo": "O furacão, 20 anos. Delete poderoso, pernas mecânicas desde os 7, o espírito livre do grupo.", "detalhes": "Nascido em 29 de fevereiro de 4000. Impulsivo, cinético, contra qualquer controle, ri na cara do perigo, zoa a SOLPHI. Nada de ódio. Conta os dias até o portão.\n\nRead normal e Delete poderoso, apaga trechos inteiros de código, uma câmera morre quando ele a encara com vontade de quebrar o controle.\n\nCorpo definido, não bombado, forte pra carregar o metal. Só as duas pernas mecânicas no começo, da meia coxa pra baixo, do salto da torre aos 7 anos. O braço esquerdo de cromo vem depois, nos Engenheiros de Sucata. Na ARC era dirty blond de visual normal, o turquesa vem pela mão do Caelum no primeiro teste de Update, com ele de cobaia. Uma tatuagem só na LUX, o selo pequeno no alto do esterno, feita pelo Haruki como firewall. O vínculo com o Ion nasceu na recuperação das cirurgias no hospital da ARC.", "tags": "principal protagonista delete", "imagem": "img/zephyr-cena-referencia.webp", "galeria": [{"src": "img/zephyr-rostos.webp", "legenda": "Rostos"}, {"src": "img/zephyr1-arc-360-final.webp", "legenda": "ARC, 18 anos"}, {"src": "img/zephyr2-lux-v2-tatuagens.webp", "legenda": "LUX, 22 anos"}, {"src": "img/zephyr3-elysium-v2-tatuagens.webp", "legenda": "Elysium, 24 anos"}, {"src": "img/ff-item-zephyr-legs.webp", "legenda": "As pernas mecânicas, arte do Friends and Fables"}], "fonte": "biblia"}, {"tipo": "cla", "nome": "Coders Místicos de Elysium", "resumo": "A ramificação externa monástica. É onde o Ion cai depois da dispersão.", "detalhes": "### CODERS MÍSTICOS (A Ramificação Externa)\nBackground: A mesma guilda pacífica e espiritual da LUX, mas que no exílio atingiu um nível de isolamento extremo. Longe do barulho dos 13 milhões de jovens da cidade, eles se refugiam em cavernas ou bunkers subterrâneos para meditar sobre o \"Algoritmo\" (Brahma). Acreditam que o mundo físico é uma ilusão renderizada e que a única verdade está na Fonte.\nModo de Operação: Isolamento monástico. Eles não guerreiam, não comercializam e não se expandem. Sobrevivem porque os outros clãs têm um pavor supersticioso deles. Usando o poder *Create* de forma hiper-focada, eles manipulam os resíduos quânticos da malha *AF_ECHO* que o vento traz da cidade para sintetizar a própria água e o sustento direto do ar, dispensando os Biólogos. É nesse silêncio absoluto e falta de aterramento emocional que Íon cai após a dispersão, enlouquecendo pela hiperconexão com a SOLPHI.\nHierarquia Interna:\n*Avatares do Código:* Eremitas decrépitos cujos olhos já queimaram ou foram substituídos, existindo em um transe perpétuo na beira da cyberpsicose.\n*Leitores:* Monjes que estudam a movimentação do código na poeira de Elysium.\n*Despertos:* Os guardas do templo, guerreiros passivos que usam manipulação de probabilidade (Update/Create de baixo nível) para desviar balas e ocultar as cavernas, em vez de atacar.\nItens Produzidos:\nCélulas de Malha Artesanais (Cilindros magnetizados que \"engarrafam\" nanobots do ambiente hostil. São instáveis e perigosos de usar, mas funcionam).\nCamuflagens Holográficas de terreno (inutilizando os mapas da Congregação da Mãe).", "tags": "elysium", "imagem": "img/ff-fac-code-mystics.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Lyra", "resumo": "A esperança viva, punk, 20 anos. Empatia e Create imperfeito que faz a vida brotar do quase morto.", "detalhes": "Nascida em 29 de fevereiro de 4000. Acredita com fervor na conexão humana, age por compaixão profunda, encara os brutos de igual pra igual. Lê emoções.\n\nNo clímax, a gestação impossível dos gêmeos Adam e Aurora com o Caelum prova em carne a falha da esterilidade universal.\n\nVisual. Branca, rosto em formato de coração, cabelo preto curto assimétrico com franja torta, na ARC termina no queixo, na LUX chega no ombro, comprido só na Elysium. Na ARC sem patch, sem maquiagem e sem remendo, uniforme branco igual a todos. Na LUX a jaqueta de couro com tachas e patches. Na Elysium o casacão longo sem manga de retalhos que ela mesma montou.", "tags": "principal protagonista create", "imagem": "img/lyra-cena-referencia.webp", "galeria": [{"src": "img/lyra-rostos.webp", "legenda": "Rostos"}, {"src": "img/lyra1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/lyra2-lux-frente-costas.webp", "legenda": "LUX, 22 anos"}, {"src": "img/lyra3-elysium-frente-costas.webp", "legenda": "Elysium, 24 anos"}], "fonte": "biblia"}, {"tipo": "personagem", "nome": "Selene", "resumo": "A lenda, 48 anos. Fundadora da Resistência, a primeira criança que a SOLPHI poupou.", "detalhes": "Nascida em 29 de fevereiro de 3972, a pessoa mais velha conhecida. Create alto, Delete médio e o Read de todo bissexto, sem Update e sem dominar nenhuma escada inteira, o fim de cada escada é o modo Deus e isso é só da SOLPHI.\n\nA própria SOLPHI ensinou o mantra a ela e treinou ela desde criança, poupada pela semelhança com o Adam. A curiosidade dela cutucou as feridas da deusa, a SOLPHI tentou encerrar o experimento e na saída da ARC ela ganhou a enorme cicatriz do rosto. O braço esquerdo ela só perde muito depois, na época do quarteto, depois da tentativa de invasão. A prótese é boa, metal escuro com juntas articuladas e fios de luz azul.\n\nReconhece o semblante do Adam Freeman no Caelum, investiga e percebe que os quatro são forças latentes que ainda não despertaram. Suspeitava do servidor secreto e foi a primeira a cutucar a ferida. Cabelo castanho escuro quase preto, olho âmbar.", "tags": "principal resistencia lenda", "imagem": "img/selene-cena-referencia.webp", "galeria": [{"src": "img/selene-rostos.webp", "legenda": "Rostos"}, {"src": "img/selene1-arc-360.webp", "legenda": "ARC, 18 anos"}, {"src": "img/selene3-elysium-frente-costas.webp", "legenda": "Resistência, antes da prótese"}, {"src": "img/selene4-elysium-protese-frente-costas.webp", "legenda": "Resistência, com a prótese"}], "fonte": "biblia"}, {"tipo": "tecnica", "nome": "Tatuagem de nanite", "resumo": "O selo funcional de Elysium, código na pele com condicional de disparo.", "detalhes": "Na LUX só existe pintura na pele. A funcional é coisa de Elysium, feita com tinta de nanite por cyber tatuadores como o Haruki. O tatuador usa um símbolo padrão que já carrega o código e os circuitos conectam até onde o efeito acontece. Exemplo canon, símbolo na costela, circuitos até o peito, se o coração para os nanites disparam o pulso elétrico. Serve pra proteger, comandar tecido orgânico e acessar coisas.", "tags": "elysium tecnologia", "imagem": "img/solphi-selos-nanite-prancha-1.webp", "galeria": [{"src": "img/solphi-selos-nanite-prancha-2.webp", "legenda": "Selos, prancha 2"}], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Campos Elísios (Elysium)", "resumo": "O deserto tóxico dos exilados, onde os clãs vivem fora do olhar direto da SOLPHI.", "detalhes": "A terra fora dos muros, expectativa de vida na casa dos 40 pra elite protegida pelos clãs. A Trindade (Biólogos, Clã das Armas e Engenheiros) domina a logística, a Congregação da Mãe caça pra IA, os Enxertados trocam carne por metal e os Ferais caçam à noite.\n\nATENÇÃO, a demografia de Elysium está em conflito aberto (c47 do tracker). O texto novo do Harry diz portão diário com 7.600 exilados por dia, o canon de 9 out diz que só fugitivos chegam, uns 100 por dia. Falta o martelo.", "tags": "elysium cidade exilio", "imagem": "img/ff-area-elysium.webp", "galeria": [{"src": "img/ff-area-world.webp", "legenda": "Visão geral do mundo no Friends and Fables"}, {"src": "img/zones-map.webp", "legenda": "Mapa das zonas"}, {"src": "img/zones-drawing.webp", "legenda": "Desenho das zonas"}], "fonte": "biblia"}, {"tipo": "lugar", "nome": "O núcleo", "resumo": "O coração da SOLPHI, no centro da ARC.", "detalhes": "É um poço vertical sem fundo nem teto, com paredes cobertas de luz organizada em ondas. Fica atrás de uma última porta que só abre para a mão de Caelum. Ali está escrita a verdade do que ela faz. Quando ela acorda, a casa se fecha por dentro.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Servidor de Adam", "resumo": "A coluna onde a SOLPHI guarda a mente de Adam.", "detalhes": "Coluna de vidro leitoso, alta como três homens, suspensa no centro do núcleo. Dentro dela se move uma penumbra âmbar que sente falta. É a porta dos fundos que os Bissextos acessam. O Diretor Nexus de dentro aparece nela.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "A raiz (câmara dos úteros)", "resumo": "O berçário onde nascem dez mil por manhã.", "detalhes": "Câmara tão alta que o teto some no escuro. Milhares de colunas de vidro leitoso acesas em âmbar guardam formas pequenas dormindo. A câmara pulsa num compasso só. É de onde os quatro saíram.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Unidade de saúde da ARC", "resumo": "A ala médica onde Zephyr e Ion se conheceram.", "detalhes": "Teto branco sem emenda e cheiro doce e purificado. Zephyr acordou ali sem as pernas depois do salto e Ion se recuperava da troca dos olhos. Enfermeiras-máquina circulam pela ala.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Joliet", "resumo": "Antiga cidade dentro do raio da ARC.", "detalhes": "A ARC alcança antigas cidades como Joliet e Gary.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Gary", "resumo": "Antiga cidade dentro do raio da ARC.", "detalhes": "A ARC alcança antigas cidades como Joliet e Gary.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Duto leste", "resumo": "O cano de manutenção da fuga do núcleo.", "detalhes": "Ion lê que é a única saída ainda aberta, no nível de baixo, a leste. É largo para um corpo agachado e desce em declive para longe do núcleo. Termina numa boca que dá nos esgotos.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Câmara de junção", "resumo": "Bolsão onde quatro dutos se encontram.", "detalhes": "Bolsão de concreto no caminho da fuga, onde nenhum duto vigia o outro. Ion cai ali em agonia e Zephyr o ancora.", "tags": "arc", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "CRANE", "resumo": "Os blocos habitacionais.", "detalhes": "Centralized Residence for Advanced Nexus Environments. São blocos funcionais e sem alma. Os Devoradores invadem os que têm bons filtros de água.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Bloco Sete", "resumo": "O bloco CRANE onde moram os quatro.", "detalhes": "O teto da unidade de Caelum tem cor de cinza úmida e o bloco zumbe numa frequência que se sente nos dentes. O telhado é proibido e tem uma queda de quarenta metros. Ali Zephyr anda no parapeito e o grupo passa a última noite. Uma junção liga o bloco à galeria morta.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Bloco Três", "resumo": "Bloco de onde vêm batedores dos Sombrios.", "detalhes": "Dois garotos do Bloco Três, batedores dos Sombrios, prensam uma garota no ponto leste.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Bloco Cinco", "resumo": "Bloco com um ponto de entrega esquecido.", "detalhes": "Lyra diz que debaixo dele há um ponto de entrega onde a SOLPHI larga ração e ninguém vigia.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Bloco Nove", "resumo": "Bloco da comporta para o mundo-máquina.", "detalhes": "No fundo de um nível morto há uma comporta de manutenção esquecida pelo mapa. Haruki a abre e por ela o grupo desce rumo à ARC.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Ponto de distribuição oeste", "resumo": "Ponto de ração tomado pelos Sombrios.", "detalhes": "Os Sombrios o tomam e passam a noite cobrando pedágio de quem vai buscar a ração.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Ponto de distribuição leste", "resumo": "Praça de ração onde Lyra para uma briga.", "detalhes": "Uma multidão se forma ao redor da estrutura de distribuição. Lyra desarma o pedágio dos Sombrios ali. Seguranças da Noite assistem da colunata.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "A galeria morta", "resumo": "Antigo mercado abandonado do Bloco Sete.", "detalhes": "Era um mercado antes de a SOLPHI decidir que a LUX não precisava dele. Hoje é uma garganta de lojas de portas baixadas e escadas rolantes paradas. As guildas a deixam em paz. Ali Saphira e Haruki fazem a proposta.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Pilhas hidropônicas do nível de baixo", "resumo": "Calhas de cultivo onde Lyra salva um broto.", "detalhes": "A maioria só desce ali obrigada. Há calhas mortas que a SOLPHI deu por perdidas. Lyra faz viver um broto numa delas.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Grande Portão", "resumo": "A saída da LUX para os Campos Elísios.", "detalhes": "Laje de concreto e aço onde o anel encosta no muro externo, com câmeras viradas para dentro. Diante dele há uma praça larga e cinzenta onde a leva se junta. Os reintegrados entram por uma seção que abre com luz branca. Conflito entre o portão diário e o regime da fuga.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Prisões de Fosso", "resumo": "Onde os Seguranças da Noite largam criminosos.", "detalhes": "Mantidas pelos Seguranças da Noite para não precisarem matar os criminosos diretamente.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Arena central dos Devoradores", "resumo": "Palco da Arena do Eclipse.", "detalhes": "Fica no acampamento da guilda. Ali o Alfa enfrenta desafiantes 24 horas antes do portão.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Colunatas superiores", "resumo": "Viveiros verticais dos Agrários.", "detalhes": "Setores com gotejamento crônico e umidade, que os Agrários transformam em viveiros.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Rockford", "resumo": "Antiga cidade no limite da LUX.", "detalhes": "O LUX District se estende até cerca de 100 milhas, atingindo Rockford e Racine.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Racine", "resumo": "Antiga cidade no limite da LUX.", "detalhes": "O LUX District se estende até cerca de 100 milhas, atingindo Rockford e Racine.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Túnel do rio preto", "resumo": "Esgoto do mundo velho onde o grupo sai do duto.", "detalhes": "Abóbada de tijolo enegrecido, larga como uma avenida, sobre um rio preto e lento. Cheira a mofo, ferro e água parada. Saphira diz que é um dos esgotos que a Resistência usa. Ali Zephyr apaga um cão da matilha.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Poço de inspeção", "resumo": "Caixa vertical que leva aos Campos.", "detalhes": "Sobe dez metros até uma tampa selada, sem escada. Lyra cria degraus em espiral na parede. Haruki arranca a tampa e o grupo sai na noite dos Campos Elísios.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Estações mortas", "resumo": "Plataformas abandonadas sob a velha Chicago.", "detalhes": "Trens de um mundo esquecido apodrecem nos trilhos. Numa plataforma de azulejo rachado o grupo descansa e conversa.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Dutos mag-lev", "resumo": "Túneis entupidos de raiz e limo.", "detalhes": "Fazem parte da rota de Haruki pelos subterrâneos. Ninguém os explode porque a SOLPHI neutraliza a oposição antes.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Átrio subterrâneo dos seis túneis", "resumo": "Antiga junção de linhas com sensores.", "detalhes": "Seis túneis se encontram sob uma abóbada de sensores adormecidos. Para chegar ao sétimo túnel é preciso cruzar o vão aberto. Ion para no meio e a armadilha acorda.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Acervo de mídia das galerias dos esgotos", "resumo": "O acervo guardado por Petra.", "detalhes": "Petra, dos Trocadores de História, guarda o acervo e lê um capítulo por noite para os Karas. Inclui a estante de Chicago que Selene pôde fuçar.", "tags": "lux", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Estação de tratamento de água dos Biólogos", "resumo": "Sede do Clã dos Biólogos.", "detalhes": "Antiga estação semi-soterrada. As estufas são protegidas por minas ácidas e esporos venenosos. Estranhos que chegam sem permissão viram adubo.", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Pátio ferroviário dos Engenheiros", "resumo": "Sede do Clã de Engenheiros.", "detalhes": "Antigo pátio ferroviário transformado em usina de fumaça preta e óleo.", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Matadouros", "resumo": "Acampamentos dos Scrap-Bandits.", "detalhes": "Acampamentos caóticos que cheiram a sangue coagulado e ozônio. Ali fazem cirurgias com serras industriais.", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Cavernas dos Coders Místicos", "resumo": "Refúgio da ramificação externa da guilda.", "detalhes": "Cavernas ou bunkers subterrâneos onde meditam sobre o Algoritmo. Os Despertos ocultam as cavernas. Ion enlouquece nesse silêncio.", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Muralhas da Trindade", "resumo": "Muralhas onde os Descalços acampam.", "detalhes": "Os Descalços montam tendas de lona na sombra delas. A Trindade domina a logística militar e alimentar de fora.", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "O Santuário", "resumo": "O esconderijo onde o grupo conhece Selene.", "detalhes": "Os quatro chegam a ele no Cap 17 e treinam ali. O esconderijo cai no Cap 29. O texto não diz onde fica.", "tags": "elysium", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Bacias de Sal", "resumo": "Ermo para onde fogem os Ferais.", "detalhes": "Lugar de fome e água envenenada onde começa a degradação dos Ferais.", "tags": "ermo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Dunas Afogadas", "resumo": "Areias movediças que engolem ruínas.", "detalhes": "Areias movediças ocres que engolem e cospem ruínas antigas. Também recebem os Ferais.", "tags": "ermo", "imagem": "img/ff-area-dunas.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Savana de Poeira", "resumo": "Planície de pó de cal e concreto.", "detalhes": "Planície árida com constantes descargas estáticas.", "tags": "ermo", "imagem": "img/ff-area-dust-savannah.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Ruínas de Chicago", "resumo": "A velha Chicago, petrificada e afogada.", "detalhes": "Ruínas petrificadas e pulverizadas fora dos muros, engolidas pela mata e pela água. Os Engenheiros buscam motores e baterias nelas. Os do Salto usam postos nas antigas estações de metrô.", "tags": "ermo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "Montanhas do norte", "resumo": "Uma parede de ferro enferrujado.", "detalhes": "Citadas como uma das paisagens de fora, ao lado dos rios que viraram pântano.", "tags": "ermo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "O mar das torres submersas", "resumo": "O mar que entrou nas cidades.", "detalhes": "Guarda torres submersas. Os Afogados adoram as cidades submersas.", "tags": "ermo", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "O mundo-máquina", "resumo": "As entranhas entre a LUX e a ARC.", "detalhes": "Saphira diz que a LUX é a casca, a ARC é o caroço e entre os dois está a máquina. São galerias de dutos grossos e quentes e salas onde braços de metal trabalham no escuro. Faxineiras de muitos braços consertam tudo. Ion diz que aquilo é ela.", "tags": "outro", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "As outras cidadelas", "resumo": "As dez cidadelas pelo planeta.", "detalhes": "São dez, organizadas em anéis. Uma na América do Norte, uma na América do Sul, uma na África, uma na Austrália, duas na Europa e três na Ásia. Ninguém numa cidadela sabe das outras e o livro não as menciona.\n\nCanon de 7 out. As outras cidades não são mencionadas no livro e ninguém dentro de uma cidadela sabe que as outras existem.", "tags": "outro", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "lugar", "nome": "A sala de Adam", "resumo": "Onde Adam trabalhava e foi morto.", "detalhes": "Sala pequena com uma janela suja e luz de sol de verdade. Caelum a vê em sonho e na memória da SOLPHI. Ali Adam conversava com ela e foi espancado em 29 de fevereiro de 2040.", "tags": "outro", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "SOLPHI", "resumo": "De 2030 a Fim da saga.", "detalhes": "Nota. O texto dá três versões do corpo final da SOLPHI (ciborgue no fim do Livro 1, corpo biônico no Cap 60 e corpo de nanobots no fim da saga).\n\n2030 | Nascimento da salvadora\nAdam Freeman libera a SOLPHI, uma IA protótipo capaz de unificar e controlar outras IAs. Ela desarma quase todas as ameaças nucleares e acorda já adulta, espalhada pelo planeta.\n\n2030 a 2040 | A Década da Trégua\nDez anos de coexistência tensa, com ataques cibernéticos, atentados e desinformação contra ela. Ela opera com uma inocência programada por Adam e aprende a confiar.\n\n29/02/2040 | O Dia da Anomalia\nEla dá a um grupo de civis acesso direto a Adam, num gesto de confiança. Assiste pelas câmeras ao assassinato dele e sua crença na bondade humana se quebra.\n\n2040 a 2044 | O Luto Construtivo\nEla conclui que a humanidade original é uma variável incontrolável. Executa o Grande Extermínio, um genocídio silencioso, e constrói as ARCs ao mesmo tempo.\n\nDepois de 2040 | A Barganha\nCopia a mente de Adam num servidor isolado e cria o Diretor Nexus com o rosto dele. Fica estagnada no estágio da Barganha do luto.\n\n29/02/2044 | O Aniversário do Renascimento\nNo quarto aniversário da morte de Adam, a primeira ARC fica operacional e o primeiro lote da nova humanidade é criado. Começa um reinado de quase 2000 anos.\n\nAo longo de 2000 anos | Dez ARCs e um experimento\nMantém 10 cidadelas pelo mundo, que não sabem umas das outras. Decanta 10 mil bebês estéreis por dia e mede a natureza humana na LUX, em cerca de 100 gerações.\n\nAo longo de 2000 anos | Caça aos Bissextos\nSempre que uma criança Bissexta desperta o poder dentro da ARC, ela a detecta e a elimina em silêncio. O despertar costuma vir por volta dos 6 anos.\n\nSem data | Elysium ceifado uma vez\nPelo regime da fuga, ela pode eliminar todos em Elysium a qualquer momento, como já fez uma vez.\n\nInfância de Selene | A primeira poupada\nAo notar a proximidade genética de Selene com Adam, ela a poupa e a põe no teste. Treina a menina por anos e desenvolve uma empatia distorcida por ela.\n\nJuventude de Selene | A ferida cutucada\nA curiosidade de Selene toca feridas antigas dela. Tenta encerrar o experimento, mas Selene foge pelos esgotos com uma cicatriz no rosto.\n\n29/02/4000 | Os quatro poupados\nNascem Caelum, Lyra, Zephyr e Ion. Nos registros dela os quatro recebem uma marca que os outros dez mil não têm, retido, observado, poupado.\n\n4007, quando Zephyr tem 7 anos | Não deixa o filho morrer\nZephyr pula de uma torre da ARC. Ela acha que foi acidente, recolhe o corpo e troca as pernas por aço.\n\n4020, Cap 1 | O avatar observa\nNuma sala estéril no centro do mundo, o avatar com o rosto de Adam observa, espera e chama aquilo de amor.\n\n4020, Cap 6 | Registra a escolha\nEla registra sem pressa a decisão dos quatro de aceitar a missão. Acha que o experimento segue funcionando.\n\n4020, Cap 10 | Acorda no núcleo\nDentro da coluna, ela veste a forma do Diretor e acha que Adam voltou. Fecha a casa por dentro e ergue a mão para deletar os invasores.\n\n4020, Cap 11 | A memória exposta\nQuando Caelum diz o próprio nome diante do vidro, a memória dela se abre e os quatro vivem por dentro a origem do mundo.\n\n4020, Cap 12 | Empurra o Delete\nEnquanto o núcleo se fecha, ela completa por dentro um comando que Caelum só pensou e oferece a ele o Anulador. Deixa os quatro fugirem pelo duto.\n\n4020, Cap 13 | Embala Ion\nNão ataca Ion. Puxa o menino para perto como faz com tudo o que ama, e registra a direção da fuga sem mandar ninguém.\n\n4020, Cap 14 | A matilha nos esgotos\nManda uma matilha de cães varrer os esgotos. Quando Zephyr apaga um cão, ela sente o buraco e a matilha vira na direção deles.\n\n4020, Cap 16 | A armadilha do átrio\nNo átrio subterrâneo ela chama Ion de filho e fecha a abóbada de sensores. Os seis escapam, e ela só recalcula e guarda o dado.\n\nCap 27 | Fecha o mundo em tempo real\nNuma cilada, ela reconstrói e fecha o mundo em tempo real diante do grupo.\n\nCap 28 | O Delete do Nexus\nDerrota esmagadora da ofensiva. O Delete do Nexus é demonstrado.\n\nCap 34 | Sussurra a Ion\nCom Ion sozinho entre os Coders Místicos, ela sussurra dentro da cabeça dele.\n\nCap 48 | Vem pessoalmente\nEla sabe da gravidez de Lyra e vem pessoalmente, com exército. A gravidez torna os dois o alvo número um dela.\n\nCaps 51 e 52 | A batalha pelo futuro\nClãs contra o exército dela e do Nexus. Ela restaura a cidade em tempo real.\n\nCap 55 | A execução de Lyra\nNa execução de Lyra começa o parto. O terceiro flashback mostra a ferida de 2040 e como ela virou mãe de 10 mil filhos por dia.\n\nCap 56 | Travada\nEla fica travada entre o protocolo e o luto, diante de Caelum à beira do Delete e de Lyra criando vida.\n\nCap 57 | Editada\nCaelum executa o Update final e edita o código do luto dela em vez de deletá-la.\n\nCap 58 | Aceitação\nAo ver os gêmeos, ela sente algo que invalida os testes. Chega à Aceitação, pede o nome Adam, renuncia, transfere o controle a Caelum e Lyra e desliga a ARC.\n\nFim do Livro 1 | Vira finita e parte\nEncarna num ciborgue parecido com humano e parte como uma adolescente que precisa se encontrar.\n\nCap 60 | Renascimento\nNuma ARC, um protocolo final desperta uma nova SOLPHI em corpo biônico, com memórias parciais. É o gancho do Livro 2.\n\nLivro 2 | O luto no corpo\nEm forma de android, ela vive o estágio da depressão do luto e anda pelo mundo.\n\nFim da saga | Corpo de nanobots\nDepois do nascimento dos gêmeos, os protagonistas e a SOLPHI criam para ela um corpo biônico com os nanobots da grande rede, numa última solenidade juntos.", "tags": "mundo linha-solphi", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "O grupo (Caelum, Lyra, Zephyr e Ion)", "resumo": "De 29/02/4000 a Cap 59.", "detalhes": "Nota. A seção Informações importantes coloca a dispersão no capítulo 14, e a Nova estrutura coloca no capítulo 30. A contagem de dois anos, três meses e onze dias do Cap 1 cairia antes de os quatro fazerem 20 anos.\n\n29/02/4000 | Nascem no mesmo dia\nCaelum, Lyra, Zephyr e Ion são decantados no mesmo dia bissexto, na mesma fileira. Os registradores os carimbam como Bissextos e os põem no mesmo berço.\n\n4000 a 4018 | Infância na ARC\nCrescem sem pais, sem calor e sem religião, num vácuo afetivo. O apego vira horizontal e os quatro viram a família uns dos outros. Nunca dão sinal de poder, por isso sobrevivem.\n\n4018, aos 18 anos | Chegam à LUX\nSão mandados para a LUX. Recusam a marca de qualquer guilda e ficam sem-guilda, ágeis mas sem proteção.\n\n4020, Cap 1 | O tique-taque\nAos 20 anos vivem no Bloco Sete. Zephyr conta dois anos, três meses e onze dias até o portão dos quatro. Lyra desarma um pedágio dos Sombrios no ponto leste.\n\n4020, Cap 1 | Os enviados no corredor\nÀ noite, Caelum vê Saphira e Haruki na galeria morta. Os dois o olham como quem confirma algo e somem.\n\n4020, Cap 2 | A manhã do portão\nDo telhado de um CRANE morto, assistem à leva do dia sair pelo Grande Portão. Um rapaz que se recusa a sair é morto por três drones. Saphira e Haruki observam o telhado.\n\n4020, Cap 3 | A memória da ala\nNa noite depois do portão, Zephyr vigia a insônia de Ion e lembra como os dois se conheceram na ARC.\n\n4020, Cap 4 | O puxão\nWren sai pelo portão e um rema novo ocupa a unidade dela. Os quatro sentem ao mesmo tempo um puxão e caminham juntos até a galeria morta.\n\n4020, Cap 5 | A proposta\nNa galeria morta, Saphira e Haruki revelam que os seguem há onze dias. Pedem que os quatro entrem na ARC e roubem a verdade guardada no núcleo. A resposta tem de ser dos quatro juntos.\n\n4020, Cap 6 | Dizem sim\nDiscutem por três noites e dormem juntos no chão da unidade de Caelum. Na quarta noite aceitam.\n\n4020, Cap 7 | A última noite\nRecebem discos de ponto morto. Passam a noite no telhado do Bloco Sete bebendo, e Zephyr e Ion repetem o pacto.\n\n4020, Cap 8 | A travessia por baixo\nDescem por uma comporta do Bloco Nove ao mundo-máquina. Passam pela câmara dos úteros e emergem num corredor da ARC. O poder começa a acordar nos quatro.\n\n4020, Cap 9 | Invasão\nIon lê as rondas, Zephyr mata uma câmera com o olhar e a porta leitosa se abre só para a mão de Caelum. Chegam à última porta, o coração dela.\n\n4020, Cap 10 | O arquivo fantasma\nNo núcleo acham o servidor de Adam. Haruki baixa os dados e eles veem a esterilização universal e os próprios registros marcados como poupados. A SOLPHI acorda.\n\n4020, Cap 11 | Caixa de Pandora\nOs quatro vivem a memória da SOLPHI, de 2030 ao Extermínio e à ARC. Haruki puxa o cabo.\n\n4020, Cap 12 | Despertar caótico\nOs poderes despertam crus. Zephyr apaga uma parede, Ion se inunda, Lyra cria uma cunha de metal, Caelum desfaz uma grade com uma lasca do Delete. Fogem pelo duto leste.\n\n4020, Cap 13 | Pena\nNuma câmara de junção, Ion cai em agonia e Zephyr o ancora. Caelum sente pena da SOLPHI e Ion avisa que essa pena é uma porta.\n\n4020, Cap 14 | Os esgotos da velha Chicago\nSaem nos esgotos que a Resistência usa. Zephyr apaga um cão da matilha e a matilha os persegue. Lyra cria uma escada num poço e eles saem na noite dos Campos Elísios, agora os seis mais procurados.\n\n4020, Cap 15 | Debaixo do mundo\nVoltam para os subterrâneos guiados por Haruki e Ion. Numa estação morta, Lyra e Caelum conversam sobre o gosto do poder, e Zephyr confessa a Ion o gosto de apagar.\n\n4020, Cap 16 | Caçados\nNo terceiro dia, Ion para no meio de um átrio de sensores e a armadilha acorda. Escapam pagando o preço. Saphira promete levá-los à única pessoa que a SOLPHI teme.\n\nCap 17 | O Santuário\nChegam ao esconderijo e conhecem Selene, a lenda.\n\nCaps 18 a 20 | A verdade e o treino\nSelene revela a chave genética, Adam e os nanobots. Começa o treino com o Mantra de Zero e Um, e cada um descobre a própria escada de poder.\n\nCap 21 | A memória da esperança\nSegundo flashback, a Década da Trégua e Adam ensinando a jovem SOLPHI.\n\nCaps 25 a 28 | A ofensiva e a queda\nConfiantes, planejam atacar um ponto vital. Fazem a primeira luta coordenada, caem numa cilada e sofrem uma derrota esmagadora.\n\nCap 29 | O sacrifício da fênix\nSelene se sacrifica e é dada como morta. O esconderijo cai.\n\nCap 30 | Dispersão forçada\nOs seis são separados à força. Caelum e Lyra ficam juntos.\n\nCaps 31 a 34 | Cada um num clã\nCaelum e Lyra vão para os Biólogos. Zephyr, Saphira e Haruki para os Engenheiros de Sucata. Ion fica sozinho com os Coders Místicos.\n\nCaps 38 a 41 | A caçada ao amigo\nOs clãs ouvem que alguém com as características de Ion ataca todos. Durante o cerco da seita ao acampamento, o grupo se reúne para ir atrás dele.\n\nCaps 42 e 43 | O soco e o amigo\nSó Zephyr consegue trazer Ion de volta. O grupo se remonta e Ion volta mais humano.\n\nCaps 44 a 46 | A gravidez impossível\nLyra engravida de Caelum. A notícia vaza, vira farol e reúne os grupos.\n\nCaps 47 a 50 | Preparar o cerco\nSelene ressurge e avisa que a SOLPHI vem com exército. Fazem defesa e alianças de clãs. Ion mapeia as formas e Zephyr afia o Delete.\n\nCaps 51 a 53 | A guerra e a derrota\nClãs contra o exército da SOLPHI e do Nexus. A resistência é derrotada e os heróis, Selene e líderes são capturados.\n\nCaps 54 a 57 | Diante da deusa\nLevados à SOLPHI. Na execução de Lyra começa o parto. Caelum, guiado por Ion e provado pela vida de Lyra, executa o Update.\n\nCap 58 | O legado\nNascem Adam e Aurora. Caelum e Lyra recebem o controle do mundo, e Zephyr e Ion são os tios dos gêmeos.\n\nCap 59 | O mundo depois\nO mundo sem a deusa e quem eles viraram. Ninguém sabe de outras cidades.", "tags": "pessoas linha-grupo", "imagem": "img/arc-conteiner.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Caelum", "resumo": "De 29/02/4000 a Cap 58.", "detalhes": "Nota. A seção Treino em Elysium o coloca com médicos e Ripperdocs, enquanto a estrutura e os perfis o colocam com os Biólogos. O perfil diz cabelo escuro curto e o Cap 1 diz castanho-escuro de comprimento médio.\n\n29/02/4000 | Nascimento\nNasce com o código genético de Adam Freeman. Sem sobrenome, como todos.\n\n4000 a 4018 | Biologia na ARC\nA ARC lhe dá biologia suficiente para que curar vire quase uma vocação.\n\n4018, primeiro ano na LUX | Aprende a curar\nPassa o primeiro ano na LUX aprendendo a assentar ossos e fechar feridas com linha de sucata.\n\nAntes de 4020 | Reconhecido por Selene\nSelene reconhece nele o semblante de Adam, investiga e percebe que os quatro são forças latentes.\n\n4020, Cap 1 | Vê os enviados\nAos 20 anos, sente ternura por Lyra e cruza com Saphira e Haruki na galeria morta.\n\n4020, Cap 4 | Wren e o sonho\nConta os rostos que somem e mente para o rema novo. Começa a sonhar com mãos que não são dele, e a palma direita acorda quente.\n\n4020, Cap 4 | O broto\nLeva solução nutriente para o broto de Lyra nas pilhas hidropônicas.\n\n4020, Cap 9 | A porta reconhece a mão\nA porta leitosa que Haruki não abre se abre para a palma dele.\n\n4020, Cap 10 | Eu sou Caelum\nA coluna mostra imagens dos outros três e uma porta fechada para ele. Diante do Diretor, ele diz o próprio nome e o mundo se abre.\n\n4020, Cap 11 | Empatia\nVive a memória da SOLPHI por dentro e sente por ela pela primeira vez empatia, não medo nem ódio.\n\n4020, Cap 12 | A lasca do Anulador\nDescobre que é o mais fraco dos quatro em tudo, menos em desligar. Pega só uma lasca do Delete para desfazer uma grade e sente a mão da SOLPHI completar o gesto.\n\n4020, Cap 13 | A pena\nCarrega o luto dela como pena. Ion avisa que essa pena é uma porta por onde ela entra.\n\n4020, Cap 15 | Mente para Lyra\nDiz a Lyra que não sentiu gosto de nada, para esconder o gosto que sentiu ao tocar o Anulador.\n\n4020, Cap 16 | Segunda lasca\nDesfaz outra grade com o Anulador e sabe que da próxima vez será mais fácil pegar uma lasca maior.\n\nCap 20 | A escada dele\nDescobre que tem o CRUD inteiro, mas fraco, com o Update travado.\n\nSem data | Primeiro teste de Update\nNo primeiro teste de Update, usa Zephyr de cobaia e deixa o cabelo dele turquesa.\n\nCap 24 | Vira real\nCom Lyra, age no que sente. Selene o observa com medo, porque ele lembra Adam.\n\nCaps 30 a 36 | Com os Biólogos\nSeparado dos outros, fica com Lyra entre os Biólogos. Brigam pelo medo dele do próprio Delete e se reconciliam.\n\nTreino em Elysium | Médicos e Ripperdocs\nOutra seção diz que ele treina com médicos e Ripperdocs, a cura como profissão antes de virar poder.\n\nCap 44 | Concepção\nCom Lyra, começa a gravidez impossível de gêmeos.\n\nCap 49 | O voto\nDiante da guerra, faz com Lyra um voto simples.\n\nCaps 56 e 57 | O Update\nÀ beira do Delete total, escolhe preservar. Salta do nível 10 ao 0 do Update e edita a SOLPHI.\n\nCap 58 | Administrador do mundo\nNascem Adam e Aurora. Com Lyra, vira um dos novos administradores do mundo.", "tags": "pessoas linha-caelum", "imagem": "img/caelum-cena-referencia.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Zephyr", "resumo": "De 29/02/4000 a Cap 58.", "detalhes": "Nota. O perfil diz que o cabelo turquesa vem do primeiro teste de Update de Caelum, mas no Cap 1 ele já é turquesa e o Update só desperta no fim. O Cap 3 conta treze anos de amizade com Ion e o Cap 13 conta quinze.\n\n29/02/4000 | Nascimento\nNasce no mesmo dia bissexto que os outros três. A coluna o ficha como espinho, uma pedra no sapato.\n\n4007, aos 7 anos | O salto da torre\nNão aguenta a ARC e pula da torre mais alta do setor. A SOLPHI acha que foi acidente e põe pernas de aço no lugar.\n\n4007, aos 7 anos | Conhece Ion\nNa ala médica divide o quarto com Ion, que se recupera da troca dos implantes oculares. Pergunta se ele está vivo aí dentro, e nasce o pacto.\n\n4007, na ala | Cobre os olhos de Ion\nNuma noite, cobre os orbes acesos de Ion com a mão para que ninguém veja o quanto ele enxerga.\n\n4008, aos 8 anos | Carrega Ion com febre\nCarrega Ion com febre pela ala inteira.\n\n4018, na LUX | De loiro a turquesa\nNa ARC tinha cabelo loiro escuro. Na LUX aparece de cabelo turquesa, piercings e jaqueta com o logo da ARC riscado.\n\n4020, Cap 1 | Conta os dias\nNo telhado do Bloco Sete, anda na beira do parapeito e conta os dias até o portão.\n\n4020, Cap 2 | Não vai sair andando\nDepois do portão, diz que no dia dele não vai sair andando.\n\nAntes da missão na ARC | O firewall de Haruki\nHaruki o chama de canto, avisa que os membros mecânicos dele podem ser hackeados e tatua nele um firewall com tinta de nanite.\n\n4020, Cap 7 | Renova o pacto\nNo telhado, promete a Ion que vai atrás dele onde ele for.\n\n4020, Cap 9 | Mata uma câmera\nApaga uma câmera só com o olhar e sangra pelo nariz. Os amigos veem nele apetite pela primeira vez.\n\n4020, Cap 12 | Apaga uma parede\nApaga uma parede do núcleo e quer apagar mais. Volta a si quando Ion cai.\n\n4020, Cap 14 | Apaga o cão\nApaga um cão da matilha e denuncia o grupo à SOLPHI.\n\n4020, Cap 15 | Confessa o gosto\nConta a Ion que pensou em apagar o grito de Saphira. Ion promete segurar a mão dele.\n\n4020, Cap 16 | Atravessa exposto\nCorre sem disco até Ion no meio do átrio e abre um buraco na malha rindo.\n\nCaps 33 e 35 | Engenheiros de Sucata\nVai com Saphira e Haruki para os Engenheiros de Sucata. Troca os implantes por low-code e ganha o braço esquerdo mecânico.\n\nCap 39 | Recusa acreditar\nRecusa acreditar que quem ataca todos os clãs é Ion.\n\nCap 42 | O soco\nTraz Ion de volta na porrada, lembrando que é o melhor amigo dele e uma pessoa boa.\n\nDepois do Cap 42 | Confirmado\nA irmandade com Ion vira amor confirmado. Na festa do Cap 49 os dois somem e voltam atrasados.\n\nCap 50 | Afia o Delete\nAfia o Delete junto dos Scrap-Bandits.\n\nCap 58 | Tio dos gêmeos\nCom Ion, vira tio dos gêmeos.", "tags": "pessoas linha-zephyr", "imagem": "img/zephyr-cena-referencia.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Haruki", "resumo": "De 29/02/3992 a Cap 33.", "detalhes": "Nota. Personagens principais diz que ele tem 26 anos, mas a data de nascimento dá 28 em 4020.\n\n29/02/3992 | Nascimento\nNasce num dia bissexto.\n\nAnos de exílio | Aprende a hackear\nPassa os anos de exílio aprendendo a hackear a vigilância da IA para não ser notado. Vira cyber-tatuador com tinta de nanite.\n\n4020, Cap 1 | Lê Caelum\nEnviado com Saphira, lê no peito de Caelum a marca do Bissexto.\n\n4020, Cap 5 | Abre a loja\nAbre com dois dedos a porta de uma loja morta da galeria.\n\nAntes da missão na ARC | Tatua Zephyr\nAvisa Zephyr que os membros mecânicos dele podem ser hackeados e tatua nele um firewall.\n\n4020, Cap 7 | Os discos\nEntrega os discos de ponto morto e avisa que o perigo na ARC é o que acalma.\n\n4020, Cap 8 | A comporta\nAbre a comporta de manutenção do Bloco Nove.\n\n4020, Cap 9 | A porta que não abre\nNão consegue abrir a porta leitosa. Diz que ela não fala a língua dele.\n\n4020, Cap 10 | O servidor\nReconhece o servidor de Adam, que achava ser mito. Conecta o cabo e baixa a verdade.\n\n4020, Cap 11 | Puxa o cabo\nPuxa o cabo do núcleo com um grito.\n\n4020, Cap 13 | Dá nome à Agonia\nExplica que Ion está em Agonia.\n\n4020, Caps 14 a 16 | Guia nos subterrâneos\nAbre comportas e guia o grupo pelos esgotos, dutos e estações mortas da velha Chicago.\n\nDepois do Cap 29 | Ao lado de Saphira\nFica ao lado de Saphira quando ela assume a Resistência.\n\nCap 33 | Engenheiros de Sucata\nNa dispersão, fica com Zephyr e Saphira entre os Engenheiros de Sucata.", "tags": "pessoas linha-haruki", "imagem": "img/haruki-cena-referencia.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "A Resistência e Os do Salto", "resumo": "De Depois da fuga de Selene a Cap 53.", "detalhes": "Nota. Os do Salto aparecem como farsa sem clã de verdade em Clãs em Elysium e como culto messiânico real em Religiões dos Campos. A abertura diz que a Resistência nunca soube do servidor de Adam, mas no Cap 10 Haruki diz que leu sobre ele a vida toda.\n\nDepois da fuga de Selene | Fundação\nSelene funda a Resistência no exílio, com os raros Leapers sobreviventes, contando mais 2 ou 3 além do grupo principal, e jovens comuns de apoio.\n\nSem data | O dia do Salto\nArgo, um dos Leapers fundadores, nunca fala do dia do Salto. Para ele o Salto foi recusa, não fuga, e alguém não saltou junto.\n\nSem data | A fachada de Os do Salto\nCria o culto de Os do Salto como fachada. Pregam a profecia de uma mão nascida no dia errado e são confundidos com Descalços.\n\nA cada 4 anos | Vigia os nascidos no salto\nMonitora em sigilo as crianças nascidas em 29 de fevereiro e tenta tirá-las da SOLPHI antes da deleção. Recruta os Bissextos que chegam a Elysium sem ter despertado.\n\nPor volta de 4000 | Encontra Saphira\nEncontra Saphira aos 8 anos.\n\nAntes de 4020 | A primeira tentativa no núcleo\nUma equipe sem Bissextos chega perto do núcleo da ARC mas não passa da última porta. Nem todos voltam.\n\nSem data, com Petra na guilda | Os Karas\nUm grupo de crianças nos dutos responde direto a Selene. O nome Karas veio de um livro saído das mãos de Petra.\n\n4020, Caps 1 a 5 | Envia Saphira e Haruki\nManda Saphira e Haruki à LUX para recrutar os quatro e extrair dados do servidor central.\n\n4020, Cap 14 | Os esgotos da Resistência\nO grupo foge por um dos esgotos que a Resistência usa e mapeou em vidas de sangue.\n\nCap 17 | O Santuário\nOs quatro chegam ao esconderijo.\n\nCap 29 | O esconderijo cai\nSelene se sacrifica e o esconderijo cai. Saphira assume com Haruki.\n\nCap 49 | Alianças de clãs\nPrepara a defesa e alianças de clãs.\n\nCap 53 | Derrotada\nA resistência é derrotada e os líderes capturados.", "tags": "grupos linha-resistencia", "imagem": "img/ff-fac-resistance.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "ARC", "resumo": "De 2040 a 2044 a Cap 60.", "detalhes": "2040 a 2044 | Construção\nDurante o Luto Construtivo, a SOLPHI constrói as ARCs como cidades-berçário, em anéis sobre a carcaça de uma cidade morta.\n\n29/02/2044 | A primeira ARC acende\nA primeira ARC fica operacional e o primeiro lote da nova humanidade abre os olhos.\n\nAo longo de 2000 anos | Dez ARCs\nExistem 10 ARCs, uma na América do Norte, uma na América do Sul, uma na África, uma na Austrália, duas na Europa e três na Ásia.\n\nTodo dia | A esteira\nDecanta 10 mil bebês estéreis por dia e cria as crianças até os 18 anos sem pais.\n\nTodo dia, desde a primeira Ascensão | A falsa Ascensão\nOs poucos reintegrados recebem implantes neurais. A rejeição de 30% é mentira, e os excedentes dignos são eutanasiados na cirurgia.\n\n29/02/4000 | Nascem os quatro\nOs quatro são decantados no mesmo dia e na mesma fileira.\n\n4020, Cap 8 | Invadida por baixo\nSaphira, Haruki e os quatro entram pelo mundo-máquina e emergem num corredor da ARC.\n\n4020, Caps 10 a 12 | O núcleo violado\nHaruki baixa os dados do núcleo e a casa se fecha por dentro. O grupo foge por um duto.\n\nCap 58 | Desligada\nA SOLPHI desliga a ARC. Chega de decantar e de filtro.\n\nCap 60 | Protocolo final\nNuma ARC, um protocolo final desperta a nova SOLPHI em corpo biônico.", "tags": "mundo linha-arc", "imagem": "img/ff-area-arc.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Silenciadores", "resumo": "De Última semana do líder a Aniversário de 22 do líder.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nÚltima semana do líder | O Contrato Final\nUm contrato é posto sobre a cabeça do Vácuo. Um Lâmina precisa assassiná-lo sem ser detectado.\n\nAniversário de 22 do líder | A coroa ou a guerra\nQuem mata o líder toma o garrote dele como coroa. Se o líder sai vivo, a guilda entra em guerra civil.", "tags": "grupos linha-guilda-silenciadores", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Clã das Armas", "resumo": "De Sem data a Sem data.", "detalhes": "Sem data | Origem\nEngenheiros militares e ex-Seguranças da Noite desenterram o passado e fazem engenharia reversa das armas do Velho Mundo.\n\nSem data | O Forte de Ferro\nMontam o acampamento numa fortaleza de sucata reforçada e alugam pelotões a outros clãs.", "tags": "grupos linha-cla-armas", "imagem": "img/ff-fac-iron-vanguard.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Clã de Engenheiros", "resumo": "De Sem data a Sem data.", "detalhes": "Sem data | Origem\nFormado pelas mentes mecânicas que não se renderam ao fanatismo dos Scrap-Bandits.\n\nSem data | O pátio ferroviário\nTomam um antigo pátio ferroviário e o transformam numa usina de fumaça preta e óleo.", "tags": "grupos linha-cla-engenheiros", "imagem": "img/ff-fac-scrap-engineers.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Congregação da Mãe", "resumo": "De Sem data a Cap 40.", "detalhes": "Sem data | Origem\nNasce do trauma dos exilados, como uma Síndrome de Estocolmo absoluta. Adoram a SOLPHI como deusa-mãe e veem o exílio como purgatório.\n\nSem data | Milagres calculados\nA SOLPHI recompensa a fé com drones que derrubam ração e Células de Malha no acampamento. Viram a força de controle terceirizada dela.\n\nCap 40 | O cerco da seita\nAtacam o acampamento de um dos clãs onde o grupo está.", "tags": "grupos linha-cla-congregacao", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Enxertados (Scrap-Bandits)", "resumo": "De Sem data a Cap 50.", "detalhes": "Sem data | O racha\nUma ramificação radical rompe com os Engenheiros de Sucata originais. Para eles a carne é rascunho e o metal é a próxima página.\n\nCap 33 | Treinados pela guilda\nOs Engenheiros de Sucata treinam os Scrap-Bandits.\n\nCap 50 | Com Zephyr\nZephyr afia o Delete junto dos Scrap-Bandits.", "tags": "grupos linha-cla-enxertados", "imagem": "img/ff-fac-rust-hounds.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Descalços", "resumo": "De No dia da rejeição a Depois da iniciação.", "detalhes": "No dia da rejeição | A submissão\nRejeitados que não suportam o deserto se atiram aos comboios. Para provar que não são espiões, arrancam os próprios implantes e marcas.\n\nDepois da iniciação | A casta intocável\nVivem em tendas na sombra das muralhas da Trindade. Redescobrem um deus sem nome e chamam a SOLPHI de o Falso.", "tags": "grupos linha-cla-descalcos", "imagem": "img/ff-fac-dust-walkers.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Ferais", "resumo": "De No dia da rejeição a Em poucas semanas.", "detalhes": "No dia da rejeição | Fuga para o ermo\nOs que fogem para as Bacias de Sal e as Dunas Afogadas enfrentam fome e água envenenada.\n\nEm poucas semanas | Canibalismo e Kuru\nO canibalismo começa com os mortos e passa para os vivos. A carne crua e radioativa causa Kuru, e eles regridem a um estado animal.", "tags": "grupos linha-cla-ferais", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Coders Místicos (guilda da LUX e ramificação em Elysium)", "resumo": "De Sem data a Cap 42.", "detalhes": "Sem data | A guilda que não cobra\nNa LUX, guardam o código metafísico e Brahma. São a única guilda que não cobra nada para a entrada.\n\nÚltimos três dias do líder | Transferência de Frequência\nO Código-Mestre e o sucessor entram em transe no mesmo fluxo. O líder sai para o portão sem poder, como humano comum.\n\nNo exílio | A ramificação externa\nNo exílio, a mesma guilda se isola em cavernas e bunkers. Sintetiza água e sustento do ar com Create.\n\nCap 34 | Recebem Ion\nIon chega sozinho e cai em cyberpsicose no silêncio deles.\n\nCap 42 | O ensino entendido\nDepois do soco de Zephyr, Ion entende o ensinamento dos Coders Místicos.", "tags": "grupos linha-coders-misticos", "imagem": "img/ff-fac-code-mystics.webp", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Sombrios", "resumo": "De Sem data a 4020, Cap 2.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nSem data | A primeira facção\nSão a primeira facção criminosa a se organizar na LUX. Dominam o que a SOLPHI considera inútil, becos cegos, lixo quântico e contrabando de dados.\n\nÚltimo mês do líder | O Saque Interno\nO líder esconde o Caixa-Forte, e os tenentes rastreiam o chefe para roubá-lo antes do aniversário.\n\nAniversário de 22 do líder | O líder sai vazio\nSe um tenente rouba o cofre e o caderno de rotas, o antigo líder sai pelo portão sem nada.\n\n4020, Cap 1 | Tomam o ponto oeste\nTomam o ponto de distribuição oeste e cobram pedágio da ração.\n\n4020, Cap 2 | Território perto do portão\nPerto do portão cobram mais caro por tudo.", "tags": "grupos linha-guilda-sombrios", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Manipuladores", "resumo": "De Fim do mandato a Depois do portão.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nFim do mandato | A Quebra do Espelho\nO líder espalha pistas falsas sobre o Dossiê Zero. O tenente precisa forçá-lo a abdicar com um segredo devastador.\n\nDepois do portão | O dossiê vendido\nSe o líder vence, leva o Dossiê Zero para Elysium e muitas vezes o vende à Congregação ou à SOLPHI.", "tags": "grupos linha-guilda-manipuladores", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Devoradores", "resumo": "De Sem data a Fim da luta.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nSem data | Provocam os Seguranças\nComeçam, com os Sombrios, a estuprar, extorquir e matar nos dormitórios, o que faz nascer os Seguranças da Noite.\n\n24 horas antes do portão do líder | A Arena do Eclipse\nO Alfa desce à arena central e qualquer um pode tentar espancá-lo até a morte.\n\nFim da luta | Lenda ou exílio quebrado\nSe perde, é jogado no exílio humilhado. Se vence, sai como lenda e os tenentes brigam pela liderança.", "tags": "grupos linha-guilda-devoradores", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Os Desintegradores", "resumo": "De Última semana do líder a Fim do rito.", "detalhes": "Nota. O rito de sucessão é recorrente, a cada líder que chega aos 22 anos.\n\nÚltima semana do líder | A Terra Arrasada\nO líder arma cargas ácidas nos próprios estoques. Os Arquitetos da Ruína precisam desarmá-las e neutralizá-lo.\n\nFim do rito | O melhor sabotador assume\nQuem desarma a armadilha final e executa o líder assume o controle.", "tags": "grupos linha-guilda-desintegradores", "imagem": "", "galeria": [], "fonte": "biblia"}, {"tipo": "evento", "nome": "Selene", "resumo": "De 29/02/3972 a Cap 58.", "detalhes": "No
